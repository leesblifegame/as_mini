function fitCanvas(){
  const w = window.innerWidth  || document.documentElement.clientWidth  || CW;
  const h = window.innerHeight || document.documentElement.clientHeight || CH;
  const s = Math.min(w / CW, h / CH);
  canvas.style.width  = Math.round(CW * s) + 'px';
  canvas.style.height = Math.round(CH * s) + 'px';
}

const imgs = {};
let loadedCount = 0, totalAssets = 0;
function loadAssets() {
  totalAssets = Object.keys(ASSET_KEYS).length;
  for (const [k, src] of Object.entries(ASSET_KEYS)) {
    const img = new Image();
    img.onload = img.onerror = () => ++loadedCount;
    img.src = src; imgs[k] = img;
  }
}
const ok = k => { const i = imgs[k]; return i && i.complete && i.naturalWidth > 0; };

function drawLoading(){
  ctx.fillStyle = '#03111f';
  ctx.fillRect(0, 0, CW, CH);

  // Title
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#7dcfff';
  ctx.font = 'bold 32px Arial';
  ctx.fillText('아쿠아서바이벌', CW/2, CH/2 - 80);
  ctx.font = '20px Arial';
  ctx.fillStyle = '#38b7ff';
  ctx.fillText('생존자 보호', CW/2, CH/2 - 42);

  // Progress bar
  const bw = 300, bh = 20, bx = (CW - bw) / 2, by = CH/2 + 10;
  const prog = totalAssets > 0 ? loadedCount / totalAssets : 0;

  const rrLoad = (x,y,w,h,r)=>{
    if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }
    else { ctx.beginPath(); ctx.rect(x,y,w,h); }
  };

  // Bar BG
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  rrLoad(bx, by, bw, bh, 10); ctx.fill();

  // Bar fill
  if(prog > 0){
    const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    g.addColorStop(0, '#1a6bb5'); g.addColorStop(1, '#38b7ff');
    ctx.fillStyle = g;
    rrLoad(bx, by, Math.max(bw * prog, 18), bh, 10); ctx.fill();
  }

  // Bar border
  ctx.strokeStyle = 'rgba(80,180,255,0.4)'; ctx.lineWidth = 1;
  rrLoad(bx, by, bw, bh, 10); ctx.stroke();

  // Percent text
  ctx.fillStyle = '#7dcfff'; ctx.font = '13px Arial';
  ctx.fillText(`로딩 중... ${Math.round(prog * 100)}%`, CW/2, by + bh + 22);
}

// Audio: procedural BGM + SFX tuned for mobile web play without external files.
const AudioSys = {
  ctx:null, master:null, bgmGain:null, sfxGain:null, noiseBuffer:null,
  unlocked:false, beat:0, cooldowns:Object.create(null), lastBgmAt:0,
  init(){
    if(this.ctx) return;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    this.ctx = new Ctx();
    this.master = this.ctx.createGain();
    this.bgmGain = this.ctx.createGain();
    this.sfxGain = this.ctx.createGain();
    this.master.gain.value = 0.8;
    this.bgmGain.gain.value = 0.18;
    this.sfxGain.gain.value = 0.32;
    this.bgmGain.connect(this.master);
    this.sfxGain.connect(this.master);
    this.master.connect(this.ctx.destination);
    this.noiseBuffer = this.makeNoiseBuffer();
  },
  async unlock(){
    this.init();
    if(!this.ctx) return;
    try{
      if(this.ctx.state !== 'running') await this.ctx.resume();
      this.unlocked = true;
    }catch(e){}
  },
  makeNoiseBuffer(){
    if(!this.ctx) return null;
    const len = Math.max(1, Math.floor(this.ctx.sampleRate * 0.25));
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0;i<len;i++) data[i] = (Math.random()*2-1) * (1 - i/len);
    return buf;
  },
  canPlay(key, ms){
    const now = performance.now();
    if((this.cooldowns[key]||0) > now) return false;
    this.cooldowns[key] = now + ms;
    return true;
  },
  env(g, when, attack, decay, peak, end=0.0001){
    g.gain.cancelScheduledValues(when);
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(peak, when + attack);
    g.gain.exponentialRampToValueAtTime(end, when + attack + decay);
  },
  tone(freq, dur, type, vol, when=0, slideTo=null){
    if(!this.unlocked || !this.ctx) return;
    const t = this.ctx.currentTime + when;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
    this.env(g, t, 0.003, dur, vol);
    o.connect(g); g.connect(this.sfxGain);
    o.start(t); o.stop(t + dur + 0.03);
  },
  noise(vol, dur, hp=600, lp=6000, when=0){
    if(!this.unlocked || !this.ctx || !this.noiseBuffer) return;
    const t = this.ctx.currentTime + when;
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuffer;
    const hpf = this.ctx.createBiquadFilter();
    hpf.type = 'highpass';
    hpf.frequency.value = hp;
    const lpf = this.ctx.createBiquadFilter();
    lpf.type = 'lowpass';
    lpf.frequency.value = lp;
    const g = this.ctx.createGain();
    this.env(g, t, 0.002, dur, vol);
    src.connect(hpf); hpf.connect(lpf); lpf.connect(g); g.connect(this.sfxGain);
    src.start(t); src.stop(t + dur + 0.04);
  },
  bgmNote(freq, dur, vol, when=0, type='triangle'){
    if(!this.unlocked || !this.ctx) return;
    const t = this.ctx.currentTime + when;
    const o = this.ctx.createOscillator();
    const lp = this.ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 1100;
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    this.env(g, t, 0.01, dur, vol);
    o.connect(lp); lp.connect(g); g.connect(this.bgmGain);
    o.start(t); o.stop(t + dur + 0.05);
  },
  play(name, data={}){
    if(!this.unlocked) return;
    switch(name){
      case 'ui': this.tone(720, 0.04, 'square', 0.06, 0, 930); break;
      case 'place':
        this.tone(410, 0.07, 'square', 0.08, 0, 520);
        this.tone(620, 0.05, 'triangle', 0.05, 0.02, 840);
        break;
      case 'upgrade':
        this.tone(480, 0.05, 'triangle', 0.06, 0, 720);
        this.tone(720, 0.06, 'triangle', 0.05, 0.04, 980);
        break;
      case 'sell':
        this.tone(680, 0.05, 'triangle', 0.05, 0, 520);
        this.tone(480, 0.07, 'sine', 0.04, 0.03, 320);
        break;
      case 'waveStart':
        this.tone(220, 0.18, 'sawtooth', 0.06, 0, 330);
        this.noise(0.03, 0.08, 1200, 5000, 0.01);
        break;
      case 'waveClear':
        this.tone(523, 0.08, 'triangle', 0.05, 0, 659);
        this.tone(659, 0.1, 'triangle', 0.05, 0.07, 784);
        break;
      case 'spawn': this.tone(240, 0.04, 'sine', 0.025, 0, 210); break;
      case 'shield': this.tone(980, 0.035, 'square', 0.04, 0, 760); break;
      case 'hit': this.tone(data.freq||520, 0.03, 'triangle', 0.025, 0, Math.max(180, (data.freq||520)-120)); break;
      case 'kill':
        this.tone(300, 0.05, 'square', 0.04, 0, 220);
        this.tone(180, 0.08, 'triangle', 0.03, 0.02, 120);
        break;
      case 'leak': this.tone(180, 0.18, 'sawtooth', 0.07, 0, 70); break;
      case 'victory':
        this.tone(523,0.12,'triangle',0.06,0,659);
        this.tone(659,0.12,'triangle',0.06,0.1,784);
        this.tone(784,0.18,'triangle',0.06,0.2,1046);
        break;
      case 'gameover':
        this.tone(220,0.16,'sawtooth',0.07,0,160);
        this.tone(160,0.22,'sawtooth',0.05,0.12,90);
        break;
      case 'shoot': this.playShoot(data.type); break;
      case 'explode':
        this.noise(0.06, 0.16, 100, 1400, 0);
        this.tone(110, 0.12, 'sawtooth', 0.05, 0, 55);
        break;
    }
  },
  playShoot(type){
    if(!this.canPlay(`shoot_${type}`, 55)) return;
    if(type==='arrow'){
      this.tone(980, 0.025, 'square', 0.04, 0, 680);
      this.noise(0.012, 0.025, 2500, 9000, 0);
    }else if(type==='cannon'){
      this.noise(0.05, 0.1, 180, 1800, 0);
      this.tone(140, 0.09, 'sawtooth', 0.06, 0, 70);
    }else if(type==='ice'){
      this.tone(880, 0.05, 'triangle', 0.04, 0, 620);
      this.noise(0.02, 0.04, 3000, 9000, 0);
    }else if(type==='sniper'){
      this.tone(1200, 0.02, 'square', 0.06, 0, 520);
      this.noise(0.02, 0.02, 4000, 12000, 0);
    }else if(type==='bomb'){
      this.tone(180, 0.08, 'sawtooth', 0.05, 0, 130);
      this.noise(0.02, 0.05, 800, 2800, 0);
    }
  },
  update(dt){
    if(!this.unlocked || !this.ctx) return;
    const bpm = G && G.state==='wave' ? (G.ff ? 128 : 108) : 84;
    this.beat += dt * bpm / 60;
    while(this.beat >= 1){
      this.beat -= 1;
      this.lastBgmAt++;
      const step = this.lastBgmAt % 8;
      const root = G && G.state==='wave' ? 164.81 : 130.81;
      const phrase = [1,1.122,1.335,1.498,1,1.122,1.682,1.335];
      const bass = root * (step===4 ? 0.75 : 0.5);
      this.bgmNote(root * phrase[step], step===7 ? 0.42 : 0.26, step===0||step===4 ? 0.04 : 0.025, 0, 'triangle');
      this.bgmNote(bass, 0.22, 0.02, 0.01, 'sine');
      if(G && G.state==='wave' && (step===2 || step===6)) this.noise(0.006, 0.03, 5000, 12000, 0.01);
    }
  }
};

// ── Path ──────────────────────────────────────────────────────────────────
const g2p = (c, r) => ({ x: c*CELL + CELL/2, y: HUD_H + r*CELL + CELL/2 });
let PATH_WP, PATH_PX, SEG_LEN, pathSet;
const isPath = (c, r) => pathSet.has(`${c},${r}`);

let buildMap = [];
function initBuildMap(){
  buildMap = Array.from({length:ROWS}, () => new Array(COLS).fill(true));
}
function isBuildable(col, row){
  if(col<0||col>=COLS||row<0||row>=ROWS) return false;
  if(isPath(col, row)) return false;
  return buildMap[row][col];
}
function isBuildable2x2(col, row){
  for(let dr=0;dr<2;dr++) for(let dc=0;dc<2;dc++) if(!isBuildable(col+dc,row+dr)) return false;
  return true;
}

function rebuildPath(wps){
  PATH_WP = wps;
  PATH_PX = wps.map(([c,r]) => g2p(c,r));
  SEG_LEN = PATH_PX.slice(0,-1).map((_,i) => {
    const a=PATH_PX[i], b=PATH_PX[i+1]; return Math.hypot(b.x-a.x, b.y-a.y);
  });
  pathSet = new Set();
  for(let i=0; i<wps.length-1; i++){
    const [c0,r0]=wps[i], [c1,r1]=wps[i+1];
    if(c0===c1) for(let r=Math.min(r0,r1);r<=Math.max(r0,r1);r++) pathSet.add(`${c0},${r}`);
    else        for(let c=Math.min(c0,c1);c<=Math.max(c0,c1);c++) pathSet.add(`${c},${r0}`);
  }
}
// Mobile-scaled default path (COLS=30, ROWS=34)
rebuildPath([[-1,3],[23,3],[23,9],[12,9],[12,15],[5,15],[5,22],[23,22],[23,28],[COLS+1,28]]);
initBuildMap();

function applyMapData(data){
  if(!data || !Array.isArray(data.pathWP) || data.pathWP.length < 2) return false;
  const ECOLS = data.cols || 17;
  const EROWS = data.rows || 11;
  const SX = COLS / ECOLS;
  const SY = ROWS / EROWS;
  const wp = data.pathWP.map(([c, r]) => {
    if(c < 0)      return [-1,       Math.round(r * SY)];
    if(c > ECOLS)  return [COLS + 1, Math.round(r * SY)];
    return [Math.round(c * SX), Math.round(r * SY)];
  });
  rebuildPath(wp);  // PATH_WP, PATH_PX, SEG_LEN 설정 (몬스터 이동 경로)

  // pathCells가 있으면 정확한 셀 목록으로 pathSet 덮어쓰기
  // (웨이포인트 재계산 오차 방지)
  if(Array.isArray(data.pathCells) && data.pathCells.length > 0){
    pathSet = new Set(data.pathCells.map(([c,r])=>`${c},${r}`));
  }

  initBuildMap();
  const nb = data.nonBuildable || [];
  if(nb.length > 0){
    const edNB = new Uint8Array(ECOLS * EROWS);
    for(const [c, r] of nb){
      if(c>=0 && c<ECOLS && r>=0 && r<EROWS) edNB[r*ECOLS+c] = 1;
    }
    for(let gr=0; gr<ROWS; gr++){
      for(let gc=0; gc<COLS; gc++){
        const ec = Math.min(ECOLS-1, Math.round((gc+0.5)*ECOLS/COLS - 0.5));
        const er = Math.min(EROWS-1, Math.round((gr+0.5)*EROWS/ROWS - 0.5));
        if(edNB[er*ECOLS+ec]) buildMap[gr][gc] = false;
      }
    }
  }
  return true;
}

function loadMapFromStorage(){
  try {
    const stages = JSON.parse(localStorage.getItem('btd_stages') || '[]');
    const maps   = JSON.parse(localStorage.getItem('btd_maps')   || '{}');
    let mapId = stages[0];
    if(!mapId){
      const recent = Object.values(maps).sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));
      if(recent.length) mapId = recent[0].id;
    }
    if(mapId && maps[mapId]){
      applyMapData(maps[mapId]);
    } else {
      // 기본 맵 파일 로드 (maps/1.json)
      fetch('./maps/1.json', {cache:'no-store'}).then(r=>r.json()).then(data=>{
        applyMapData(data);
      }).catch(()=>{});
    }
  } catch(e) {
    console.warn('맵 로드 실패, 기본 경로 사용:', e);
  }
}

function bPos(pi, prog){
  if(pi>=PATH_PX.length-1) return {...PATH_PX[PATH_PX.length-1]};
  const a=PATH_PX[pi], b=PATH_PX[pi+1];
  return {x:a.x+(b.x-a.x)*prog, y:a.y+(b.y-a.y)*prog};
}

let G = {};

  G = {lives:20, gold:200, wave:0, maxWaves:60, score:0,
    state:'rest', towers:[], balloons:[], projectiles:[], explosions:[],
    selType:'arrow', selTower:null, previewType:null, spawnQueue:[], spawnTimer:0,

let _id = 0; const nid = () => ++_id;

// ── Balloon ───────────────────────────────────────────────────────────────
class Balloon {
  constructor(type, pi=0, prog=0, hpMul=1){
    const d = MD[type]; this.id=nid(); this.type=type;
    const baseHp=Math.round(d.hp*hpMul);
    this.hp=baseHp; this.maxHp=baseHp; this.spd=d.spd; this.rew=d.rew; this.rad=d.rad;
    this.imgKey=d.imgKey; this.bgCol=d.bgCol; this.border=d.border; this.isBoss=d.isBoss||false;
    this.traits=d.traits||{}; this.shield=this.traits.shield||0;
    this.pi=pi; this.prog=prog; const p=bPos(pi,prog); this.x=p.x; this.y=p.y;
    this.dist=pi+prog; this.alive=true; this.reached=false; this.slowT=0; this.slowF=0;
    this.sprKey=d.sprKey; this.frame=0; this.frameTimer=0; this.dirRow=2;
    this.prevX=this.x; this.prevY=this.y;
  }
}

// ── Tower ─────────────────────────────────────────────────────────────────
class Tower {
  constructor(type, col, row){
    this.type=type; this.col=col; this.row=row;
    this.x=col*CELL+CELL; this.y=HUD_H+row*CELL+CELL;
    this.upgrades=[0,0,0]; this.cd=0; this.angle=-Math.PI/2;
    this._statsCache=null;
    this.animState='idle'; this.animF=0; this.animTimer=0;
    this.attacking=false; this.attackT=0;
  }
  updateAnim(dt){
    const a=TOWER_ANIM[this.type]; if(!a)return;
    if(this.attacking){
      this.attackT+=dt;
      const dur=a.attack.frames/a.attack.fps;
      if(this.attackT>=dur){this.attacking=false;this.attackT=0;this.animState='idle';this.animF=0;}
      else{this.animF=this.attackT*a.attack.fps;this.animState='attack';}
    }else{
      this.animTimer+=dt;
      this.animF=(this.animTimer*a.idle.fps)%a.idle.frames;
      this.animState='idle';
    }
  }
  triggerAttack(){ this.attacking=true; this.attackT=0; this.animState='attack'; this.animF=0; }
  get d(){ return TD[this.type]; }
  get tree(){ return UT[this.type]; }
  _computeStats(){
    const d=this.d;
    let dmg=d.bDmg, rng=d.bRng, fps=d.bFps, aoe=d.bAoe, slow=d.bSlow, slowDur=d.bSlowDur;
    const atkTypes=new Set(d.atkType); let canSeeCamo=d.baseCamo||false;
    for(let pi=0;pi<3;pi++){
      const path=this.tree[pi];
      for(let ti=0;ti<this.upgrades[pi];ti++){
        const e=path.t[ti][2];
        if(e.dmgMul)    dmg*=e.dmgMul;
        if(e.rngMul)    rng=Math.min(rng*e.rngMul,9999);
        if(e.fpsMul)    fps*=e.fpsMul;
        if(e.aoeAdd)    aoe+=e.aoeAdd;
        if(e.aoeMul)    aoe*=e.aoeMul;
        if(e.slowAdd)   slow=Math.min(slow+e.slowAdd,0.95);
        if(e.slowDurAdd)slowDur+=e.slowDurAdd;
        if(e.addType)   atkTypes.add(e.addType);
        if(e.addTypes)  e.addTypes.forEach(t=>atkTypes.add(t));
        if(e.addCamo)   canSeeCamo=true;
      }
    }
    return {dmg:Math.round(dmg),rng:Math.round(rng),fps,aoe:Math.round(aoe),slow,slowDur,atkTypes:[...atkTypes],canSeeCamo};
  }
  get stats(){ if(!this._statsCache) this._statsCache=this._computeStats(); return this._statsCache; }
  _dirty(){ this._statsCache=null; }
  get dmg(){ return this.stats.dmg; }
  get rng(){ return this.stats.rng; }
  get fps(){ return this.stats.fps; }
  get aoe(){ return this.stats.aoe; }
  get slow(){ return this.stats.slow; }
  get slowDur(){ return this.stats.slowDur; }
  get atkTypes(){ return this.stats.atkTypes; }
  get canSeeCamo(){ return this.stats.canSeeCamo; }
  canUpgrade(pi){
    const next=this.upgrades[pi]+1; if(next>5)return false;
    if(this.upgrades[pi]===0){
      const otherActive=this.upgrades.filter((_,i)=>i!==pi&&this.upgrades[i]>0).length;
      if(otherActive>=2)return false;
    }
    if(next>=3){ for(let i=0;i<3;i++) if(i!==pi&&this.upgrades[i]>=3)return false; }
    return true;
  }
  upgradeCost(pi){ const ti=this.upgrades[pi]; if(ti>=5)return null; return this.tree[pi].t[ti][1]; }
  doUpgrade(pi){
    if(!this.canUpgrade(pi))return false;
    const cost=this.upgradeCost(pi);
    if(cost===null||G.gold<cost)return false;
    G.gold-=cost; this.upgrades[pi]++; this._dirty(); return true;
  }
  get sellVal(){
    let total=this.d.cost;
    for(let pi=0;pi<3;pi++){ const path=this.tree[pi]; for(let ti=0;ti<this.upgrades[pi];ti++) total+=path.t[ti][1]; }
    return Math.floor(total*0.6);
  }
}

// ── Projectile & Explosion ────────────────────────────────────────────────
class Proj {
  constructor(tower, target){
    this.id=nid(); this.tid=target.id;
    this.x=tower.x; this.y=tower.y; this.tx=target.x; this.ty=target.y;
    this.spd=tower.d.pspd; this.col=tower.d.pcol; this.rad=tower.d.prad;
    this.dmg=tower.dmg; this.aoe=tower.aoe; this.slow=tower.slow; this.slowDur=tower.slowDur;
    this.atkTypes=tower.atkTypes; this.towerType=tower.type; this.alive=true;
    const dx=this.tx-this.x, dy=this.ty-this.y, d=Math.hypot(dx,dy)||1;
    this.vx=dx/d*this.spd; this.vy=dy/d*this.spd; this.angle=Math.atan2(dy,dx); this.fxTimer=0;
  }
}
class Expl {
  constructor(x,y,maxR,col){ this.x=x;this.y=y;this.maxR=maxR;this.r=5;this.col=col;this.alpha=0.85;this.alive=true; }
}

// ── Wave Logic ────────────────────────────────────────────────────────────
function waveHpMul(wave){
  // ×1.1 per 10 waves (wave 1-10: ×1, 11-20: ×1.1, 21-30: ×1.21 ...)
  return Math.pow(1.1, Math.floor((wave-1)/10));
}
function waveCountMul(wave){
  // ×1.1 per 5 waves
  return Math.pow(1.1, Math.floor((wave-1)/5));
}
function startWave(){
  if(G.wave>=G.maxWaves)return;
  G.wave++; G.state='wave';
  const def=WAVES[G.wave-1]; G.spawnQueue=[];
  const hpMul=waveHpMul(G.wave), cntMul=waveCountMul(G.wave);
  for(const s of def){
    const cnt=Math.round(s.count*cntMul);
    for(let i=0;i<cnt;i++) G.spawnQueue.push({type:s.type,t:s.at+i*s.iv,hpMul});
  }
  G.spawnQueue.sort((a,b)=>a.t-b.t); G.spawnTimer=0; G.waveTotal=G.spawnQueue.length;
  AudioSys.play('waveStart');
}
function checkWaveDone(){
  if(G.state!=='wave')return;
  if(G.spawnQueue.length>0)return;
  if(G.balloons.some(b=>b.alive))return;
  G.gold+=25+G.wave*6; G.score+=(25+G.wave*6)*5;
  if(G.wave>=G.maxWaves){G.state='victory';AudioSys.play('victory');return;}
  AudioSys.play('waveClear');
  G.state='rest'; G.restTimer=1.5;
}

// ── Update Functions ──────────────────────────────────────────────────────
function updateSpawner(dt){
  G.spawnTimer+=dt*60;
  while(G.spawnQueue.length&&G.spawnQueue[0].t<=G.spawnTimer){
    const sq=G.spawnQueue.shift();
    G.balloons.push(new Balloon(sq.type,1,0,sq.hpMul||1));
    if(AudioSys.canPlay('spawn', 140)) AudioSys.play('spawn');
  }
}
function updateBalloons(dt){
  for(const b of G.balloons){
    if(!b.alive)continue;
    if(b.traits.regen&&b.hp<b.maxHp) b.hp=Math.min(b.maxHp,b.hp+b.traits.regen*dt);
    let spd=b.spd;
    if(b.slowT>0){b.slowT=Math.max(0,b.slowT-dt);spd*=(1-b.slowF);}
    let rem=spd*dt;
    while(rem>0&&b.pi<PATH_PX.length-1){
      const left=SEG_LEN[b.pi]*(1-b.prog);
      if(rem>=left){rem-=left;b.pi++;b.prog=0;}
      else{b.prog+=rem/SEG_LEN[b.pi];rem=0;}
    }
    if(b.pi>=PATH_PX.length-1){
      b.alive=false;b.reached=true;
      const hl=(MD[b.type]&&MD[b.type].heartLoss)||1;
      G.lives=Math.max(0,G.lives-hl);
      AudioSys.play('leak');
      if(G.lives<=0){G.state='gameover';AudioSys.play('gameover');}
      continue;
    }
    const p=bPos(b.pi,b.prog);b.x=p.x;b.y=p.y;b.dist=b.pi+b.prog;
    const dx=b.x-b.prevX,dy=b.y-b.prevY;
    if(dx*dx+dy*dy>0.01){const deg=(Math.atan2(dy,dx)*180/Math.PI+360)%360;b.dirRow=[2,3,4,5,6,7,0,1][Math.round(deg/45)%8];}
    b.prevX=b.x;b.prevY=b.y;
    b.frameTimer+=dt*1000;if(b.frameTimer>=125){b.frameTimer-=125;b.frame=(b.frame+1)%5;}
  }
}
function updateTowers(dt){
  for(const t of G.towers){
    t.updateAnim(dt); if(t.cd>0){t.cd-=dt;continue;}
    let best=null, bd=-1;
    for(const b of G.balloons){
      if(!b.alive)continue;
      if(b.traits.camo&&!t.canSeeCamo)continue;
      if(Math.hypot(b.x-t.x,b.y-t.y)<=t.rng&&b.dist>bd){bd=b.dist;best=b;}
    }
    if(best){
      t.angle=Math.atan2(best.y-t.y,best.x-t.x); t.cd=1/t.fps;
      t.triggerAttack(); G.projectiles.push(new Proj(t,best));
      AudioSys.play('shoot', { type:t.type });
    }
  }
}
function updateProjectiles(dt){
  for(const p of G.projectiles){
    if(!p.alive)continue;
    const tgt=G.balloons.find(b=>b.id===p.tid);
    if(tgt&&tgt.alive){
      p.tx=tgt.x;p.ty=tgt.y;
      const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy)||1;
      p.vx=dx/d*p.spd;p.vy=dy/d*p.spd;
    }
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    p.angle=Math.atan2(p.vy,p.vx);p.fxTimer+=dt;
    if(Math.hypot(p.x-p.tx,p.y-p.ty)<14){
      p.alive=false;
      if(p.aoe>0){
        G.explosions.push(new Expl(p.x,p.y,p.aoe,p.col));
        AudioSys.play('explode');
        for(const b of G.balloons){ if(!b.alive)continue; if(Math.hypot(b.x-p.x,b.y-p.y)<=p.aoe)hitBalloon(b,p.dmg,p.slow,p.slowDur,p.atkTypes); }
      }else if(tgt&&tgt.alive){ hitBalloon(tgt,p.dmg,p.slow,p.slowDur,p.atkTypes); }
    }
    if(p.x<-60||p.x>CW+60||p.y<-60||p.y>CH+60)p.alive=false;
  }
}
function hitBalloon(b,dmg,slow,slowDur,atkTypes){
  if(b.shield>0){b.shield--;AudioSys.play('shield');return;}
  const imm=b.traits.immune||[], res=b.traits.resist||[], wk=b.traits.weak||[];
  let dmgMul=0;
  for(const t of atkTypes){
    if(imm.includes(t))continue;
    let m=wk.includes(t)?1.75:res.includes(t)?0.35:1.0;
    dmgMul=Math.max(dmgMul,m);
  }
  if(dmgMul===0)return;
  const actual=Math.max(1,Math.round((dmg-(b.traits.armor||0))*dmgMul));
  b.hp-=actual;
  if(AudioSys.canPlay('hit', 35)) AudioSys.play('hit', { freq: 420 + Math.min(500, actual * 18) });
  if(slow>0&&!b.traits.slowImmune){b.slowT=slowDur;b.slowF=slow;}
  if(b.hp<=0){
    b.alive=false;G.gold+=b.rew;G.score+=b.rew*10;
    AudioSys.play('kill');
    if(b.traits.spawn) for(let i=0;i<b.traits.spawn.count;i++) G.balloons.push(new Balloon(b.traits.spawn.type,b.pi,b.prog));
  }
}
function updateExplosions(dt){
  for(const e of G.explosions){
    if(!e.alive)continue;
    e.r+=e.maxR*3.5*dt;e.alpha-=2.8*dt;
    if(e.alpha<=0||e.r>=e.maxR)e.alive=false;
  }
}

// ── Altar (pedestal under placed towers) ──────────────────────────────────
let _altarImg = null;
function getAltarImg(){
  if(_altarImg) return _altarImg;
  const W=CELL*2, H=CELL*2; // 32×32
  const oc=document.createElement('canvas'); oc.width=W; oc.height=H;
  const c=oc.getContext('2d');

  // Stone base
  const bg=c.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#50412e'); bg.addColorStop(0.45,'#6e5a3f'); bg.addColorStop(1,'#3b2e1c');
  c.fillStyle=bg; c.beginPath();
  c.roundRect(0.5,0.5,W-1,H-1,5); c.fill();

  // Top face bevel highlight
  c.fillStyle='rgba(220,190,130,0.22)';
  c.beginPath(); c.roundRect(0.5,0.5,W-1,5,{upperLeft:5,upperRight:5}); c.fill();

  // Inner inset panel
  const ig=c.createLinearGradient(3,3,W-3,H-3);
  ig.addColorStop(0,'#5e4d35'); ig.addColorStop(1,'#43341f');
  c.fillStyle=ig; c.strokeStyle='rgba(200,170,100,0.28)'; c.lineWidth=1;
  c.beginPath(); c.roundRect(3.5,3.5,W-7,H-7,3); c.fill(); c.stroke();

  // Rune glyph (cross + diamond)
  const mx=W/2, my=H/2;
  c.save(); c.strokeStyle='rgba(120,210,255,0.55)'; c.lineWidth=1; c.lineCap='round';
  c.beginPath();
  c.moveTo(mx-5,my); c.lineTo(mx+5,my);
  c.moveTo(mx,my-5); c.lineTo(mx,my+5);
  c.moveTo(mx-3.5,my-3.5); c.lineTo(mx+3.5,my+3.5);
  c.moveTo(mx+3.5,my-3.5); c.lineTo(mx-3.5,my+3.5);
  c.stroke();
  // Center glow dot
  const rg=c.createRadialGradient(mx,my,0,mx,my,4);
  rg.addColorStop(0,'rgba(140,220,255,0.55)'); rg.addColorStop(1,'rgba(80,180,255,0)');
  c.fillStyle=rg; c.beginPath(); c.arc(mx,my,4,0,Math.PI*2); c.fill();
  c.restore();

  // Corner accent dots
  c.fillStyle='rgba(160,220,255,0.55)';
  for(const [dx,dy] of [[5,5],[W-5,5],[5,H-5],[W-5,H-5]]){
    c.beginPath(); c.arc(dx,dy,1.8,0,Math.PI*2); c.fill();
  }

  // Bottom shadow stripe (depth)
  const sh=c.createLinearGradient(0,H-4,0,H);
  sh.addColorStop(0,'rgba(0,0,0,0)'); sh.addColorStop(1,'rgba(0,0,0,0.38)');
  c.fillStyle=sh; c.beginPath(); c.roundRect(0.5,H-4,W-1,3.5,{lowerLeft:5,lowerRight:5}); c.fill();

  // Outer border
  c.strokeStyle='rgba(160,130,80,0.6)'; c.lineWidth=1;
  c.beginPath(); c.roundRect(0.5,0.5,W-1,H-1,5); c.stroke();

  _altarImg=oc; return oc;
}

// ── Draw Helpers ──────────────────────────────────────────────────────────
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function wrapText(text, maxW, font){
  ctx.save(); ctx.font=font;
  const words=text.split(' '); const lines=[]; let line='';
  for(const w of words){
    const test=line?line+' '+w:w;
    if(ctx.measureText(test).width>maxW&&line){lines.push(line);line=w;}
    else line=test;
  }
  if(line)lines.push(line);
  ctx.restore(); return lines;
}

// ── Draw Grid + Placement Preview ─────────────────────────────────────────
function drawGrid(){
  ctx.save();

  if(!G.selTower && dragTower){
    ctx.save();
    for(let r=0;r<ROWS-1;r++){
      for(let c=0;c<COLS-1;c++){
        if(isBuildable2x2(c,r)&&!G.towers.some(t=>c+2>t.col&&c<t.col+2&&r+2>t.row&&r<t.row+2)){
          ctx.strokeStyle='rgba(80,240,100,0.45)';
          ctx.lineWidth=1;
          ctx.strokeRect(c*CELL+0.5,HUD_H+r*CELL+0.5,CELL*2-1,CELL*2-1);

  }
  const _hovIn = hovC>=0&&hovC+1<COLS&&hovR>=0&&hovR+1<ROWS&&!G.selTower;
  const _hovOk = _hovIn&&isBuildable2x2(hovC,hovR)&&!G.towers.some(t=>hovC+2>t.col&&hovC<t.col+2&&hovR+2>t.row&&hovR<t.row+2);
  if(_hovIn){
    const def=TD[G.selType], can=G.gold>=def.cost;

    else{ctx.fillStyle='rgba(255,40,40,0.06)';ctx.strokeStyle='rgba(255,40,40,0.55)';}
    ctx.fill();ctx.lineWidth=1.5;ctx.setLineDash([6,4]);ctx.stroke();ctx.setLineDash([]);ctx.restore();

    const x=hovC*CELL, y=HUD_H+hovR*CELL, sz=Math.round(92*TSCALE);
    if(_hovOk){ctx.fillStyle=can?'rgba(80,255,80,0.22)':'rgba(255,80,80,0.22)';ctx.fillRect(x+1,y+1,CELL*2-2,CELL*2-2);}
    else{ctx.fillStyle='rgba(255,30,30,0.30)';ctx.fillRect(x+1,y+1,CELL*2-2,CELL*2-2);}
    ctx.save();ctx.globalAlpha=0.72;
    const hovAnim=TOWER_ANIM[G.selType],hovSh=hovAnim?.sh;
    if(hovAnim&&ok(hovSh)){ctx.drawImage(imgs[hovSh],0,hovAnim.idle.row*FRAME_SZ,FRAME_SZ,FRAME_SZ,px-sz/2,py-sz/2,sz,sz);}
    else if(ok(def.tw)){ctx.drawImage(imgs[def.tw],px-sz/2,py-sz/2,sz,sz);}
    else{ctx.fillStyle=def.col;rr(px-sz/2,py-sz/2,sz,sz,3);ctx.fill();}
    ctx.restore();
  }
  ctx.restore();
}

// ── Draw Towers ───────────────────────────────────────────────────────────
const EMOJ = {arrow:'🏹',cannon:'🐚',ice:'❄️',sniper:'🔱',bomb:'🦀'};
function drawTowers(){
  for(const t of G.towers){
    const sel=t===G.selTower, hov=(hovC>=t.col&&hovC<t.col+2&&hovR>=t.row&&hovR<t.row+2);
    if(sel){
      ctx.save();
      const rg=ctx.createRadialGradient(t.x,t.y,0,t.x,t.y,t.rng);
      rg.addColorStop(0,'rgba(100,200,255,0)');
      rg.addColorStop(0.75,'rgba(100,200,255,0.04)');
      rg.addColorStop(1,'rgba(100,200,255,0.13)');
      ctx.beginPath();ctx.arc(t.x,t.y,t.rng,0,Math.PI*2);
      ctx.fillStyle=rg;ctx.fill();
      ctx.shadowBlur=18;ctx.shadowColor='rgba(80,200,255,0.9)';
      ctx.strokeStyle='rgba(140,225,255,0.95)';ctx.lineWidth=2;ctx.stroke();
      ctx.shadowBlur=0;
      ctx.beginPath();ctx.arc(t.x,t.y,t.rng*0.82,0,Math.PI*2);
      ctx.strokeStyle='rgba(100,200,255,0.22)';ctx.lineWidth=1;
      ctx.setLineDash([5,7]);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle='rgba(140,225,255,0.95)';ctx.font='bold 13px Arial';
      ctx.textAlign='center';ctx.textBaseline='middle';
      for(const a of[0,Math.PI/2,Math.PI,Math.PI*3/2])
        ctx.fillText('+',t.x+Math.cos(a)*t.rng,t.y+Math.sin(a)*t.rng);
      ctx.restore();
    } else if(hov){
      ctx.save();ctx.beginPath();ctx.arc(t.x,t.y,t.rng,0,Math.PI*2);
      ctx.strokeStyle='rgba(200,220,255,0.28)';ctx.lineWidth=1.2;ctx.stroke();ctx.restore();
    }
    // Altar pedestal
    ctx.drawImage(getAltarImg(), t.col*CELL, HUD_H+t.row*CELL, CELL*2, CELL*2);

    const TS2=TSCALE*2;
    ctx.save();ctx.translate(t.x+2*TS2,t.y+20*TS2);ctx.scale(1,0.32);
    ctx.beginPath();ctx.ellipse(0,0,21*TS2,19*TS2,0,0,Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,0.22)';ctx.fill();ctx.restore();

    const sz=Math.round(92*TSCALE);
    const anim=TOWER_ANIM[t.type], shKey=anim?.sh;
    if(anim&&ok(shKey)){
      const sa=anim[t.animState]||anim.idle;
      const fr=Math.min(Math.floor(t.animF),sa.frames-1);
      ctx.drawImage(imgs[shKey],fr*FRAME_SZ,sa.row*FRAME_SZ,FRAME_SZ,FRAME_SZ,t.x-sz/2,t.y-sz/2,sz,sz);
    }else if(ok(t.d.tw)){
      const a=TOWER_ANIM[t.type];
      ctx.save();ctx.translate(t.x,t.y);
      ctx.shadowBlur=sel?16:8;ctx.shadowColor=sel?'#ff6600':'rgba(255,140,50,0.85)';
      if(t.animState==='attack'&&a){
        const dur=a.attack.frames/a.attack.fps;
        const p=Math.min(t.attackT/dur,1);
        const bounce=Math.sin(p*Math.PI);
        ctx.translate(0,-bounce*3);ctx.scale(1-bounce*0.12,1+bounce*0.18);
        ctx.drawImage(imgs[t.d.tw],-sz/2,-sz/2,sz,sz);
        ctx.shadowBlur=0;
        const fl=Math.max(0,(0.4-p)*1.5);
        if(fl>0){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=fl;ctx.drawImage(imgs[t.d.tw],-sz/2,-sz/2,sz,sz);}
      }else{
        const freq=a?a.idle.fps/a.idle.frames:1.5, phase=(t.col*3+t.row*7)*0.4;
        const wave=Math.sin(Date.now()*0.001*freq*Math.PI*2+phase);
        ctx.translate(0,wave*2);ctx.scale(1+wave*0.015,1-wave*0.015);
        ctx.drawImage(imgs[t.d.tw],-sz/2,-sz/2,sz,sz);
      }
      ctx.restore();
    }else{
      ctx.save();ctx.fillStyle=t.d.col;rr(t.x-sz/2,t.y-sz/2,sz,sz,3);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.75)';ctx.font=`${Math.round(10*TS2)}px Arial`;
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(EMOJ[t.type]||'🗼',t.x,t.y);
      ctx.restore();
    }
    const dotR=Math.max(1,4*TS2), dotDist=21*TS2;
    const dAngles=[-Math.PI/2+Math.PI/6,-Math.PI/2+Math.PI/2,-Math.PI/2-Math.PI/6];
    for(let pi=0;pi<3;pi++){
      const tier=t.upgrades[pi]; if(tier===0)continue;
      const a=dAngles[pi], dx=Math.cos(a)*dotDist, dy=Math.sin(a)*dotDist;
      ctx.save();
      ctx.beginPath();ctx.arc(t.x+dx,t.y+dy,dotR+0.5,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fill();
      ctx.beginPath();ctx.arc(t.x+dx,t.y+dy,dotR,0,Math.PI*2);ctx.fillStyle=t.tree[pi].col;ctx.fill();
      ctx.restore();
    }
    if(sel){
      ctx.save();rr(t.col*CELL,HUD_H+t.row*CELL,CELL*2,CELL*2,3);
      ctx.strokeStyle='#ffee00';ctx.lineWidth=2;ctx.stroke();ctx.restore();
    }
  }
}

// ── Draw Monsters ─────────────────────────────────────────────────────────
function drawBalloons(){
  const BFRW=64,BFRH=64;
  const alive=G.balloons.filter(b=>b.alive).sort((a,b)=>b.dist-a.dist);
  for(const b of alive){
    ctx.save();ctx.translate(b.x,b.y);
    if(b.traits.camo)ctx.globalAlpha=0.55;
    const r=b.rad, sz=Math.round(r*4);
    // Shadow
    ctx.save();ctx.scale(1,0.35);ctx.beginPath();
    ctx.ellipse(0,sz*0.55,sz*0.38,sz*0.1,0,0,Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,0.28)';ctx.fill();ctx.restore();
    // Sprite (8방향 아틀라스)
    const sprImg=imgs[b.sprKey];
    if(sprImg&&sprImg.complete&&sprImg.naturalWidth>0){
      ctx.imageSmoothingEnabled=false;
      ctx.drawImage(sprImg,b.frame*BFRW,b.dirRow*BFRH,BFRW,BFRH,-sz/2,-sz/2,sz,sz);
    }else{
      ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fillStyle=b.bgCol;ctx.fill();
      ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.strokeStyle=b.border;ctx.lineWidth=2.5;ctx.stroke();
    }
    // Boss glow
    if(b.isBoss){
      const pulse=0.35+0.2*Math.sin(Date.now()*0.006);
      ctx.beginPath();ctx.arc(0,0,r+7,0,Math.PI*2);ctx.strokeStyle=`rgba(255,160,0,${pulse})`;ctx.lineWidth=3.5;ctx.stroke();
    }
    // HP bar
    if(b.hp<b.maxHp){
      const bw=sz;
      ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(-bw/2-1,-sz/2-11,bw+2,8);
      ctx.fillStyle='#cc2222';ctx.fillRect(-bw/2,-sz/2-10,bw,6);
      ctx.fillStyle='#22cc22';ctx.fillRect(-bw/2,-sz/2-10,bw*(b.hp/b.maxHp),6);
    }
    // Slow frost
    if(b.slowT>0){ctx.beginPath();ctx.arc(0,0,r+5,0,Math.PI*2);ctx.strokeStyle='rgba(100,220,255,0.72)';ctx.lineWidth=2;ctx.stroke();}
    // Camo marker
    if(b.traits.camo){
      ctx.globalAlpha=0.9;ctx.fillStyle='rgba(180,255,180,0.85)';ctx.font='bold 9px Arial';
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🥷',-sz/2+4,-sz/2+4);
    }
    // Shield ring
    if(b.shield>0){
      const pulse=0.5+0.35*Math.sin(Date.now()*0.009);
      ctx.beginPath();ctx.arc(0,0,r+9,0,Math.PI*2);ctx.strokeStyle=`rgba(255,220,60,${pulse})`;ctx.lineWidth=3;ctx.stroke();
      ctx.fillStyle='rgba(255,220,60,0.9)';ctx.font='bold 8px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('🛡'+b.shield,0,-sz/2-14);
    }
    ctx.restore();
  }
}

// ── Draw Projectiles & Explosions ─────────────────────────────────────────
function drawProjShape(p){
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);const r=p.rad;
  switch(p.towerType){
    case 'arrow': ctx.shadowColor='#44ccff';ctx.shadowBlur=10;ctx.strokeStyle='#44ccff';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(-r*3,0);ctx.lineTo(r*1.5,0);ctx.stroke();ctx.fillStyle='#aaeeff';ctx.beginPath();ctx.moveTo(r*1.5,-r*1.2);ctx.lineTo(r*3.5,0);ctx.lineTo(r*1.5,r*1.2);ctx.closePath();ctx.fill();break;
    case 'cannon': {const g=ctx.createRadialGradient(-r*0.5,-r*0.5,0.5,0,0,r*2.2);g.addColorStop(0,'#fff');g.addColorStop(0.35,'#dd99ff');g.addColorStop(1,'#550077');ctx.shadowColor='#bb55ff';ctx.shadowBlur=14;ctx.beginPath();ctx.arc(0,0,r*2.2,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();break;}
    case 'ice': ctx.shadowColor='#88ddff';ctx.shadowBlur=12;ctx.strokeStyle='#aaeeff';ctx.lineWidth=1.5;for(let i=0;i<6;i++){const a=i*Math.PI/3;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*r*2.8,Math.sin(a)*r*2.8);ctx.stroke();}ctx.fillStyle='#ddf6ff';ctx.globalAlpha=0.9;ctx.beginPath();ctx.arc(0,0,r*0.9,0,Math.PI*2);ctx.fill();break;
    case 'sniper': ctx.shadowColor='#44ff99';ctx.shadowBlur=10;ctx.strokeStyle='#664422';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-r*4.5,0);ctx.lineTo(r*2,0);ctx.stroke();ctx.strokeStyle='#88ffcc';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-r*4.5,0);ctx.lineTo(r*2,0);ctx.stroke();ctx.fillStyle='#aaffdd';ctx.beginPath();ctx.moveTo(r*2,-r*1.1);ctx.lineTo(r*4,0);ctx.lineTo(r*2,r*1.1);ctx.closePath();ctx.fill();break;
    case 'bomb': {ctx.shadowColor='#ff6600';ctx.shadowBlur=16;const g=ctx.createRadialGradient(-r*0.4,-r*0.4,0.5,0,0,r*2.2);g.addColorStop(0,'#ffcc55');g.addColorStop(0.5,'#cc3300');g.addColorStop(1,'#330800');ctx.beginPath();ctx.arc(0,0,r*2.2,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();break;}
    default: ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fillStyle=p.col;ctx.shadowColor=p.col;ctx.shadowBlur=10;ctx.fill();
  }
  ctx.restore();
}
function drawProjectiles(){
  for(const p of G.projectiles){
    if(!p.alive)continue;
    const anim=TOWER_ANIM[p.towerType], shKey=anim?.sh;
    if(anim&&ok(shKey)){
      const fx=anim.fx, fr=Math.floor(p.fxTimer*fx.fps)%fx.frames, sz=Math.max(p.rad*6,18);
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);
      ctx.drawImage(imgs[shKey],fr*FRAME_SZ,fx.row*FRAME_SZ,FRAME_SZ,FRAME_SZ,-sz/2,-sz/2,sz,sz);
      ctx.restore();
    }else{ drawProjShape(p); }
  }
}
function drawExplosions(){
  for(const e of G.explosions){
    if(!e.alive)continue;
    ctx.save();ctx.globalAlpha=e.alpha;
    ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.strokeStyle=e.col;ctx.lineWidth=3;ctx.stroke();
    ctx.beginPath();ctx.arc(e.x,e.y,e.r*0.55,0,Math.PI*2);ctx.fillStyle=e.col;ctx.globalAlpha=e.alpha*0.25;ctx.fill();
    ctx.restore();
  }
}

// ── Wave Progress Bar (slim overlay at bottom of game area) ───────────────
function drawWaveProgress(){
  if(G.state==='gameover'||G.state==='victory')return;
  const bx=4, by=PANEL_Y-6, bw=CW-8, bh=4;
  if(G.state==='wave'&&G.waveTotal>0){
    const alive=G.balloons.filter(b=>b.alive).length;
    const remaining=G.spawnQueue.length+alive;
    const killed=Math.max(0,G.waveTotal-remaining);
    const prog=killed/G.waveTotal;
    ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(bx,by,bw,bh);
    const gr=ctx.createLinearGradient(bx,0,bx+bw*prog,0);
    gr.addColorStop(0,'#226622');gr.addColorStop(1,'#44ee44');
    ctx.fillStyle=gr;ctx.fillRect(bx,by,bw*prog,bh);
  }
}

// ── Bottom Panel ──────────────────────────────────────────────────────────
function drawBottomPanel(){
  const ui = window.OceanUISkin;
  // Ocean panel BG
  const gr=ctx.createLinearGradient(0,PANEL_Y,0,CH);
  gr.addColorStop(0,'#071b31'); gr.addColorStop(0.5,'#04111f'); gr.addColorStop(1,'#020c18');
  ctx.fillStyle=gr; ctx.fillRect(0,PANEL_Y,CW,PANEL_H);
  // Top glow border
  ctx.save();
  ctx.shadowColor='rgba(54,190,255,.3)'; ctx.shadowBlur=8;
  ctx.strokeStyle='rgba(45,109,157,0.65)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(0,PANEL_Y); ctx.lineTo(CW,PANEL_Y); ctx.stroke();
  ctx.restore();

  // Auto-switch tab
  if(G.selTower&&G.mobileTab===0) G.mobileTab=1;
  if(!G.selTower&&!G.previewType&&G.mobileTab===1) G.mobileTab=0;

  // Tab bar
  const tabs=[
    {label:'🗼 건설', active:G.mobileTab===0},
    {label:'⚙ 업그레이드', active:G.mobileTab===1, disabled:!G.selTower&&!G.previewType},
    {label:'👾 몬스터', active:G.mobileTab===2},
  ];
  const tabW=CW/3;
  for(let i=0;i<3;i++){
    const tab=tabs[i], tx=i*tabW, ty=PANEL_Y, tw=tabW-1, th=TAB_H;
    ctx.fillStyle=tab.active?'rgba(45,109,157,0.22)':tab.disabled?'rgba(3,17,31,0.5)':'rgba(7,27,49,0.55)';
    ctx.strokeStyle=tab.active?'rgba(56,183,255,0.75)':tab.disabled?'rgba(20,40,60,0.3)':'rgba(45,109,157,0.22)';
    ctx.lineWidth=tab.active?1.5:1;
    rr(tx+1,ty+2,tw-1,th-2,5); ctx.fill(); ctx.stroke();
    if(tab.active){
      ctx.save();
      ctx.shadowColor='rgba(56,183,255,.6)'; ctx.shadowBlur=6;
      ctx.strokeStyle='#38b7ff'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(tx+12,ty+3); ctx.lineTo(tx+tw-12,ty+3); ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle=tab.active?'#e8f8ff':tab.disabled?'#2d4a60':'#9db8d4';
    ctx.font=`${tab.active?'bold ':''}11px Arial`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(tab.label,tx+tabW/2,ty+TAB_H/2);
  }
  // Content divider
  ctx.save();
  ctx.shadowColor='rgba(45,109,157,.3)'; ctx.shadowBlur=5;
  ctx.strokeStyle='rgba(45,109,157,0.35)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,PANEL_Y+TAB_H); ctx.lineTo(CW,PANEL_Y+TAB_H); ctx.stroke();
  ctx.restore();

  // Content
  if(G.mobileTab===0) drawTowerShopTab();
  else if(G.mobileTab===1) drawUpgradeTab();
  else drawMonsterTab();
}

// ── Upgrade Tab ───────────────────────────────────────────────────────────
function drawUpgradeTab(){
  const ui = window.OceanUISkin;
  const isPreview = !G.selTower && G.previewType;
  const type = G.selTower ? G.selTower.type : G.previewType;
  if(!type) return;
  const d = TD[type];
  const tree = UT[type];
  const t = G.selTower;

  // Layout
  const TIX=4, TIY=PCY+2, TIW=CW-8, TIH=76;
  const CARD_Y=TIY+TIH+4, CARD_H=CH-CARD_Y-3;
  const CARD_W=Math.floor((CW-10)/3);

  // ── Tower Info Panel
  ui.panel(ctx,TIX,TIY,TIW,TIH,{radius:8,c1:'#082036',c2:'#0e2b49'});
  // Icon sub-panel
  ui.panel(ctx,TIX+6,TIY+6,62,TIH-12,{radius:7,c1:'#172f58',c2:'#263f72',stroke:'#6da6e6'});
  if(ok(d.ic)) ctx.drawImage(imgs[d.ic],TIX+9,TIY+9,56,56);
  // Tower cycle indicator (shown when multiple towers are placed)
  if(t && G.towers.length>1){
    const idx=G.towers.indexOf(t)+1;
    ctx.save();
    ctx.fillStyle='rgba(0,15,40,0.78)';
    rr(TIX+9,TIY+49,56,16,3); ctx.fill();
    ctx.fillStyle='rgba(140,200,255,0.95)';
    ctx.font='bold 9px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(`◄ ${idx}/${G.towers.length} ►`,TIX+37,TIY+57);
    ctx.restore();
  }
  // Tower name
  ctx.fillStyle='#fff'; ctx.font='bold 14px Arial'; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText(d.name,TIX+76,TIY+20);
  // Level badge
  const lv=t?t.upgrades.reduce((s,v)=>s+v,0)+1:1;
  ui.panel(ctx,TIX+76,TIY+35,44,20,{radius:10,c1:'#12243b',c2:'#1a3558',stroke:'rgba(161,202,255,.4)',shadowBlur:0,highlight:false});
  ctx.fillStyle='#dcecff'; ctx.font='bold 10px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(`Lv.${lv}`,TIX+98,TIY+45);
  // Stats row
  const dmg=t?t.stats.dmg:d.bDmg, rng=t?t.stats.rng:d.bRng, fps=t?t.stats.fps:d.bFps;
  const aoe=t?t.stats.aoe:d.bAoe, slow=t?t.stats.slow:d.bSlow;
  const statsArr=[
    {icon:'atk',   label:'공격력', val:String(dmg),           col:'#8ec7ff'},
    {icon:'range', label:'사거리', val:String(rng),           col:'#9bcfff'},
    {icon:'speed', label:'공속',   val:`${fps.toFixed(1)}/s`, col:'#8ec7ff'},
  ];
  if(aoe>0)       statsArr.push({icon:'💥', label:'범위', val:String(aoe),             col:'#ffaa55'});
  else if(slow>0) statsArr.push({icon:'❄',  label:'둔화', val:`${Math.round(slow*100)}%`, col:'#88eeff'});
  const SELL_X=TIX+TIW-58;
  const S0=TIX+128, SW=Math.floor((SELL_X-S0)/statsArr.length);
  for(let i=0;i<statsArr.length;i++){
    const sx=S0+i*SW, st=statsArr[i];
    if(i>0){ctx.strokeStyle='rgba(132,174,208,.25)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(sx-2,TIY+16);ctx.lineTo(sx-2,TIY+TIH-8);ctx.stroke();}
    ui.iconCircle(ctx,sx+8,TIY+30,8,st.icon,st.col);
    ctx.fillStyle='#9db8d4';ctx.font='9px Arial';ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillText(st.label,sx+20,TIY+25);
    ctx.fillStyle='#fff';ctx.font='bold 12px Arial';
    ctx.fillText(st.val,sx+20,TIY+44);
  }
  // Sell button (right)
  if(t){
    ui.panel(ctx,TIX+TIW-58,TIY+6,52,TIH-12,{radius:8,c1:'#063462',c2:'#1265a9',stroke:'#45b7ff',glow:'rgba(37,157,255,.45)'});
    ctx.fillStyle='#bdeaff';ctx.font='bold 18px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('⬆',TIX+TIW-32,TIY+24);
    ctx.fillStyle='#cfeaff';ctx.font='9px Arial';
    ctx.fillText('판매',TIX+TIW-32,TIY+40);
    ui.iconCircle(ctx,TIX+TIW-46,TIY+TIH-14,7,'gold','#ffd15a');
    ctx.fillStyle='#fff';ctx.font='bold 11px Arial';ctx.textAlign='left';
    ctx.fillText(String(t.sellVal),TIX+TIW-36,TIY+TIH-14);
  }
  if(isPreview){
    // Small badge only — don't cover stats
    ctx.save();
    ctx.fillStyle='rgba(20,80,140,0.85)'; ctx.strokeStyle='rgba(56,183,255,.6)'; ctx.lineWidth=1;
    rr(TIX+TIW-58,TIY+4,52,16,8); ctx.fill(); ctx.stroke();
    ctx.fillStyle='rgba(140,210,255,.9)'; ctx.font='bold 9px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('미리보기',TIX+TIW-32,TIY+12);
    ctx.restore();
  }

  // ── Upgrade Cards (3 cards, each = next tier of that path)
  const PATH_ICONS=['♨','↯','✸'];
  const PATH_THEMES=['red','green','blue'];
  for(let pi=0;pi<tree.length;pi++){
    const path=tree[pi];
    const cx=3+pi*(CARD_W+2);
    const tierIdx=t?t.upgrades[pi]:0;
    const maxed=tierIdx>=5;
    const pathName=path.name.replace(/^[\u{1F534}\u{1F7E2}\u{1F535}\u{1F7E1}\u{1F7E0}⚫⚪\u{1F7E4}]\s*/u,'');

    if(maxed){
      ui.panel(ctx,cx,CARD_Y,CARD_W,CARD_H,{radius:8,c1:'#0a2a0a',c2:'#0e3a0e',stroke:'rgba(100,200,100,.35)',shadowBlur:4});
      ctx.fillStyle='#44aa44';ctx.font='bold 13px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('✓ MAX',cx+CARD_W/2,CARD_Y+CARD_H/2);
    } else {
      const tier=path.t[tierIdx];
      const tierCost=tier[1], eff=tier[2];
      const parts=[];
      if(eff.dmgMul)     parts.push(`공격력 +${Math.round((eff.dmgMul-1)*100)}%`);
      if(eff.aoeMul)     parts.push(`범위 +${Math.round((eff.aoeMul-1)*100)}%`);
      if(eff.fpsMul)     parts.push(`공속 +${Math.round((eff.fpsMul-1)*100)}%`);
      if(eff.rngMul)     parts.push(`사거리 +${Math.round((eff.rngMul-1)*100)}%`);
      if(eff.aoeAdd)     parts.push(`범위 +${eff.aoeAdd}`);
      if(eff.slowAdd)    parts.push(`둔화 +${Math.round(eff.slowAdd*100)}%`);
      if(eff.slowDurAdd) parts.push(`지속 +${eff.slowDurAdd}s`);
      if(eff.addCamo)    parts.push('카모 탐지');
      const effectText=parts.join(' ')||tier[0];

      // Card layout: panel → header(0..32) → effect text(34..58) → icon(62..114) → cost(118..137)
      const THEME_COLS={
        red:  {c1:'#3a0a0a',c2:'#5c1212',hdr1:'#7a1a1a',hdr2:'#a82020',stroke:'rgba(255,120,120,.5)',glow:'rgba(220,60,60,.4)'},
        green:{c1:'#0a2a0a',c2:'#123a12',hdr1:'#1a6a1a',hdr2:'#2a9a2a',stroke:'rgba(100,220,100,.5)',glow:'rgba(60,180,60,.4)'},
        blue: {c1:'#0a1a3a',c2:'#12255c',hdr1:'#1a3a8a',hdr2:'#2050c0',stroke:'rgba(100,160,255,.5)',glow:'rgba(60,120,240,.4)'},
      };
      const tc=THEME_COLS[PATH_THEMES[pi]];

      // Card background
      ui.panel(ctx,cx,CARD_Y,CARD_W,CARD_H,{radius:8,c1:tc.c1,c2:tc.c2,stroke:tc.stroke,shadowBlur:6,glow:tc.glow});

      // Header strip (h=32)
      ctx.save();
      const hdrGr=ctx.createLinearGradient(cx,CARD_Y,cx,CARD_Y+32);
      hdrGr.addColorStop(0,tc.hdr1); hdrGr.addColorStop(1,tc.hdr2);
      ctx.fillStyle=hdrGr;
      ctx.beginPath();
      const R=8;
      ctx.moveTo(cx+R,CARD_Y); ctx.lineTo(cx+CARD_W-R,CARD_Y);
      ctx.arcTo(cx+CARD_W,CARD_Y,cx+CARD_W,CARD_Y+R,R);
      ctx.lineTo(cx+CARD_W,CARD_Y+32); ctx.lineTo(cx,CARD_Y+32);
      ctx.arcTo(cx,CARD_Y,cx+R,CARD_Y,R);
      ctx.closePath(); ctx.fill();
      ctx.restore();

      // Header: emoji icon + path name
      const ccx=cx+CARD_W/2;
      ctx.fillStyle='#fff'; ctx.font='bold 11px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(`${PATH_ICONS[pi]} ${pathName}`,ccx,CARD_Y+16);
      // Tier badge in header
      if(tierIdx>0){
        ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='bold 8px Arial';
        ctx.fillText(`T${tierIdx+1}`,cx+CARD_W-11,CARD_Y+7);
      }

      // Effect text (y+34..y+58, center at y+46)
      ctx.fillStyle='#e8f4ff'; ctx.font='bold 10px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
      // Wrap if too long
      const effWords=effectText.split(' ');
      if(effWords.length>1&&ctx.measureText(effectText).width>CARD_W-12){
        const mid=Math.ceil(effWords.length/2);
        ctx.fillText(effWords.slice(0,mid).join(' '),ccx,CARD_Y+40);
        ctx.fillText(effWords.slice(mid).join(' '),ccx,CARD_Y+52);
      } else {
        ctx.fillText(effectText,ccx,CARD_Y+46);
      }

      // Skill icon circle (center at y+88, radius 24)
      const orbCX=ccx, orbCY=CARD_Y+88, orbR=24;
      const skillKey=`sk_${type}_${pi}_${tierIdx}`;
      if(ok(skillKey)){
        ctx.save();
        ctx.beginPath(); ctx.arc(orbCX,orbCY,orbR,0,Math.PI*2); ctx.clip();
        ctx.drawImage(imgs[skillKey],orbCX-orbR,orbCY-orbR,orbR*2,orbR*2);
        ctx.restore();
        ctx.save();
        ctx.beginPath(); ctx.arc(orbCX,orbCY,orbR,0,Math.PI*2);
        ctx.strokeStyle='rgba(255,255,255,0.45)'; ctx.lineWidth=1.5; ctx.stroke();
        ctx.restore();
      } else {
        // Fallback: draw emoji placeholder
        ctx.save();
        const orbGr=ctx.createRadialGradient(orbCX,orbCY,0,orbCX,orbCY,orbR);
        orbGr.addColorStop(0,'rgba(80,160,255,.5)'); orbGr.addColorStop(1,'rgba(20,60,120,.7)');
        ctx.fillStyle=orbGr;
        ctx.beginPath(); ctx.arc(orbCX,orbCY,orbR,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='rgba(120,190,255,.5)'; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.arc(orbCX,orbCY,orbR,0,Math.PI*2); ctx.stroke();
        ctx.restore();
        ctx.fillStyle='rgba(200,230,255,.8)'; ctx.font=`${orbR}px Arial`; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(PATH_ICONS[pi],orbCX,orbCY);
      }

      // Cost row (center at y+122)
      ctx.fillStyle='#ffd15a'; ctx.font='bold 11px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(`💰 ${tierCost}`,ccx,CARD_Y+122);

      // Can't afford / blocked overlays
      const blocked=t&&!t.canUpgrade(pi);
      if(blocked){
        ctx.save();ctx.globalAlpha=0.55;ctx.fillStyle='#000';
        ctx.beginPath();ctx.roundRect(cx,CARD_Y,CARD_W,CARD_H,8);ctx.fill();
        ctx.restore();
        ctx.fillStyle='#888';ctx.font='22px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('🔒',ccx,CARD_Y+CARD_H/2);
      } else if(t&&G.gold<tierCost){
        ctx.save();ctx.globalAlpha=0.25;ctx.fillStyle='#600';
        ctx.beginPath();ctx.roundRect(cx,CARD_Y,CARD_W,CARD_H,8);ctx.fill();
        ctx.restore();
        ctx.fillStyle='#ff7070';ctx.font='bold 9px Arial';ctx.textAlign='center';ctx.textBaseline='bottom';
        ctx.fillText('골드 부족',ccx,CARD_Y+CARD_H-3);
      }
    }
  }
}

// ── Sprite portrait helper ────────────────────────────────────────────────
// Circle variant (used in tooltips / upgrade panel)
function drawSpritePortrait(sprKey, cx, cy, r){
  const img = imgs[sprKey];
  if(!img || !img.complete || !img.naturalWidth) return false;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.clip();
  ctx.drawImage(img, 0, 256, 64, 64, cx-r, cy-r, r*2, r*2);
  ctx.restore();
  return true;
}
// Square variant (used in monster tab)
function drawSpritePortraitRect(sprKey, x, y, w, h){
  const img = imgs[sprKey];
  if(!img || !img.complete || !img.naturalWidth) return false;
  ctx.drawImage(img, 0, 256, 64, 64, x, y, w, h);
  return true;
}

// ── Monster Tab ───────────────────────────────────────────────────────────
const MON_TAB = {perRow:5, cellW:CW/5, iconSz:52, rowH:70, startPad:6};
function drawMonsterTab(){
  const {perRow,cellW,iconSz,rowH,startPad}=MON_TAB;
  const allMons=[...MONSTER_ORDER,'megaboss'];
  const startY=PCY+startPad;
  for(let i=0;i<allMons.length;i++){
    const type=allMons[i], d=MD[type]; if(!d)continue;
    const col=i%perRow, row=Math.floor(i/perRow);
    const cx=col*cellW+cellW/2;
    const iy=startY+row*rowH;          // top of icon
    if(iy+iconSz+14>CH-2)break;
    const ix=cx-iconSz/2;
    const R=5;

    // Background rect
    ctx.fillStyle=d.bgCol+'44';
    rr(ix,iy,iconSz,iconSz,R); ctx.fill();

    // Sprite image
    if(!drawSpritePortraitRect(d.sprKey,ix,iy,iconSz,iconSz)){
      if(ok(d.imgKey)) ctx.drawImage(imgs[d.imgKey],ix,iy,iconSz,iconSz);
    }

    // Border (thicker for elite/boss)
    const hl=d.heartLoss||1;
    ctx.strokeStyle=hl>=10?'#ff3333':hl>=5?'#ff8800':d.border;
    ctx.lineWidth=hl>=5?2:1.5;
    rr(ix,iy,iconSz,iconSz,R); ctx.stroke();

    // Hover highlight
    if(hovMonsterMob===type){
      ctx.strokeStyle='rgba(255,240,60,0.9)';ctx.lineWidth=2.5;
      rr(ix-2,iy-2,iconSz+4,iconSz+4,R+1); ctx.stroke();
    }

    // Heart loss badge (top-right corner)
    if(hl>1){
      const bx=ix+iconSz-1, by=iy+1;
      ctx.fillStyle=hl>=10?'rgba(200,0,0,0.85)':'rgba(200,80,0,0.85)';
      rr(bx-16,by,17,13,3); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='bold 8px Arial';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(`♥${hl}`,bx-7,by+6);
    }

    // Name label below icon
    ctx.fillStyle='#ccddee'; ctx.font='8px Arial';
    ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillText(d.name, cx, iy+iconSz+2);
  }
  if(hovMonsterMob){
    const d=MD[hovMonsterMob]; if(d) drawMonsterTooltipAt(d,hovMonsterMob,CW/2,PANEL_Y-10,null);
  }
}

// ── Tooltip helpers ───────────────────────────────────────────────────────
const TYPE_LABEL={slash:'베기⚔',pierce:'관통🏹',explosive:'폭발💥',siege:'둔기🪨',magic:'마법❄️',holy:'성✨'};

function drawMonsterTooltipAt(d,key,anchorX,anchorY,liveData){
  const tr=d.traits||{};
  const imm=tr.immune||[], res=tr.resist||[], wk=tr.weak||[];
  const PAD=12, TW=Math.min(300,CW-12), PR=22, LH=17;
  const FONT_DESC='10px Arial', FONT_TRAIT='10px Arial';
  const traits=[];
  if(imm.length) traits.push({c:'#ff6666',t:`✗ 면역: ${imm.map(k=>TYPE_LABEL[k]||k).join('  ')}`});
  if(res.length) traits.push({c:'#ffaa55',t:`△ 저항(35%): ${res.map(k=>TYPE_LABEL[k]||k).join('  ')}`});
  if(wk.length)  traits.push({c:'#55ddff',t:`★ 취약(175%): ${wk.map(k=>TYPE_LABEL[k]||k).join('  ')}`});
  if(tr.camo)       traits.push({c:'#aaffaa',t:'🥷 은신 — 카모 감지 타워 필요'});
  if(tr.slowImmune) traits.push({c:'#88eeff',t:'❄ 둔화/빙결 면역'});
  if(tr.armor)      traits.push({c:'#ddccaa',t:`🛡 방어력 ${tr.armor}`});
  if(tr.shield){const sh=liveData?liveData.shield:tr.shield;traits.push({c:'#ffee88',t:`⬡ 방패 ${sh}회 — 피해 무효`});}
  if(tr.regen)  traits.push({c:'#88ff88',t:`💚 HP 재생 ${tr.regen}/초`});
  if(tr.spawn)  traits.push({c:'#ffbb88',t:`🔀 소멸 시 ${MD[tr.spawn.type]?.name||tr.spawn.type} ×${tr.spawn.count}`});
  if(!traits.length) traits.push({c:'#555566',t:'특성 없음'});
  const descLines=wrapText(d.desc,TW-PAD*2,FONT_DESC);
  const headerH=PAD+PR*2+8, descH=descLines.length*14+6, traitH=traits.length*LH+6;
  const TH=headerH+descH+traitH;

  let tx=anchorX-TW/2, ty=anchorY-TH-8;
  tx=Math.max(4,Math.min(CW-TW-4,tx));
  ty=Math.max(HUD_H+4,Math.min(PANEL_Y-TH-4,ty));

  ctx.save();
  ctx.shadowColor='rgba(0,0,0,0.88)';ctx.shadowBlur=18;ctx.shadowOffsetX=3;ctx.shadowOffsetY=5;
  ctx.fillStyle='rgba(7,5,20,0.97)';ctx.strokeStyle=d.border;ctx.lineWidth=1.5;
  rr(tx,ty,TW,TH,8);ctx.fill();ctx.stroke();
  ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;
  ctx.save();rr(tx,ty,TW,PR*2+PAD*2+2,8);ctx.fillStyle=d.bgCol+'28';ctx.fill();ctx.restore();
  const pcx=tx+PAD+PR, pcy=ty+PAD+PR;
  ctx.beginPath();ctx.arc(pcx,pcy,PR,0,Math.PI*2);ctx.fillStyle=d.bgCol;ctx.fill();
  if(!drawSpritePortrait(d.sprKey,pcx,pcy,PR)){
    ctx.save();ctx.beginPath();ctx.arc(pcx,pcy,PR,0,Math.PI*2);ctx.clip();
    if(ok(d.imgKey))ctx.drawImage(imgs[d.imgKey],pcx-PR,pcy-PR,PR*2,PR*2);
    ctx.restore();
  }
  ctx.beginPath();ctx.arc(pcx,pcy,PR,0,Math.PI*2);ctx.strokeStyle=d.border;ctx.lineWidth=2;ctx.stroke();
  const nx=tx+PAD+PR*2+10, ny=ty+PAD;
  ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillStyle='#ffffff';ctx.font='bold 13px Arial';ctx.fillText(d.name,nx,ny);
  if(liveData){
    const pct=Math.max(0,Math.ceil(liveData.hp)/liveData.maxHp);
    const bx=nx,by=ny+18,bw=TW-(nx-tx)-PAD-2,bh=7;
    ctx.fillStyle='#1a1a2e';rr(bx,by,bw,bh,2);ctx.fill();
    ctx.fillStyle=pct>0.5?'#44ee77':pct>0.25?'#ffcc44':'#ff4444';
    rr(bx,by,Math.max(3,bw*pct),bh,2);ctx.fill();
    ctx.fillStyle='#aabbcc';ctx.font='10px Arial';ctx.fillText(`HP ${Math.ceil(liveData.hp)}/${liveData.maxHp}`,nx,by+10);
  }else{
    ctx.fillStyle='#aabbcc';ctx.font='10px Arial';ctx.fillText(`HP ${d.hp}  ·  속도 ${d.spd}`,nx,ny+16);
    ctx.fillStyle='#c8a96e';ctx.fillText(`보상 ${d.rew}g`,nx,ny+28);
  }
  let oy=ty+PAD+PR*2+8;
  ctx.fillStyle='#8899aa';ctx.font=FONT_DESC;ctx.textBaseline='top';
  for(const dl of descLines){ctx.fillText(dl,tx+PAD,oy);oy+=14;}
  oy+=4;
  for(const ln of traits){ctx.fillStyle=ln.c;ctx.font=FONT_TRAIT;ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(ln.t,tx+PAD,oy);oy+=LH;}
  ctx.restore();
}

// ── Live balloon tooltip ──────────────────────────────────────────────────
let hovLiveBalloon=null;
let hovMonsterMob=null;
let _touchClearTimer=null;

function getLiveBalloonAt(mx,my){
  if(!G||!G.balloons)return null;
  if(my<HUD_H||my>=PANEL_Y)return null;
  for(const b of G.balloons){
    if(!b.alive)continue;
    if(Math.hypot(mx-b.x,my-b.y)<=b.rad+8)return b;
  }
  return null;
}
function drawLiveBalloonTooltip(){
  if(!hovLiveBalloon||!hovLiveBalloon.alive){hovLiveBalloon=null;return;}
  const key=hovLiveBalloon.type, d=MD[key]; if(!d)return;
  let ty=hovLiveBalloon.y-20;
  drawMonsterTooltipAt(d,key,hovLiveBalloon.x,ty,hovLiveBalloon);
}

// ── Monster panel tooltip state ───────────────────────────────────────────
function getMonsterTabAt(mx,my){
  if(G.mobileTab!==2)return null;
  if(my<PCY||my>=CH)return null;
  const {perRow,cellW,iconSz,rowH,startPad}=MON_TAB;
  const allMons=[...MONSTER_ORDER,'megaboss'];
  const startY=PCY+startPad;
  for(let i=0;i<allMons.length;i++){
    const col=i%perRow, row=Math.floor(i/perRow);
    const cx=col*cellW+cellW/2;
    const iy=startY+row*rowH, ix=cx-iconSz/2;
    if(mx>=ix&&mx<ix+iconSz&&my>=iy&&my<iy+iconSz+12) return allMons[i];
  }
  return null;
}

// ── Info Overlay ──────────────────────────────────────────────────────────
function drawInfoOverlay(){
  if(!G.showInfo)return;
  const TX=8, TY=HUD_H+4, TW=CW-16, TH=CH-HUD_H-PANEL_H-12;
  ctx.fillStyle='rgba(8,5,18,0.97)';ctx.strokeStyle='#c8a96e';ctx.lineWidth=1.5;
  rr(TX,TY,TW,TH,10);ctx.fill();ctx.stroke();

  // Close
  const clx=TX+TW-36, cly=TY+6;
  ctx.fillStyle='#2a0a0a';ctx.strokeStyle='#884444';ctx.lineWidth=1;
  rr(clx,cly,30,26,5);ctx.fill();ctx.stroke();
  ctx.fillStyle='#ffaaaa';ctx.font='bold 13px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('✕',clx+15,cly+13);

  ctx.fillStyle='#c8a96e';ctx.font='bold 13px Arial';ctx.textAlign='center';ctx.textBaseline='top';
  ctx.fillText('[ 몬스터 속성 가이드 ]',TX+TW/2,TY+8);

  const PAD=10, CARD_W=Math.floor((TW-PAD*2)/6), CARD_H=80;

    if(cardY+CARD_H>TY+TH-8)return;
    ctx.fillStyle='rgba(8,8,22,0.92)';ctx.strokeStyle='#c8a96e';ctx.lineWidth=1;
    rr(cardX,cardY,CARD_W-2,CARD_H,5);ctx.fill();ctx.stroke();
    const pr=12, pcx=cardX+CARD_W/2-1, pcy=cardY+16;
    ctx.beginPath();ctx.arc(pcx,pcy,pr,0,Math.PI*2);ctx.fillStyle=d.bgCol;ctx.fill();
    if(!drawSpritePortrait(d.sprKey,pcx,pcy,pr)){
      ctx.save();ctx.beginPath();ctx.arc(pcx,pcy,pr,0,Math.PI*2);ctx.clip();
      if(ok(d.imgKey))ctx.drawImage(imgs[d.imgKey],pcx-pr,pcy-pr,pr*2,pr*2);
      ctx.restore();
    }
    ctx.beginPath();ctx.arc(pcx,pcy,pr,0,Math.PI*2);ctx.strokeStyle=d.border;ctx.lineWidth=1.2;ctx.stroke();
    ctx.fillStyle='#ffd98b';ctx.font='bold 8px Arial';ctx.textAlign='center';ctx.textBaseline='top';

    if(imm.length){ctx.fillStyle='#ff5555';ctx.font='7px Arial';ctx.fillText(`✗${imm.map(shortLabel).join('')}`,pcx,y);y+=10;}
    if(res.length){ctx.fillStyle='#ffaa55';ctx.font='7px Arial';ctx.fillText(`△${res.map(shortLabel).join('')}`,pcx,y);y+=10;}
    if(wk.length){ctx.fillStyle='#55ddff';ctx.font='7px Arial';ctx.fillText(`★${wk.map(shortLabel).join('')}`,pcx,y);y+=10;}
    const extras=[];
    if(tr.camo)extras.push('🥷');if(tr.slowImmune)extras.push('❄');if(tr.armor)extras.push(`🛡${tr.armor}`);if(tr.regen)extras.push(`💚${tr.regen}`);
    if(extras.length){ctx.fillStyle='#aaccee';ctx.font='8px Arial';ctx.fillText(extras.join(' '),pcx,y);}
  });
}

// ── Input ─────────────────────────────────────────────────────────────────
let hovC=-1, hovR=-1;
let dragTower=null;  // {type} — persists after invalid drop so ghost remains
let dragGhostC=-1, dragGhostR=-1;  // ghost anchor cell; -1 = not yet set (first gesture)
let dragOriginPx=null;              // pixel origin of current drag gesture
const mouse={x:0,y:0};

function getCanvasPos(clientX, clientY){
  const rc=canvas.getBoundingClientRect();
  const scaleX=CW/rc.width, scaleY=CH/rc.height;
  return {x:(clientX-rc.left)*scaleX, y:(clientY-rc.top)*scaleY};
}

canvas.addEventListener('mousemove', e=>{
  const {x,y}=getCanvasPos(e.clientX,e.clientY);
  mouse.x=x; mouse.y=y;
  hovC=Math.floor(x/CELL);
  hovR=Math.floor((y-HUD_H)/CELL);
  if(y<PANEL_Y) hovLiveBalloon=getLiveBalloonAt(x,y);
  // Monster tab hover (desktop)
  if(G.mobileTab===2){
    const mk=getMonsterTabAt(x,y);
    hovMonsterMob=mk||null;
  }
});

canvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  AudioSys.unlock();
  const t=e.touches[0];
  const {x,y}=getCanvasPos(t.clientX,t.clientY);
  mouse.x=x; mouse.y=y;
  hovC=Math.floor(x/CELL);
  hovR=Math.floor((y-HUD_H)/CELL);
  // Keep ghost at anchor if tower is pending (prevents snap on any touchstart outside game area)
  if(dragTower && dragGhostC>=0){ hovC=dragGhostC; hovR=dragGhostR; }
  // Monster tab tap
  const mk=getMonsterTabAt(x,y);
  if(mk){
    hovMonsterMob=(hovMonsterMob===mk)?null:mk;
    clearTimeout(_touchClearTimer);
    _touchClearTimer=setTimeout(()=>{hovMonsterMob=null;},3000);
    return;
  }
  // Live balloon tap
  const lb=getLiveBalloonAt(x,y);
  if(lb){hovLiveBalloon=lb;clearTimeout(_touchClearTimer);_touchClearTimer=setTimeout(()=>{hovLiveBalloon=null;},2500);return;}
  // Pending drag tower + touching game area: intercept so touchmove/touchend handle placement
  if(dragTower && y>=HUD_H && y<PANEL_Y){
    const col=Math.floor(x/CELL), row=Math.floor((y-HUD_H)/CELL);
    const existing=G.towers.find(t=>col>=t.col&&col<t.col+2&&row>=t.row&&row<t.row+2);
    if(existing){
      // Tapped an existing tower: cancel drag, select it
      dragTower=null; dragGhostC=-1; dragGhostR=-1; dragOriginPx=null; handleClick(x,y);
    } else {
      // Record anchor: first gesture → ghost at finger; subsequent → keep last ghost position
      if(dragGhostC<0){ dragGhostC=col; dragGhostR=row; }
      dragOriginPx={x,y};
      hovC=dragGhostC; hovR=dragGhostR;
    }
    return;
  }
  handleClick(x,y);
},{passive:false});

canvas.addEventListener('touchmove', e=>{
  e.preventDefault();
  const t=e.touches[0];
  const {x,y}=getCanvasPos(t.clientX,t.clientY);
  mouse.x=x; mouse.y=y;
  if(dragTower && dragGhostC>=0){
    // Ghost anchor mode: always move relative to last anchor, never snap to finger
    if(!dragOriginPx) dragOriginPx={x,y};  // lazily init if touchstart was outside game area
    const dC=Math.round((x-dragOriginPx.x)/CELL);
    const dR=Math.round((y-dragOriginPx.y)/CELL);
    hovC=dragGhostC+dC;
    hovR=dragGhostR+dR;
  } else {
    hovC=Math.floor(x/CELL);
    hovR=Math.floor((y-HUD_H)/CELL);
  }
  if(G.mobileTab===2){
    const mk=getMonsterTabAt(x,y);
    hovMonsterMob=mk||null;
  }
},{passive:false});

canvas.addEventListener('touchend', e=>{
  e.preventDefault();
  // Attempt tower placement from drag gesture
  if(dragTower && hovC>=0 && hovC+1<COLS && hovR>=0 && hovR+1<ROWS){
    const col=hovC, row=hovR;
    if(isBuildable2x2(col,row) && !G.towers.some(t=>col+2>t.col&&col<t.col+2&&row+2>t.row&&row<t.row+2)){
      if(G.gold>=TD[dragTower.type].cost){
        G.gold-=TD[dragTower.type].cost;
        G.towers.push(new Tower(dragTower.type,col,row));
        AudioSys.play('place');
        dragTower=null; dragGhostC=-1; dragGhostR=-1;
      } else {
        dragGhostC=col; dragGhostR=row;
      }
    } else {
      // Invalid spot: update ghost anchor so next drag starts from here
      dragGhostC=col; dragGhostR=row;
    }
  }
  dragOriginPx=null;
},{passive:false});

canvas.addEventListener('click', ()=>handleClick(mouse.x,mouse.y));

canvas.addEventListener('contextmenu', e=>{
  e.preventDefault();
  G.selTower=null; G.mobileTab=0;
});

function handleClick(mx,my){
  AudioSys.unlock();
  if(G.state==='gameover'||G.state==='victory'){
    if(restartBtn){const b=restartBtn;if(mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h){AudioSys.play('ui');initGame();return;}}
    return;
  }
  // Info overlay close
  if(G.showInfo){
    const TX=8, TY=HUD_H+4, TW=CW-16;
    const clx=TX+TW-36, cly=TY+6;
    if(mx>=clx&&mx<=clx+30&&my>=cly&&my<=cly+26){AudioSys.play('ui');G.showInfo=false;return;}
    AudioSys.play('ui');G.showInfo=false;return;
  }
  // HUD row 2 buttons
  if(my>=28&&my<HUD_H){
    if(G.state==='rest'&&mx>=8&&mx<=208){AudioSys.play('ui');startWave();return;}
    if(mx>=214&&mx<=274){AudioSys.play('ui');G.ff=!G.ff;return;}
    if(mx>=280&&mx<=324){AudioSys.play('ui');G.showInfo=!G.showInfo;return;}
    if(G.selTower&&mx>=330&&mx<=410){
      G.gold+=G.selTower.sellVal;
      AudioSys.play('sell');
      G.towers=G.towers.filter(t=>t!==G.selTower);
      G.selTower=null;G.mobileTab=0;return;
    }
    return;
  }
  // HUD row 1
  if(my<HUD_H)return;

  // Bottom panel
  if(my>=PANEL_Y){
    // Tab bar
    if(my<PANEL_Y+TAB_H){
      const ti=Math.floor(mx/(CW/3));
      if(ti===1&&!G.selTower)return; // disabled
      AudioSys.play('ui');
      G.mobileTab=ti;return;
    }
    // Upgrade buttons
    if(G.mobileTab===1&&G.selTower){
      handleUpgradeClickMob(mx,my);return;
    }
    // Tower shop card tap
    if(G.mobileTab===0){
      const CARD_W=96, CARD_Y=PCY+4, CARD_H=86;
      if(my>=CARD_Y&&my<CARD_Y+CARD_H){
        const idx=Math.floor(mx/CARD_W);
        if(idx>=0&&idx<TOWER_ORDER.length){
          AudioSys.play('ui');
          const type=TOWER_ORDER[idx];
          // "!" button: top-right 16×16 hit area
          const bx=idx*CARD_W+CARD_W-18, by=CARD_Y+3;
          if(mx>=bx&&mx<bx+16&&my>=by&&my<by+16){
            G.selType=type; G.previewType=type; G.mobileTab=1;
          } else {
            // Card body: select for placement, stay on shop tab
            G.selType=type; G.previewType=null;
            dragTower={type}; dragGhostC=-1; dragGhostR=-1; dragOriginPx=null;
          }
          return;
        }
      }
    }
    return;
  }

  // Game area
  const col=Math.floor(mx/CELL), row=Math.floor((my-HUD_H)/CELL);
  if(col<0||col>=COLS||row<0||row>=ROWS)return;
  const existing=G.towers.find(t=>col>=t.col&&col<t.col+2&&row>=t.row&&row<t.row+2);
  if(existing){ AudioSys.play('ui'); dragTower=null; dragGhostC=-1; dragGhostR=-1; G.selTower=existing; G.previewType=null; G.mobileTab=1; return; }
  G.selTower=null; G.previewType=null; G.mobileTab=0;
  if(!isBuildable2x2(col,row))return;
  if(G.towers.some(t=>col+2>t.col&&col<t.col+2&&row+2>t.row&&row<t.row+2))return;
  if(G.gold>=TD[G.selType].cost){
    G.gold-=TD[G.selType].cost;
    G.towers.push(new Tower(G.selType,col,row));
    AudioSys.play('place');
    dragTower=null; dragGhostC=-1; dragGhostR=-1;
  }
}

function handleUpgradeClickMob(mx,my){
  const t=G.selTower; if(!t)return;
  const TIX=4, TIY=PCY+2, TIW=CW-8, TIH=76;
  const CARD_Y=TIY+TIH+4, CARD_H=CH-CARD_Y-3, CARD_W=Math.floor((CW-10)/3);

  // Tower icon tap → cycle to next placed tower
  if(mx>=TIX+6&&mx<TIX+68&&my>=TIY+6&&my<TIY+TIH-6&&G.towers.length>1){
    const idx=G.towers.indexOf(t);
    G.selTower=G.towers[(idx+1)%G.towers.length];
    AudioSys.play('ui'); return;
  }
  // Sell button in tower info panel
  if(mx>=TIX+TIW-58&&mx<TIX+TIW-6&&my>=TIY+6&&my<TIY+TIH-6){
    G.gold+=t.sellVal; AudioSys.play('sell');
    G.towers=G.towers.filter(tw=>tw!==t);
    G.selTower=null; G.mobileTab=0; return;
  }
  // Upgrade card click
  if(my>=CARD_Y&&my<CARD_Y+CARD_H){
    const pi=Math.floor((mx-3)/(CARD_W+2));
    if(pi>=0&&pi<3){ if(t.doUpgrade(pi)) AudioSys.play('upgrade'); }
  }
}

// ── Game Loop ─────────────────────────────────────────────────────────────
let lastT=0;
function loop(ts){
  const rawDt=Math.min((ts-lastT)/1000,0.05);lastT=ts;
  ctx.clearRect(0,0,CW,CH);
  // 로딩 중이면 로딩바만 표시
  if(totalAssets > 0 && loadedCount < totalAssets){
    drawLoading();
    requestAnimationFrame(loop);
    return;
  }
  const dt=rawDt*(G.ff?2:1);
  AudioSys.update(rawDt);
  if(G.state==='wave'){
    updateSpawner(dt);updateBalloons(dt);updateTowers(dt);
    updateProjectiles(dt);updateExplosions(dt);checkWaveDone();
    G.balloons=G.balloons.filter(b=>b.alive);
    G.projectiles=G.projectiles.filter(p=>p.alive);
    G.explosions=G.explosions.filter(e=>e.alive);
  }
  if(G.state==='rest'){
    if(isFinite(G.restTimer))G.restTimer-=rawDt;
    updateExplosions(dt);G.explosions=G.explosions.filter(e=>e.alive);
    if(G.restTimer<=0)startWave();
  }
  drawBG();drawGrid();drawTowers();drawBalloons();drawProjectiles();drawExplosions();
  drawWaveProgress();drawHUD();drawBottomPanel();drawLiveBalloonTooltip();drawOverlay();drawInfoOverlay();
  requestAnimationFrame(loop);
}

// ── Boot ──────────────────────────────────────────────────────────────────
initGame();loadMapFromStorage();loadAssets();
// 에디터에서 맵 저장 시 자동 반영 (웨이브 대기 중일 때만 적용)
window.addEventListener('storage', e=>{
  if(e.key==='btd_maps'||e.key==='btd_last_map'){
    if(G.state==='rest'||G.state==='gameover'||G.state==='victory') loadMapFromStorage();
  }
});
requestAnimationFrame(loop);

// ── Fullscreen ────────────────────────────────────────────────────────────
(function(){
  const btn = document.getElementById('fs-btn');
  function isFS(){ return !!(document.fullscreenElement||document.webkitFullscreenElement); }
  // 세로 고정 후 fitCanvas 호출 — Promise 체이닝으로 순서 보장
  function lockPortraitThenFit(){
    const p = (screen.orientation && screen.orientation.lock)
      ? screen.orientation.lock('portrait-primary').catch(()=>{})
      : Promise.resolve();
    return p.then(()=>{ fitCanvas(); setTimeout(fitCanvas, 250); });
  }
  function enterFS(){
    const el = document.documentElement;
    const fn = el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen||el.msRequestFullscreen;
    if(!fn){ fitCanvas(); return; }
    fn.call(el).then(lockPortraitThenFit).catch(()=>{ fitCanvas(); });
  }
  function exitFS(){
    const fn = document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen||document.msExitFullscreen;
    if(fn) fn.call(document).then(()=>{ setTimeout(fitCanvas,100); }).catch(()=>{});
  }
  function updateBtn(){ btn.textContent = isFS() ? '✕' : '⛶'; }
  function onFSChange(){
    updateBtn();
    if(isFS()) lockPortraitThenFit();
    else setTimeout(fitCanvas, 100);
  }
  // orientation 실제 변경 완료 시점에도 재계산
  if(screen.orientation) screen.orientation.addEventListener('change', ()=>setTimeout(fitCanvas, 100));
  document.addEventListener('fullscreenchange', onFSChange);
  document.addEventListener('webkitfullscreenchange', onFSChange);
  btn.addEventListener('click', e=>{ e.stopPropagation(); isFS() ? exitFS() : enterFS(); });
  // Auto fullscreen on first touch
  document.addEventListener('touchstart', function autoFS(){
    document.removeEventListener('touchstart', autoFS);
    if(!isFS()) enterFS();
  }, {once:true, passive:true});
  // PWA / standalone 모드는 이미 전체화면이므로 버튼 숨김
  if(window.navigator.standalone || window.matchMedia('(display-mode: fullscreen)').matches){
    btn.classList.add('hidden');
  }
})();
</script>
