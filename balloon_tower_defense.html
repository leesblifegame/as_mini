// ── Path ──────────────────────────────────────────────────────────────────
const g2p = (c,r) => ({ x:c*CELL+CELL/2, y:HUD_H+r*CELL+CELL/2 });
let PATH_WP, PATH_PX, SEG_LEN, pathSet;
const isPath = (c,r) => pathSet.has(`${c},${r}`);

// ── Build Map ─────────────────────────────────────────────────────────────
let buildMap = [];  // buildMap[row][col] = true → buildable
function initBuildMap(){
  buildMap = Array.from({length:ROWS},()=>new Array(COLS).fill(true));
}
function isBuildable(col,row){
  if(col<0||col>=COLS||row<0||row>=ROWS)return false;
  if(isPath(col,row))return false;
  return buildMap[row][col];
}
function setTileBuildable(col,row,val){
  if(col>=0&&col<COLS&&row>=0&&row<ROWS) buildMap[row][col]=val;
}
function isBuildable2x2(col,row){
  for(let dr=0;dr<2;dr++) for(let dc=0;dc<2;dc++) if(!isBuildable(col+dc,row+dr)) return false;
  return true;
}

function rebuildPath(wps) {
  PATH_WP = wps;
  PATH_PX = wps.map(([c,r]) => g2p(c,r));
  SEG_LEN = PATH_PX.slice(0,-1).map((_,i) => {
    const a=PATH_PX[i],b=PATH_PX[i+1]; return Math.hypot(b.x-a.x,b.y-a.y);
  });
  pathSet = new Set();
  for (let i=0;i<wps.length-1;i++) {
    const [c0,r0]=wps[i],[c1,r1]=wps[i+1];
    if (c0===c1) for (let r=Math.min(r0,r1);r<=Math.max(r0,r1);r++) pathSet.add(`${c0},${r}`);
    else         for (let c=Math.min(c0,c1);c<=Math.max(c0,c1);c++) pathSet.add(`${c},${r0}`);
  }
}

function loadMapFromStorage() {
  try {
    const stages = JSON.parse(localStorage.getItem('btd_stages') || '[]');
    const maps = JSON.parse(localStorage.getItem('btd_maps') || '{}');
    let mapId = stages[0];
    if (!mapId) {
      const recent = Object.values(maps).sort((a,b) => (b.savedAt||0) - (a.savedAt||0));
      if (recent.length) mapId = recent[0].id;
    }
    if (!mapId) return;
    const data = maps[mapId];
    if (!data || !Array.isArray(data.pathWP) || data.pathWP.length < 2) return;
    const ECOLS = data.cols || 17;
    const S = COLS / ECOLS; // 17→51: ×3
    const wp = data.pathWP.map(([c, r]) => {
      if (c < 0) return [-1, Math.round(r * S)];
      if (c > ECOLS) return [COLS + 1, Math.round(r * S)];
      return [Math.round(c * S), Math.round(r * S)];
    });
    rebuildPath(wp);
    initBuildMap();
    for(const [c,r] of (data.nonBuildable||[])){
      const nc=Math.round(c*S),nr=Math.round(r*S);
      if(nc>=0&&nc<COLS&&nr>=0&&nr<ROWS) buildMap[nr][nc]=false;
    }
  } catch(e) {
    console.warn('맵 로드 실패, 기본 경로 사용:', e);
  }
}

function bPos(pi,prog) {
  if (pi>=PATH_PX.length-1) return {...PATH_PX[PATH_PX.length-1]};
  const a=PATH_PX[pi],b=PATH_PX[pi+1];
  return {x:a.x+(b.x-a.x)*prog, y:a.y+(b.y-a.y)*prog};

function editorOpen(){
  E.on=true; E.sub='path'; E.dragIdx=null; E.eHovC=-1; E.eHovR=-1;
  E.wps=PATH_WP.slice(1,-1).map(([c,r])=>({col:c,row:r}));
  E.waves=WAVES.map(w=>w.map(g=>({...g})));
  E.waveIdx=0; E.groupSel=0;
  E.buildMap=buildMap.map(r=>r.slice());
  E.buildPaint=null;
}
function editorApply(){
  if(E.wps.length>=2){
    const full=[[-1,E.wps[0].row],...E.wps.map(w=>[w.col,w.row]),[COLS+1,E.wps[E.wps.length-1].row]];
    rebuildPath(full);
    buildMap=E.buildMap.map(r=>r.slice());
    G.towers=G.towers.filter(t=>isBuildable2x2(t.col,t.row));
  } else {
    buildMap=E.buildMap.map(r=>r.slice());
    G.towers=G.towers.filter(t=>isBuildable2x2(t.col,t.row));
  }
  WAVES=E.waves.map(w=>w.map(g=>({...g})));
  G.maxWaves=WAVES.length;
  E.on=false;
}
function editorCancel(){ E.on=false; }

function eInBounds(c,r){ return c>=0&&c<COLS&&r>=0&&r<ROWS; }
function eFindWP(c,r){ return E.wps.findIndex(w=>w.col===c&&w.row===r); }
function eAddWP(c,r){
  if(E.wps.length){
    const L=E.wps[E.wps.length-1];
    if(c===L.col&&r===L.row)return;
  }
  E.wps.push({col:c,row:r});
}
function eWP2px(wp){ return{x:wp.col*CELL+CELL/2,y:HUD_H+wp.row*CELL+CELL/2}; }

function drawEditorGrid(){
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,0.16)';ctx.lineWidth=0.5;
  for(let c=0;c<=COLS;c++){ctx.beginPath();ctx.moveTo(c*CELL,HUD_H);ctx.lineTo(c*CELL,HUD_H+GH);ctx.stroke();}
  for(let r=0;r<=ROWS;r++){ctx.beginPath();ctx.moveTo(0,HUD_H+r*CELL);ctx.lineTo(GW,HUD_H+r*CELL);ctx.stroke();}
  if(E.sub==='path'&&eInBounds(E.eHovC,E.eHovR)){
    ctx.fillStyle='rgba(150,200,255,0.18)';ctx.fillRect(E.eHovC*CELL,HUD_H+E.eHovR*CELL,CELL,CELL);
    if(E.dragIdx===null){
      let v=true;
      if(E.wps.length){const L=E.wps[E.wps.length-1];v=!(E.eHovC===L.col&&E.eHovR===L.row);}
      ctx.strokeStyle=v?'rgba(80,255,80,0.75)':'rgba(255,60,60,0.75)';
      ctx.lineWidth=2;ctx.setLineDash([5,3]);
      ctx.strokeRect(E.eHovC*CELL+1,HUD_H+E.eHovR*CELL+1,CELL-2,CELL-2);ctx.setLineDash([]);
    }
  }
  ctx.restore();
}

function drawEditorPath(){
  if(!E.wps.length)return;
  const full=[{col:-1,row:E.wps[0].row},...E.wps,{col:COLS+1,row:E.wps[E.wps.length-1].row}];
  ctx.save();
  for(let i=0;i<full.length-1;i++){
    const a=eWP2px(full[i]),b=eWP2px(full[i+1]);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
    ctx.strokeStyle='rgba(255,215,55,0.9)';
    ctx.lineWidth=4;ctx.lineCap='round';ctx.stroke();
    const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy),ang=Math.atan2(dy,dx);
    const cnt=Math.max(1,Math.floor(len/50));
    for(let k=1;k<=cnt;k++){
      const t=k/(cnt+1),mx=a.x+dx*t,my=a.y+dy*t;
      ctx.save();ctx.translate(mx,my);ctx.rotate(ang);
      ctx.fillStyle='rgba(0,0,0,0.5)';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('▶',1,1);ctx.fillStyle='rgba(255,230,70,0.95)';ctx.fillText('▶',0,0);ctx.restore();
    }
  }
  function eMark(p,col,lbl){
    ctx.beginPath();ctx.arc(p.x,p.y,8,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 8px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(lbl,p.x,p.y);
  }
  eMark(eWP2px(full[0]),'rgba(30,210,100,0.92)','IN');
  eMark(eWP2px(full[full.length-1]),'rgba(230,50,50,0.92)','OUT');
  for(let i=0;i<E.wps.length;i++){
    const p=eWP2px(E.wps[i]),drg=(E.dragIdx===i),r=drg?13:9;
    ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);
    ctx.fillStyle=drg?'rgba(255,190,50,0.97)':'rgba(255,120,30,0.92)';ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#fff';ctx.font=`bold ${drg?12:10}px Arial`;
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(i+1,p.x,p.y);
  }
  ctx.restore();
}

// ── Editor Click ──────────────────────────────────────────────────────────
function handleEditorClick(mx,my){
  if(my<HUD_H)return;
  const px=PX,pw=PW;
  if(mx>=GW){
    // sub-tabs (3)
    const ty=HUD_H+6,tabW=(pw-8)/3;
    if(my>=ty&&my<ty+26){
      if(mx>=px&&mx<px+tabW){E.sub='path';return;}
      if(mx>=px+tabW+4&&mx<px+tabW*2+4){E.sub='wave';return;}
      if(mx>=px+tabW*2+8&&mx<px+pw){E.sub='build';return;}
    }
    // apply / cancel
    const ay=CH-52,bh=34,bw=(pw-6)/2;
    if(my>=ay&&my<ay+bh){
      if(mx>=px&&mx<px+bw){editorApply();return;}
      if(mx>=px+bw+6&&mx<px+pw){editorCancel();return;}
    }
    const cy=HUD_H+6+34;
    if(E.sub==='path')       handleEditorPathPanelClick(mx,my,px,pw,cy);
    else if(E.sub==='wave')  handleEditorWavePanelClick(mx,my,px,pw,cy);
    else                     handleEditorBuildPanelClick(mx,my,px,pw,cy);
    return;
  }
  // game area
  if(E.sub==='path'){
    const col=Math.floor(mx/CELL),row=Math.floor((my-HUD_H)/CELL);
    if(!eInBounds(col,row))return;
    if(eFindWP(col,row)>=0)return; // drag
    eAddWP(col,row);
  }
  // build mode painting is handled by mousedown/mousemove
}

function handleEditorBuildPanelClick(mx,my,px,pw,y){
  const by=y+74, bw=(pw-6)/2;
  if(my>=by&&my<by+24){
    const val=mx>=px&&mx<px+bw;
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) E.buildMap[r][c]=val;
  }
}

function handleEditorPathPanelClick(mx,my,px,pw,y){
  const bw=(pw-6)/2;
  if(my>=y&&my<y+24){
    if(mx>=px&&mx<px+bw){if(E.wps.length)E.wps.pop();return;}
    if(mx>=px+bw+6&&mx<px+pw){E.wps=[];return;}
  }
}

function handleEditorWavePanelClick(mx,my,px,pw,y){
  const waves=E.waves;
  // Wave nav
  if(my>=y&&my<y+28){
    if(mx>=px&&mx<px+24){E.waveIdx=Math.max(0,E.waveIdx-1);E.groupSel=0;return;}
    if(mx>=px+pw-24&&mx<px+pw){E.waveIdx=Math.min(waves.length-1,E.waveIdx+1);E.groupSel=0;return;}
  }
  y+=36;
  const wave=waves[E.waveIdx];
  const GH2=34,TBW=14,TLW=58,CBW=20,CVW=28;
  for(let gi=0;gi<wave.length;gi++){
    const gy=y+gi*GH2;
    if(my>=gy&&my<gy+GH2-2){
      E.groupSel=gi;
      const g=wave[gi];
      // Type [<] [>]
      if(mx>=px&&mx<px+TBW){const ti=MON_LST.indexOf(g.type);g.type=MON_LST[(ti-1+MON_LST.length)%MON_LST.length];return;}
      if(mx>=px+TBW+TLW&&mx<px+TBW*2+TLW){const ti=MON_LST.indexOf(g.type);g.type=MON_LST[(ti+1)%MON_LST.length];return;}
      // Count [-] [+]
      const cx2=px+TBW*2+TLW+6;
      if(mx>=cx2&&mx<cx2+CBW){g.count=Math.max(1,g.count-1);return;}
      if(mx>=cx2+CBW+CVW&&mx<cx2+CBW*2+CVW){g.count=Math.min(999,g.count+1);return;}
      return;
    }
  }
  y+=wave.length*GH2+8;
  const abw=(pw-6)/2;
  if(my>=y&&my<y+24){
    if(mx>=px&&mx<px+abw){waves[E.waveIdx].push({type:'slime',count:5,iv:50,at:0});E.groupSel=waves[E.waveIdx].length-1;return;}
    if(mx>=px+abw+6&&mx<px+pw){if(wave.length>1){wave.splice(E.groupSel,1);E.groupSel=Math.min(E.groupSel,wave.length-1);}return;}
  }
}

// ── Game State ────────────────────────────────────────────────────────────
let G={};
function initGame(){
  G={lives:20,gold:200,wave:0,maxWaves:40,score:0,
    state:'rest',towers:[],balloons:[],projectiles:[],explosions:[],
    selType:'arrow',selTower:null,previewType:null,spawnQueue:[],spawnTimer:0,restTimer:Infinity,ff:false,showInfo:false,
    waveTotal:0};
}

let _id=0; const nid=()=>++_id;

// ── Balloon ───────────────────────────────────────────────────────────────
class Balloon {
  constructor(type,pi=0,prog=0){
    const d=MD[type]; this.id=nid(); this.type=type;
    this.hp=d.hp; this.maxHp=d.hp; this.spd=d.spd; this.rew=d.rew; this.rad=d.rad;
    this.imgKey=d.imgKey; this.bgCol=d.bgCol; this.border=d.border; this.isBoss=d.isBoss||false;
    this.traits=d.traits||{}; this.shield=this.traits.shield||0;
    this.pi=pi; this.prog=prog; const p=bPos(pi,prog); this.x=p.x; this.y=p.y;
    this.dist=pi+prog; this.alive=true; this.reached=false; this.slowT=0; this.slowF=0;
  }
}

// ── Sprite Sheet Animation ────────────────────────────────────────────────
// 스프라이트 시트 포맷: 64×64 프레임, 각 row = 애니메이션 상태
//   Row 0: IDLE (3 frames)   Row 1: ATTACK (3 frames)
//   Row 2: HIT  (3 frames)   Row 3: DEAD   (4 frames)
//   Row 4: FX/투사체 (4 frames)
const FRAME_SZ = 64;
const TOWER_ANIM = {
  arrow:  {sh:'sh_arrow',  pj:'pj_arrow',  idle:{row:0,frames:4,fps:5},  attack:{row:1,frames:4,fps:12}, fx:{frames:4,fps:16}},
  cannon: {sh:'sh_cannon', pj:'pj_cannon', idle:{row:0,frames:4,fps:4},  attack:{row:1,frames:4,fps:10}, fx:{frames:4,fps:12}},
  ice:    {sh:'sh_ice',    pj:'pj_ice',    idle:{row:0,frames:4,fps:4},  attack:{row:1,frames:4,fps:10}, fx:{frames:4,fps:10}},
  sniper: {sh:'sh_sniper', pj:'pj_sniper', idle:{row:0,frames:4,fps:3},  attack:{row:1,frames:4,fps:14}, fx:{frames:4,fps:18}},
  bomb:   {sh:'sh_bomb',   pj:'pj_bomb',   idle:{row:0,frames:4,fps:4},  attack:{row:1,frames:4,fps:10}, fx:{frames:4,fps:12}},
};

// ── Tower ─────────────────────────────────────────────────────────────────
class Tower {
  constructor(type,col,row){
    this.type=type; this.col=col; this.row=row;
    this.x=col*CELL+CELL; this.y=HUD_H+row*CELL+CELL;
    this.upgrades=[0,0,0];  // tier per path (0–5)
    this.cd=0; this.angle=-Math.PI/2;
    this._statsCache=null;
    // 애니메이션
    this.animState='idle'; this.animF=0; this.animTimer=0;
    this.attacking=false;  this.attackT=0;
  }

  updateAnim(dt){
    const a=TOWER_ANIM[this.type]; if(!a)return;
    if(this.attacking){
      this.attackT+=dt;
      const dur=a.attack.frames/a.attack.fps;
      if(this.attackT>=dur){this.attacking=false;this.attackT=0;this.animState='idle';this.animF=0;}
      else{this.animF=this.attackT*a.attack.fps;this.animState='attack';}
    }else{
      this.animTimer+=dt;
      this.animF=(this.animTimer*a.idle.fps)%a.idle.frames;
      this.animState='idle';
    }
  }

  triggerAttack(){
    this.attacking=true;this.attackT=0;this.animState='attack';this.animF=0;
  }
  get d(){ return TD[this.type]; }
  get tree(){ return UT[this.type]; }

  _computeStats(){
    const d=this.d;
    let dmg=d.bDmg, rng=d.bRng, fps=d.bFps, aoe=d.bAoe, slow=d.bSlow, slowDur=d.bSlowDur;
    const atkTypes=new Set(d.atkType);
    let canSeeCamo=d.baseCamo||false;
    for (let pi=0;pi<3;pi++){
      const path=this.tree[pi];
      for (let ti=0;ti<this.upgrades[pi];ti++){
        const e=path.t[ti][2];
        if (e.dmgMul)    dmg*=e.dmgMul;
        if (e.rngMul)    rng=Math.min(rng*e.rngMul,9999);
        if (e.fpsMul)    fps*=e.fpsMul;
        if (e.aoeAdd)    aoe+=e.aoeAdd;
        if (e.aoeMul)    aoe*=e.aoeMul;
        if (e.slowAdd)   slow=Math.min(slow+e.slowAdd,0.95);
        if (e.slowDurAdd)slowDur+=e.slowDurAdd;
        if (e.addType)   atkTypes.add(e.addType);
        if (e.addTypes)  e.addTypes.forEach(t=>atkTypes.add(t));
        if (e.addCamo)   canSeeCamo=true;
      }
    }
    return {dmg:Math.round(dmg),rng:Math.round(rng),fps,aoe:Math.round(aoe),slow,slowDur,atkTypes:[...atkTypes],canSeeCamo};
  }
  get stats(){ if(!this._statsCache) this._statsCache=this._computeStats(); return this._statsCache; }
  _dirty(){ this._statsCache=null; }

  get dmg(){ return this.stats.dmg; }
  get rng(){ return this.stats.rng; }
  get fps(){ return this.stats.fps; }
  get aoe(){ return this.stats.aoe; }
  get slow(){ return this.stats.slow; }
  get slowDur(){ return this.stats.slowDur; }
  get atkTypes(){ return this.stats.atkTypes; }
  get canSeeCamo(){ return this.stats.canSeeCamo; }

  // BTD rule: max 2 active paths; only 1 path can reach tier 3+
  canUpgrade(pi){
    const next=this.upgrades[pi]+1;
    if (next>5) return false;
    // activating this path (going from 0→1): can't have 2 other active paths
    if (this.upgrades[pi]===0){
      const otherActive=this.upgrades.filter((_,i)=>i!==pi&&this.upgrades[i]>0).length;
      if (otherActive>=2) return false;
    }
    // going to tier 3+: no other path may be at tier 3+
    if (next>=3){
      for (let i=0;i<3;i++) if (i!==pi&&this.upgrades[i]>=3) return false;
    }
    return true;
  }

  upgradeCost(pi){
    const ti=this.upgrades[pi];
    if (ti>=5) return null;
    return this.tree[pi].t[ti][1];
  }

  doUpgrade(pi){
    if (!this.canUpgrade(pi)) return false;
    const cost=this.upgradeCost(pi);
    if (cost===null||G.gold<cost) return false;
    G.gold-=cost; this.upgrades[pi]++; this._dirty();
    return true;
  }

  get sellVal(){
    let total=this.d.cost;
    for (let pi=0;pi<3;pi++){
      const path=this.tree[pi];
      for (let ti=0;ti<this.upgrades[pi];ti++) total+=path.t[ti][1];
    }
    return Math.floor(total*0.6);
  }

  // Highest upgrade path info for visual
  get topPath(){
    let best=-1,bestPi=-1;
    for (let i=0;i<3;i++) if (this.upgrades[i]>best){best=this.upgrades[i];bestPi=i;}
    return bestPi>=0&&best>0?{pi:bestPi,tier:best,col:this.tree[bestPi].col}:null;
  }
}

// ── Projectile ────────────────────────────────────────────────────────────
class Proj {
  constructor(tower,target){
    this.id=nid(); this.tid=target.id;
    this.x=tower.x; this.y=tower.y; this.tx=target.x; this.ty=target.y;
    this.spd=tower.d.pspd; this.col=tower.d.pcol; this.rad=tower.d.prad;
    this.dmg=tower.dmg; this.aoe=tower.aoe; this.slow=tower.slow; this.slowDur=tower.slowDur;
    this.atkTypes=tower.atkTypes;
    this.towerType=tower.type;
    this.alive=true;
    const dx=this.tx-this.x,dy=this.ty-this.y,d=Math.hypot(dx,dy)||1;
    this.vx=dx/d*this.spd; this.vy=dy/d*this.spd;
    this.angle=Math.atan2(dy,dx);
    this.fxTimer=0;
  }
}
class Expl {
  constructor(x,y,maxR,col){this.x=x;this.y=y;this.maxR=maxR;this.r=5;this.col=col;this.alpha=0.85;this.alive=true;}
}

// ── Wave Logic ────────────────────────────────────────────────────────────
function startWave(){
  if (G.wave>=G.maxWaves) return;
  G.wave++; G.state='wave';
  const def=WAVES[G.wave-1]; G.spawnQueue=[];
  for (const s of def) for (let i=0;i<s.count;i++) G.spawnQueue.push({type:s.type,t:s.at+i*s.iv});
  G.spawnQueue.sort((a,b)=>a.t-b.t); G.spawnTimer=0;
  G.waveTotal=G.spawnQueue.length;
}
function checkWaveDone(){
  if (G.state!=='wave') return;
  if (G.spawnQueue.length>0) return;
  if (G.balloons.some(b=>b.alive)) return;
  G.gold+=25+G.wave*6; G.score+=(25+G.wave*6)*5;
  if (G.wave>=G.maxWaves){G.state='victory';return;}
  G.state='rest'; G.restTimer=1.5;
}

// ── Update ────────────────────────────────────────────────────────────────
function updateSpawner(dt){
  G.spawnTimer+=dt*60;
  while(G.spawnQueue.length&&G.spawnQueue[0].t<=G.spawnTimer)
    G.balloons.push(new Balloon(G.spawnQueue.shift().type,1,0));
}
function updateBalloons(dt){
  for(const b of G.balloons){
    if(!b.alive)continue;
    if(b.traits.regen&&b.hp<b.maxHp)b.hp=Math.min(b.maxHp,b.hp+b.traits.regen*dt);
    let spd=b.spd;
    if(b.slowT>0){b.slowT=Math.max(0,b.slowT-dt);spd*=(1-b.slowF);}
    let rem=spd*dt;
    while(rem>0&&b.pi<PATH_PX.length-1){
      const segR=SEG_LEN[b.pi]*(1-b.prog);
      if(rem>=segR){rem-=segR;b.pi++;b.prog=0;}
      else{b.prog+=rem/SEG_LEN[b.pi];rem=0;}
    }
    const p=bPos(b.pi,b.prog);b.x=p.x;b.y=p.y;b.dist=b.pi+b.prog;
    if(b.pi>=PATH_PX.length-1&&!b.reached){
      b.alive=false;b.reached=true;G.lives--;
      if(G.lives<=0){G.lives=0;G.state='gameover';}
    }
  }
}
function updateTowers(dt){
  for(const t of G.towers){
    t.cd=Math.max(0,t.cd-dt);
    t.updateAnim(dt);
    if(t.cd>0)continue;
    let best=null,bd=-1;
    for(const b of G.balloons){
      if(!b.alive)continue;
      if(b.traits.camo&&!t.canSeeCamo)continue;
      if(Math.hypot(b.x-t.x,b.y-t.y)<=t.rng&&b.dist>bd){bd=b.dist;best=b;}
    }
    if(best){
      t.angle=Math.atan2(best.y-t.y,best.x-t.x);
      t.cd=1/t.fps;
      t.triggerAttack();
      G.projectiles.push(new Proj(t,best));
    }
  }
}
function updateProjectiles(dt){
  for(const p of G.projectiles){
    if(!p.alive)continue;
    const tgt=G.balloons.find(b=>b.id===p.tid);
    if(tgt&&tgt.alive){
      p.tx=tgt.x;p.ty=tgt.y;
      const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy)||1;
      p.vx=dx/d*p.spd;p.vy=dy/d*p.spd;
    }
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    p.angle=Math.atan2(p.vy,p.vx);
    p.fxTimer+=dt;
    if(Math.hypot(p.x-p.tx,p.y-p.ty)<14){
      p.alive=false;
      if(p.aoe>0){
        G.explosions.push(new Expl(p.x,p.y,p.aoe,p.col));
        for(const b of G.balloons){
          if(!b.alive)continue;
          if(Math.hypot(b.x-p.x,b.y-p.y)<=p.aoe)hitBalloon(b,p.dmg,p.slow,p.slowDur,p.atkTypes);
        }
      }else if(tgt&&tgt.alive){
        hitBalloon(tgt,p.dmg,p.slow,p.slowDur,p.atkTypes);
      }
    }
    if(p.x<-60||p.x>CW+60||p.y<-60||p.y>CH+60)p.alive=false;
  }
}
function hitBalloon(b,dmg,slow,slowDur,atkTypes){
  if(b.shield>0){b.shield--;return;}           // 무적 방패 흡수
  const imm=b.traits.immune||[], res=b.traits.resist||[], wk=b.traits.weak||[];
  // 공격 타입별 최고 데미지 배율 산출 (면역 타입 제외)
  let dmgMul=0;
  for(const t of atkTypes){
    if(imm.includes(t))continue;              // 이 타입은 면역
    let m=wk.includes(t)?1.75:res.includes(t)?0.35:1.0;
    dmgMul=Math.max(dmgMul,m);
  }
  if(dmgMul===0)return;                        // 모든 타입 면역 → 피해 없음
  const actual=Math.max(1,Math.round((dmg-(b.traits.armor||0))*dmgMul));
  b.hp-=actual;
  if(slow>0&&!b.traits.slowImmune){b.slowT=slowDur;b.slowF=slow;}
  if(b.hp<=0){
    b.alive=false;G.gold+=b.rew;G.score+=b.rew*10;
    if(b.traits.spawn){
      for(let i=0;i<b.traits.spawn.count;i++)
        G.balloons.push(new Balloon(b.traits.spawn.type,b.pi,b.prog));
    }
  }
}
function updateExplosions(dt){
  for(const e of G.explosions){
    if(!e.alive)continue;
    e.r+=e.maxR*3.5*dt;e.alpha-=2.8*dt;
    if(e.alpha<=0||e.r>=e.maxR)e.alive=false;
  }
}

// ── Draw Helpers ──────────────────────────────────────────────────────────
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

// ── Draw Background ───────────────────────────────────────────────────────
function drawBG(){
  ctx.save();
  ctx.beginPath();ctx.rect(0,HUD_H,GW,GH);ctx.clip();
  if(ok('bg_map')){
    ctx.drawImage(imgs['bg_map'], 0, HUD_H, GW, GH);
  } else {
    const bg=ctx.createLinearGradient(0,HUD_H,0,HUD_H+GH);
    bg.addColorStop(0,'#0e7080');bg.addColorStop(1,'#061e2a');
    ctx.fillStyle=bg;ctx.fillRect(0,HUD_H,GW,GH);
  }
  ctx.restore();
}

// ── Draw Grid + Path ──────────────────────────────────────────────────────
function drawGrid(){
  ctx.save();
  ctx.lineCap='round';ctx.lineJoin='round';

  // ─ 배치 미리보기 조건 ─
  const _hovIn=hovC>=0&&hovC+1<COLS&&hovR>=0&&hovR+1<ROWS&&!E.on&&!G.selTower;
  const _hovOk=_hovIn&&isBuildable2x2(hovC,hovR)&&
    !G.towers.some(t=>hovC+2>t.col&&hovC<t.col+2&&hovR+2>t.row&&hovR<t.row+2);

  // ─ 사거리 원 (항상 표시) ─
  if(_hovIn){
    const def=TD[G.selType],can=G.gold>=def.cost;
    const px=hovC*CELL+CELL,py=HUD_H+hovR*CELL+CELL;
    ctx.save();ctx.beginPath();ctx.arc(px,py,def.bRng,0,Math.PI*2);
    if(_hovOk){
      ctx.fillStyle=can?'rgba(100,255,100,0.07)':'rgba(255,80,80,0.07)';
      ctx.strokeStyle=can?'rgba(100,255,100,0.5)':'rgba(255,80,80,0.45)';
    }else{
      ctx.fillStyle='rgba(255,40,40,0.06)';
      ctx.strokeStyle='rgba(255,40,40,0.55)';
    }
    ctx.fill();ctx.lineWidth=1.5;ctx.setLineDash([6,4]);ctx.stroke();ctx.setLineDash([]);
    ctx.restore();
  }

  // ─ 타워 이미지 + 풋프린트 미리보기 (항상 표시) ─
  if(_hovIn){
    const def=TD[G.selType],can=G.gold>=def.cost;
    const px=hovC*CELL+CELL,py=HUD_H+hovR*CELL+CELL;
    const x=hovC*CELL,y=HUD_H+hovR*CELL;
    const sz=Math.round(92*TSCALE);

    // 풋프린트 하이라이트
    if(_hovOk){
      ctx.fillStyle=can?'rgba(80,255,80,0.22)':'rgba(255,80,80,0.22)';
      ctx.fillRect(x+1,y+1,CELL*2-2,CELL*2-2);
    }else{
      ctx.fillStyle='rgba(255,30,30,0.30)';
      ctx.fillRect(x+1,y+1,CELL*2-2,CELL*2-2);
      ctx.strokeStyle='rgba(255,50,50,0.85)';ctx.lineWidth=1.5;
      ctx.strokeRect(x+1,y+1,CELL*2-2,CELL*2-2);
    }

    // 타워 이미지 미리보기
    ctx.save();
    ctx.globalAlpha=0.72;
    const hovAnim=TOWER_ANIM[G.selType],hovSh=hovAnim?.sh;
    if(hovAnim&&ok(hovSh)){
      ctx.drawImage(imgs[hovSh],0,hovAnim.idle.row*FRAME_SZ,FRAME_SZ,FRAME_SZ,px-sz/2,py-sz/2,sz,sz);
    }else if(ok(def.tw)){ctx.drawImage(imgs[def.tw],px-sz/2,py-sz/2,sz,sz);}
    else{ctx.fillStyle=def.col;rr(px-sz/2,py-sz/2,sz,sz,3);ctx.fill();}
    if(!_hovOk){
      ctx.globalAlpha=0.32;
      ctx.fillStyle='#ff0000';
      ctx.fillRect(px-sz/2,py-sz/2,sz,sz);
    }
    ctx.restore();
  }

  ctx.restore();
}

// ── Draw Towers ───────────────────────────────────────────────────────────
const EMOJ={arrow:'🏹',cannon:'🐚',ice:'❄️',sniper:'🔱',bomb:'🦀'};

// 타워별 포신 설정 (len=길이, w=두께, dy=포신Y오프셋)
const BARREL={
  arrow:  {len:13,w:2, dy:-2, col:'#556688'},
  cannon: {len:11,w:5, dy:-3, col:'#445566'},
  ice:    {len:10,w:4, dy:-2, col:'#558899'},
  sniper: {len:18,w:2, dy:-3, col:'#554422'},
  bomb:   {len:12,w:5, dy:-2, col:'#664433'},
};
function drawTowers(){
  for(const t of G.towers){
    const sel=t===G.selTower, hov=(hovC>=t.col&&hovC<t.col+2&&hovR>=t.row&&hovR<t.row+2);
    // Range ring
    if(sel){
      ctx.save();ctx.beginPath();ctx.arc(t.x,t.y,t.rng,0,Math.PI*2);
      ctx.strokeStyle='rgba(255,240,80,0.45)';ctx.lineWidth=1.5;ctx.stroke();
      ctx.fillStyle='rgba(255,240,80,0.04)';ctx.fill();ctx.restore();
    } else if(hov){
      ctx.save();ctx.beginPath();ctx.arc(t.x,t.y,t.rng,0,Math.PI*2);
      ctx.strokeStyle='rgba(200,200,200,0.22)';ctx.lineWidth=1;ctx.stroke();ctx.restore();
    }

    // 그림자
    const TS2=TSCALE*2;
    ctx.save();ctx.translate(t.x+2*TS2,t.y+20*TS2);ctx.scale(1,0.32);
    ctx.beginPath();ctx.ellipse(0,0,21*TS2,19*TS2,0,0,Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,0.22)';ctx.fill();ctx.restore();

    // 건물 본체 (스프라이트 시트 우선, 없으면 정적 이미지, 없으면 도형)
    const sz=Math.round(92*TSCALE);
    const anim=TOWER_ANIM[t.type];
    const shKey=anim?.sh;
    if(anim&&ok(shKey)){
      const sa=anim[t.animState]||anim.idle;
      const fr=Math.min(Math.floor(t.animF),sa.frames-1);
      ctx.drawImage(imgs[shKey],fr*FRAME_SZ,sa.row*FRAME_SZ,FRAME_SZ,FRAME_SZ,t.x-sz/2,t.y-sz/2,sz,sz);
    } else if(ok(t.d.tw)){
      const a=TOWER_ANIM[t.type];
      ctx.save();
      ctx.translate(t.x,t.y);
      // 윤곽선 글로우 (선택 시 금색, 평상시 흰색)
      ctx.shadowBlur=sel?16:8;
      ctx.shadowColor=sel?'#ff6600':'rgba(255,140,50,0.85)';
      if(t.animState==='attack'&&a){
        // 공격: 스쿼시-스트레치 + 발사 플래시
        const dur=a.attack.frames/a.attack.fps;
        const p=Math.min(t.attackT/dur,1);
        const bounce=Math.sin(p*Math.PI);
        ctx.translate(0,-bounce*3);
        ctx.scale(1-bounce*0.12,1+bounce*0.18);
        ctx.drawImage(imgs[t.d.tw],-sz/2,-sz/2,sz,sz);
        ctx.shadowBlur=0;
        const fl=Math.max(0,(0.4-p)*1.5);
        if(fl>0){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=fl;ctx.drawImage(imgs[t.d.tw],-sz/2,-sz/2,sz,sz);}
      }else{
        // idle: 타워마다 다른 위상으로 위아래 부유
        const freq=a?a.idle.fps/a.idle.frames:1.5;
        const phase=(t.col*3+t.row*7)*0.4;
        const wave=Math.sin(Date.now()*0.001*freq*Math.PI*2+phase);
        ctx.translate(0,wave*2);
        ctx.scale(1+wave*0.015,1-wave*0.015);
        ctx.drawImage(imgs[t.d.tw],-sz/2,-sz/2,sz,sz);
      }
      ctx.restore();
    } else {
      ctx.save();
      ctx.fillStyle=t.d.col;rr(t.x-sz/2,t.y-sz/2,sz,sz,3);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.75)';ctx.font=`${Math.round(10*TS2)}px Arial`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(EMOJ[t.type]||'🗼',t.x,t.y);
      ctx.restore();
    }

    // 업그레이드 등급 점
    const dotR=Math.max(1,4*TS2), dotDist=21*TS2;
    const dAngles=[-Math.PI/2+Math.PI/6,-Math.PI/2+Math.PI/2,-Math.PI/2-Math.PI/6];
    for(let pi=0;pi<3;pi++){
      const tier=t.upgrades[pi];
      if(tier===0)continue;
      const a=dAngles[pi];
      const dx=Math.cos(a)*dotDist, dy=Math.sin(a)*dotDist;
      ctx.save();
      ctx.beginPath();ctx.arc(t.x+dx,t.y+dy,dotR+0.5,0,Math.PI*2);
      ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fill();
      ctx.beginPath();ctx.arc(t.x+dx,t.y+dy,dotR,0,Math.PI*2);
      ctx.fillStyle=t.tree[pi].col;ctx.fill();
      ctx.restore();
    }

    // 선택 테두리 (2×2 풋프린트)
    if(sel){
      ctx.save();
      rr(t.col*CELL,HUD_H+t.row*CELL,CELL*2,CELL*2,3);
      ctx.strokeStyle='#ffee00';ctx.lineWidth=2;ctx.stroke();
      ctx.restore();
    }
  }
}

// ── Draw Monsters ─────────────────────────────────────────────────────────
function drawBalloons(){
  const alive=G.balloons.filter(b=>b.alive).sort((a,b)=>b.dist-a.dist);
  for(const b of alive){
    ctx.save();ctx.translate(b.x,b.y);
    if(b.traits.camo)ctx.globalAlpha=0.55; // 은신 — 반투명
    const r=b.rad;
    // Shadow
    ctx.save();ctx.scale(1,0.4);ctx.beginPath();ctx.ellipse(3,r*2.8,r*0.85,r*0.32,0,0,Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,0.22)';ctx.fill();ctx.restore();
    // Portrait circle
    ctx.save();ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fillStyle=b.bgCol;ctx.fill();ctx.clip();
    if(ok(b.imgKey))ctx.drawImage(imgs[b.imgKey],-r,-r,r*2,r*2);
    ctx.restore();
    // Border
    ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.strokeStyle=b.border;ctx.lineWidth=2.5;ctx.stroke();
    // Boss glow
    if(b.isBoss){
      const pulse=0.35+0.2*Math.sin(Date.now()*0.006);
      ctx.beginPath();ctx.arc(0,0,r+7,0,Math.PI*2);ctx.strokeStyle=`rgba(255,160,0,${pulse})`;ctx.lineWidth=3.5;ctx.stroke();
    }
    // String + knot
    ctx.beginPath();ctx.arc(0,r,2.8,0,Math.PI*2);ctx.fillStyle=b.border;ctx.fill();
    ctx.beginPath();ctx.moveTo(0,r);ctx.quadraticCurveTo(5,r+10,0,r+18);ctx.strokeStyle=b.border;ctx.lineWidth=1.5;ctx.stroke();
    // HP bar
    if(b.hp<b.maxHp){
      const bw=r*2.4;
      ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(-bw/2-1,-r-11,bw+2,8);
      ctx.fillStyle='#cc2222';ctx.fillRect(-bw/2,-r-10,bw,6);
      ctx.fillStyle='#22cc22';ctx.fillRect(-bw/2,-r-10,bw*(b.hp/b.maxHp),6);
    }
    // Slow frost
    if(b.slowT>0){ctx.beginPath();ctx.arc(0,0,r+5,0,Math.PI*2);ctx.strokeStyle='rgba(100,220,255,0.72)';ctx.lineWidth=2;ctx.stroke();}
    // Camo marker
    if(b.traits.camo){
      ctx.globalAlpha=0.9;
      ctx.fillStyle='rgba(180,255,180,0.85)';ctx.font='bold 9px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('🥷',-r+2,-r+2);
    }
    // Shield ring
    if(b.shield>0){
      const pulse=0.5+0.35*Math.sin(Date.now()*0.009);
      ctx.beginPath();ctx.arc(0,0,r+9,0,Math.PI*2);ctx.strokeStyle=`rgba(255,220,60,${pulse})`;ctx.lineWidth=3;ctx.stroke();
      ctx.fillStyle='rgba(255,220,60,0.9)';ctx.font='bold 8px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('🛡'+b.shield,0,-r-14);
    }
    ctx.restore();
  }
}

function drawProjShape(p){
  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.rotate(p.angle);
  const r=p.rad;
  switch(p.towerType){
    case 'arrow':{
      // 물 화살
      ctx.shadowColor='#44ccff';ctx.shadowBlur=10;
      ctx.strokeStyle='#44ccff';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(-r*3,0);ctx.lineTo(r*1.5,0);ctx.stroke();
      ctx.fillStyle='#aaeeff';
      ctx.beginPath();ctx.moveTo(r*1.5,-r*1.2);ctx.lineTo(r*3.5,0);ctx.lineTo(r*1.5,r*1.2);ctx.closePath();ctx.fill();
      break;
    }
    case 'cannon':{
      // 진주 구슬
      const g=ctx.createRadialGradient(-r*0.5,-r*0.5,0.5,0,0,r*2.2);
      g.addColorStop(0,'#fff');g.addColorStop(0.35,'#dd99ff');g.addColorStop(1,'#550077');
      ctx.shadowColor='#bb55ff';ctx.shadowBlur=14;
      ctx.beginPath();ctx.arc(0,0,r*2.2,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
      break;
    }
    case 'ice':{
      // 빙결 결정
      ctx.shadowColor='#88ddff';ctx.shadowBlur=12;
      ctx.strokeStyle='#aaeeff';ctx.lineWidth=1.5;
      for(let i=0;i<6;i++){const a=i*Math.PI/3;
        ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*r*2.8,Math.sin(a)*r*2.8);ctx.stroke();}
      ctx.fillStyle='#ddf6ff';ctx.globalAlpha=0.9;
      ctx.beginPath();ctx.arc(0,0,r*0.9,0,Math.PI*2);ctx.fill();
      break;
    }
    case 'sniper':{
      // 작살
      ctx.shadowColor='#44ff99';ctx.shadowBlur=10;
      ctx.strokeStyle='#664422';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(-r*4.5,0);ctx.lineTo(r*2,0);ctx.stroke();
      ctx.strokeStyle='#88ffcc';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(-r*4.5,0);ctx.lineTo(r*2,0);ctx.stroke();
      ctx.fillStyle='#aaffdd';
      ctx.beginPath();ctx.moveTo(r*2,-r*1.1);ctx.lineTo(r*4,0);ctx.lineTo(r*2,r*1.1);ctx.closePath();ctx.fill();
      break;
    }
    case 'bomb':{
      // 폭뢰 (깜빡이는 도화선)
      ctx.shadowColor='#ff6600';ctx.shadowBlur=16;
      const g=ctx.createRadialGradient(-r*0.4,-r*0.4,0.5,0,0,r*2.2);
      g.addColorStop(0,'#ffcc55');g.addColorStop(0.5,'#cc3300');g.addColorStop(1,'#330800');
      ctx.beginPath();ctx.arc(0,0,r*2.2,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
      const spark=(Math.sin(p.fxTimer*25)*0.5+0.5);
      ctx.strokeStyle=`rgba(255,220,50,${0.5+spark*0.5})`;ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(0,-r*2.2);ctx.quadraticCurveTo(r*1.8,-r*3.8,r*0.8,-r*4.8);ctx.stroke();
      ctx.fillStyle=`rgba(255,255,150,${0.7+spark*0.3})`;ctx.shadowBlur=8;ctx.shadowColor='#fff';
      ctx.beginPath();ctx.arc(r*0.8,-r*4.8,r*0.65,0,Math.PI*2);ctx.fill();
      break;
    }
    default:{
      ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);
      ctx.fillStyle=p.col;ctx.shadowColor=p.col;ctx.shadowBlur=10;ctx.fill();
    }
  }
  ctx.restore();
}

function drawProjectiles(){
  for(const p of G.projectiles){
    if(!p.alive)continue;
    const anim=TOWER_ANIM[p.towerType];
    const pjKey=anim?.pj;
    const pjImg=pjKey&&imgs[pjKey];
    if(pjImg&&ok(pjKey)){
      const fx=anim.fx;
      const fr=Math.floor(p.fxTimer*fx.fps)%fx.frames;
      const sz=Math.max(p.rad*5,24);
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);
      ctx.drawImage(pjImg,fr*FRAME_SZ,0,FRAME_SZ,FRAME_SZ,-sz/2,-sz/2,sz,sz);
      ctx.restore();
    }else{
      drawProjShape(p);
    }
  }
}
function drawExplosions(){
  for(const e of G.explosions){
    if(!e.alive)continue;
    ctx.save();ctx.globalAlpha=e.alpha;
    ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.strokeStyle=e.col;ctx.lineWidth=3;ctx.stroke();
    ctx.beginPath();ctx.arc(e.x,e.y,e.r*0.55,0,Math.PI*2);ctx.fillStyle=e.col;ctx.globalAlpha=e.alpha*0.25;ctx.fill();
    ctx.restore();
  }
}

// ── Draw Wave Progress (game area top-left) ───────────────────────────────
function drawWaveProgress(){
  if(G.state==='gameover'||G.state==='victory')return;
  const wx=6, wy=HUD_H+6, ww=200, wh=50;

  // panel bg
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.strokeStyle='rgba(200,169,110,0.22)';ctx.lineWidth=1;
  rr(wx,wy,ww,wh,7);ctx.fill();ctx.stroke();

  if(G.state==='rest'&&!isFinite(G.restTimer)){
    ctx.fillStyle='#88aacc';ctx.font='11px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(`${G.wave+1}웨이브 — 시작 버튼을 눌러주세요`,wx+ww/2,wy+wh/2);
    ctx.restore();return;
  }
  if(G.state==='rest'){
    ctx.fillStyle='#aabbaa';ctx.font='11px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(`${G.wave+1}웨이브 준비 중… ${Math.ceil(G.restTimer)}초`,wx+ww/2,wy+wh/2);
    ctx.restore();return;
  }

  // Wave label
  ctx.fillStyle='#e8c87a';ctx.font='bold 14px Arial';ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText(`WAVE`,wx+8,wy+7);
  ctx.fillStyle='#ffffff';ctx.font='bold 20px Arial';
  ctx.fillText(`${G.wave}`,wx+54,wy+4);
  ctx.fillStyle='#888877';ctx.font='11px Arial';ctx.textBaseline='middle';
  ctx.fillText(`/ ${G.maxWaves}`,wx+54+ctx.measureText(`${G.wave}`).width+3,wy+14);

  if(G.state==='rest'){
    // rest countdown bar
    ctx.fillStyle='#88ccff';ctx.font='10px Arial';ctx.textAlign='left';ctx.textBaseline='top';
    ctx.fillText(`⏳ 다음 웨이브 ${G.restTimer.toFixed(1)}s`,wx+8,wy+30);
    const bx=wx+8,by=wy+42,bw=ww-16,bh=4;
    ctx.fillStyle='rgba(255,255,255,0.08)';rr(bx,by,bw,bh,2);ctx.fill();
    ctx.fillStyle='#44aaff';rr(bx,by,bw*(1-G.restTimer/1.5),bh,2);ctx.fill();
    ctx.restore();return;
  }

  // wave state — enemy progress bar
  const alive=G.balloons.filter(b=>b.alive).length;
  const remaining=G.spawnQueue.length+alive;
  const killed=Math.max(0,G.waveTotal-remaining);
  const prog=G.waveTotal>0?killed/G.waveTotal:0;

  ctx.fillStyle='#aaaaaa';ctx.font='10px Arial';ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText(`처치 ${killed}/${G.waveTotal}`,wx+8,wy+30);
  ctx.fillStyle='#ff9988';ctx.textAlign='right';
  ctx.fillText(`남은 적 ${remaining}`,wx+ww-8,wy+30);

  const bx=wx+8,by=wy+42,bw=ww-16,bh=5;
  ctx.fillStyle='rgba(255,255,255,0.08)';rr(bx,by,bw,bh,2);ctx.fill();
  if(prog>0){
    const gr=ctx.createLinearGradient(bx,0,bx+bw,0);
    gr.addColorStop(0,'#226622');gr.addColorStop(prog,'#44ee44');
    ctx.fillStyle=gr;rr(bx,by,bw*prog,bh,2);ctx.fill();
  }
  ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=1;rr(bx,by,bw,bh,2);ctx.stroke();

  ctx.restore();
}

// ── Draw HUD ──────────────────────────────────────────────────────────────
function drawHUD(){
  const gr=ctx.createLinearGradient(0,0,0,HUD_H);
  gr.addColorStop(0,'#1e1530');gr.addColorStop(1,'#130d22');
  ctx.fillStyle=gr;ctx.fillRect(0,0,CW,HUD_H);
  ctx.strokeStyle='#c8a96e';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,HUD_H);ctx.lineTo(CW,HUD_H);ctx.stroke();
  const my=HUD_H/2; ctx.textBaseline='middle';
  ctx.fillStyle='#ff6666';ctx.font='bold 15px Arial';ctx.textAlign='left';ctx.fillText(`❤️ ${G.lives}`,14,my);
  ctx.fillStyle='#ffd700';ctx.fillText(`💰 ${G.gold}`,105,my);
  ctx.fillStyle='#bbbbff';ctx.fillText(`⭐ ${G.score.toLocaleString()}`,220,my);
  ctx.fillStyle='#c8a96e';ctx.textAlign='right';ctx.fillText(`웨이브 ${G.wave} / ${G.maxWaves}`,GW-8,my);

  // 웨이브 버튼
  const cx=GW/2;
  {
    const bx=cx-70,by=8,bw=140,bh=39;
    if(G.state==='rest'){
      const nextW=G.wave+1;
      const waiting=!isFinite(G.restTimer);
      ctx.fillStyle=waiting?'#1a2535':'#1a2a1a';
      ctx.strokeStyle=waiting?'#4488cc':'#3a7a3a';ctx.lineWidth=1.5;
      rr(bx,by,bw,bh,6);ctx.fill();ctx.stroke();
      ctx.fillStyle=waiting?'#88ccff':'#88ee88';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
      if(waiting){
        ctx.fillText(`▶ ${nextW}웨이브 시작`,cx,by+bh/2);
      } else {
        const sec=Math.ceil(G.restTimer);
        ctx.fillText(`▶▶ ${nextW}웨이브 즉시 (${sec}초 후 자동)`,cx,by+bh/2);
      }
    } else if(G.state==='wave'){
      ctx.globalAlpha=0.18;
      ctx.fillStyle='#111118';ctx.strokeStyle='#333344';ctx.lineWidth=1;
      rr(bx,by,bw,bh,6);ctx.fill();ctx.stroke();
      ctx.fillStyle='#556655';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(`⚔ ${G.wave}웨이브 진행 중`,cx,by+bh/2);
      ctx.globalAlpha=1;
    }
  }
  // FF button
  const ffx=cx+84,ffy=8,ffw=72,ffh=39;
  ctx.fillStyle=G.ff?'#2a2a08':'#14141e';ctx.strokeStyle=G.ff?'#cccc00':'#555577';ctx.lineWidth=1;
  rr(ffx,ffy,ffw,ffh,6);ctx.fill();ctx.stroke();
  ctx.fillStyle=G.ff?'#ffff44':'#9999bb';ctx.font='bold 13px Arial';ctx.textAlign='center';
  ctx.fillText(G.ff?'⏩ 2×':'▶ 1×',ffx+ffw/2,ffy+ffh/2);
  // Info button
  const ifx=ffx+ffw+6,ify=8,ifw=40,ifh=39;
  ctx.fillStyle=G.showInfo?'#0d1e2e':'#14141e';ctx.strokeStyle=G.showInfo?'#44aaff':'#445566';ctx.lineWidth=1;
  rr(ifx,ify,ifw,ifh,6);ctx.fill();ctx.stroke();
  ctx.fillStyle=G.showInfo?'#88ddff':'#7799aa';ctx.font='bold 15px Arial';ctx.textAlign='center';
  ctx.fillText('?',ifx+ifw/2,ify+ifh/2);
  // Editor button
  const edx=ifx+ifw+6,edy=8,edw=58,edh=39;
  ctx.fillStyle=E.on?'#1e1800':'#14141e';ctx.strokeStyle=E.on?'#ccaa00':'#665500';ctx.lineWidth=1;
  rr(edx,edy,edw,edh,6);ctx.fill();ctx.stroke();
  ctx.fillStyle=E.on?'#ffcc44':'#998833';ctx.font='bold 12px Arial';ctx.textAlign='center';
  ctx.fillText('✏ 편집',edx+edw/2,edy+edh/2);
}

// ── Panel Layout Constants ────────────────────────────────────────────────
const PX  = GW+6;          // panel content left
const PW  = SIDE_W-12;     // panel content width (238)
// Upgrade UI layout (when tower selected)
const UI_HDR_Y  = HUD_H+6;    // tower name row
const UI_STAT_Y = HUD_H+44;   // stats row
const UI_PATH_Y = HUD_H+82;   // first path start
const UI_PATH_H = 76;          // height per path: 22(header)+46(btns)+8(gap)
const UI_BTN_W  = 43;
const UI_BTN_H  = 46;
const UI_BTN_GAP= 3;
const UI_BTN_X0 = PX+3;


// ── Draw Side Panel ───────────────────────────────────────────────────────
function drawPanel(){
  // Panel BG
  const gr=ctx.createLinearGradient(GW,0,CW,0);
  gr.addColorStop(0,'#0d0d1e');gr.addColorStop(1,'#18122a');
  ctx.fillStyle=gr;ctx.fillRect(GW,0,SIDE_W,CH);
  ctx.strokeStyle='#c8a96e';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(GW,0);ctx.lineTo(GW,CH);ctx.stroke();

  if(G.selTower)       drawUpgradeUI();
  else if(G.previewType) drawPreviewUpgradeUI();
  else                 drawTowerSelect();
}

function drawTowerSelect(){
  ctx.fillStyle='#c8a96e';ctx.font='bold 13px Arial';ctx.textAlign='center';
  ctx.fillText('[ 타워 건설 ]',GW+SIDE_W/2,HUD_H+18);

  const TBH=78,TLY=HUD_H+32;
  for(let i=0;i<TOWER_ORDER.length;i++){
    const type=TOWER_ORDER[i],d=TD[type];
    const y=TLY+i*(TBH+4),sel=G.selType===type,afford=G.gold>=d.cost;
    ctx.fillStyle=sel?'rgba(200,169,110,0.12)':'rgba(255,255,255,0.03)';
    ctx.strokeStyle=sel?'#c8a96e':(afford?'rgba(180,180,180,0.2)':'rgba(80,80,80,0.2)');
    ctx.lineWidth=sel?2:1;rr(PX,y,PW,TBH,6);ctx.fill();ctx.stroke();

    const isz=64,ix=PX+4,iy=y+(TBH-isz)/2;
    if(ok(d.ic)){ctx.drawImage(imgs[d.ic],ix,iy,isz,isz);}
    else{
      ctx.fillStyle=d.col;rr(ix,iy,isz,isz,6);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='26px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(EMOJ[type]||'🗼',ix+isz/2,iy+isz/2);
    }
    ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillStyle=afford?'#ffffff':'#777777';ctx.font='bold 13px Arial';ctx.fillText(d.name,PX+72,y+16);
    ctx.fillStyle=afford?'#ffd700':'#886600';ctx.font='12px Arial';ctx.fillText(`💰 ${d.cost}`,PX+72,y+34);
    ctx.fillStyle='#999999';ctx.font='10px Arial';ctx.fillText(d.desc,PX+72,y+50);

    // Effective / immune monster mini-dots
    const eff=TOWER_COUNTERS[type].effective, imm2=TOWER_COUNTERS[type].immune;
    let dotX=PX+72;
    if(eff.length>0){
      ctx.fillStyle='#55ee77';ctx.font='8px Arial';ctx.textAlign='left';ctx.textBaseline='middle';
      ctx.fillText('↑',dotX,y+64);dotX+=11;
      for(let ei=0;ei<Math.min(eff.length,6);ei++){
        const md_=MD[eff[ei]];if(!md_)continue;
        ctx.save();ctx.beginPath();ctx.arc(dotX+5,y+64,5,0,Math.PI*2);
        ctx.fillStyle=md_.bgCol;ctx.fill();ctx.clip();
        if(ok(md_.imgKey))ctx.drawImage(imgs[md_.imgKey],dotX,y+59,10,10);
        ctx.restore();
        dotX+=12;
      }
    }
    dotX+=4;
    if(imm2.length>0){
      ctx.fillStyle='#ff5555';ctx.font='8px Arial';ctx.textAlign='left';ctx.textBaseline='middle';
      ctx.fillText('✕',dotX,y+64);dotX+=10;
      for(let ii=0;ii<Math.min(imm2.length,4);ii++){
        const md_=MD[imm2[ii]];if(!md_)continue;
        ctx.save();ctx.beginPath();ctx.arc(dotX+5,y+64,5,0,Math.PI*2);
        ctx.fillStyle=md_.bgCol;ctx.fill();ctx.clip();
        if(ok(md_.imgKey))ctx.drawImage(imgs[md_.imgKey],dotX,y+59,10,10);
        ctx.restore();
        ctx.fillStyle='rgba(200,0,0,0.5)';ctx.beginPath();ctx.arc(dotX+5,y+64,5,0,Math.PI*2);ctx.fill();
        dotX+=12;
      }
    }
  }

  // Monster mini legend
  const legY=HUD_H+32+5*(78+4)+10;
  ctx.fillStyle='rgba(200,169,110,0.55)';ctx.font='11px Arial';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText('[ 몬스터 ]',PX,legY+8);
  const perRow=4;
  for(let i=0;i<MONSTER_ORDER.length;i++){
    const type=MONSTER_ORDER[i],d=MD[type];
    if(!d)continue;
    const row=Math.floor(i/perRow),col=i%perRow;
    const x=PX+col*57+10,y2=legY+24+row*34;
    if(y2>CH-8)break;
    ctx.save();ctx.beginPath();ctx.arc(x+10,y2,11,0,Math.PI*2);ctx.fillStyle=d.bgCol;ctx.fill();ctx.clip();
    if(ok(d.imgKey))ctx.drawImage(imgs[d.imgKey],x-1,y2-11,22,22);
    ctx.restore();
    ctx.beginPath();ctx.arc(x+10,y2,11,0,Math.PI*2);ctx.strokeStyle=d.border;ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle='#aaaaaa';ctx.font='9px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(d.name,x+10,y2+17);
  }
}

function drawUpgradeUI(){
  const t=G.selTower, s=t.stats;

  // Header: icon + name + deselect button
  const isz=34;
  if(ok(t.d.ic))ctx.drawImage(imgs[t.d.ic],PX,UI_HDR_Y,isz,isz);
  ctx.fillStyle='#c8a96e';ctx.font='bold 14px Arial';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText(t.d.name,PX+40,UI_HDR_Y+17);

  // Deselect button (✕)
  const dx=PX+PW-38,dy=UI_HDR_Y;
  ctx.fillStyle='#2a0a0a';ctx.strokeStyle='#884444';ctx.lineWidth=1;
  rr(dx,dy,36,32,5);ctx.fill();ctx.stroke();
  ctx.fillStyle='#ffaaaa';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.fillText('✕',dx+18,dy+16);

  // Stats
  const TYPE_ICON={slash:'⚔',pierce:'🏹',explosive:'💥',siege:'🪨',magic:'❄️',holy:'✨'};
  ctx.fillStyle='#cccccc';ctx.font='12px Arial';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText(`⚔${s.dmg}  📏${s.rng}  ⚡${s.fps.toFixed(1)}/s`,PX,UI_STAT_Y+8);
  const l2=[];
  if(s.aoe>0)l2.push(`💥범위${s.aoe}`);
  if(s.slow>0)l2.push(`❄${Math.round(s.slow*100)}%`);
  ctx.fillStyle='#aaaaaa';ctx.font='11px Arial';ctx.fillText(l2.join('  '),PX,UI_STAT_Y+22);
  // Attack types + camo
  const typeStr=s.atkTypes.map(t=>TYPE_ICON[t]||t).join('');
  const camoStr=s.canSeeCamo?'  👁카모감지':'';
  ctx.fillStyle='#88aacc';ctx.font='10px Arial';ctx.fillText(`속성: ${typeStr}${camoStr}`,PX,UI_STAT_Y+36);

  // 3 upgrade paths
  const tree=t.tree;
  for(let pi=0;pi<3;pi++){
    const path=tree[pi];
    const yBase=UI_PATH_Y+pi*UI_PATH_H;

    // Path header bar
    ctx.fillStyle=path.col;rr(PX,yBase,PW,20,4);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 11px Arial';ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillText(path.name,PX+7,yBase+10);
    ctx.textAlign='right';ctx.fillText(`${t.upgrades[pi]}/5`,PX+PW-6,yBase+10);

    // 5 tier buttons
    const btnY=yBase+22;
    for(let ti=0;ti<5;ti++){
      const bx=UI_BTN_X0+ti*(UI_BTN_W+UI_BTN_GAP);
      const tier=path.t[ti];
      const tierName=tier[0], cost=tier[1];
      const purchased=t.upgrades[pi]>ti;
      const isNext=t.upgrades[pi]===ti;
      const blocked=isNext&&!t.canUpgrade(pi);
      const canAfford=G.gold>=cost;

      // Button BG
      if(purchased)        ctx.fillStyle=path.col;
      else if(blocked)     ctx.fillStyle='rgba(20,20,20,0.9)';
      else if(isNext&&canAfford) ctx.fillStyle=path.bg||'rgba(30,30,30,0.9)';
      else if(isNext)      ctx.fillStyle='rgba(40,5,5,0.9)';
      else                 ctx.fillStyle='rgba(15,15,15,0.7)';

      // Border
      if(purchased)             ctx.strokeStyle='rgba(255,255,255,0.7)';
      else if(blocked)          ctx.strokeStyle='rgba(60,60,60,0.5)';
      else if(isNext&&canAfford)ctx.strokeStyle=path.col;
      else if(isNext)           ctx.strokeStyle='#882222';
      else                      ctx.strokeStyle='rgba(60,60,60,0.4)';
      ctx.lineWidth=purchased?2:1;
      rr(bx,btnY,UI_BTN_W,UI_BTN_H,4);ctx.fill();ctx.stroke();

      // Top: tier number circle
      ctx.textAlign='center';ctx.textBaseline='top';
      if(purchased){
        ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold 13px Arial';
        ctx.fillText('✓',bx+UI_BTN_W/2,btnY+3);
      } else {
        ctx.fillStyle=blocked?'#444':(isNext?(canAfford?path.col:'#884444'):'#444');
        ctx.font='bold 11px Arial';ctx.fillText(`T${ti+1}`,bx+UI_BTN_W/2,btnY+3);
      }

      // Middle: short name
      ctx.fillStyle=purchased?'rgba(255,255,255,0.85)':(isNext&&!blocked?'#cccccc':'#555');
      ctx.font='8.5px Arial';
      // Wrap name to 2 lines if needed
      const nm=tierName.length>5?tierName.slice(0,4)+'…':tierName;
      ctx.fillText(nm,bx+UI_BTN_W/2,btnY+19);

      // Bottom: cost or lock
      ctx.textBaseline='bottom';
      if(purchased){
        // nothing
      } else if(blocked){
        ctx.fillStyle='#555';ctx.font='11px Arial';ctx.fillText('🔒',bx+UI_BTN_W/2,btnY+UI_BTN_H-1);
      } else {
        ctx.fillStyle=(isNext&&canAfford)?'#ffd700':(isNext?'#ff5555':'#444');
        ctx.font=`bold ${cost>=1000?8:9}px Arial`;
        ctx.fillText(`${cost}g`,bx+UI_BTN_W/2,btnY+UI_BTN_H-1);
      }
    }
  }

  drawMatchupSection(t.type, UI_PATH_Y+3*UI_PATH_H+6);
}

// ── Matchup section shared draw ──────────────────────────────────────────
function drawMatchupSection(type, startY){
  const tc=TOWER_COUNTERS[type];
  ctx.strokeStyle='rgba(200,169,110,0.25)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(PX,startY);ctx.lineTo(PX+PW,startY);ctx.stroke();
  ctx.fillStyle='rgba(200,169,110,0.6)';ctx.font='bold 9px Arial';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText('[ 상성 ]',PX,startY+8);
  let moy=startY+19;
  function mRow(label,col,list,dimmed){
    if(!list.length)return;
    ctx.fillStyle=col;ctx.font='bold 8px Arial';ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillText(label,PX,moy+6);
    let dx=PX+50;
    for(const mkey of list){
      const md_=MD[mkey];if(!md_)continue;
      ctx.save();ctx.beginPath();ctx.arc(dx+7,moy+6,7,0,Math.PI*2);
      ctx.fillStyle=md_.bgCol;ctx.fill();ctx.clip();
      if(ok(md_.imgKey))ctx.drawImage(imgs[md_.imgKey],dx,moy-1,14,14);
      ctx.restore();
      if(dimmed){
        ctx.fillStyle='rgba(180,0,0,0.48)';
        ctx.beginPath();ctx.arc(dx+7,moy+6,7,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#ff5555';ctx.lineWidth=0.8;
        ctx.beginPath();ctx.arc(dx+7,moy+6,7,0,Math.PI*2);ctx.stroke();
      }
      dx+=16;
    }
    moy+=17;
  }
  mRow('★ 효과적','#55ee77',tc.effective,false);
  mRow('△ 저항','#ffbb44',tc.resist,false);
  mRow('✕ 면역','#ff5555',tc.immune,true);
  if(!tc.effective.length&&!tc.resist.length&&!tc.immune.length){
    ctx.fillStyle='#666677';ctx.font='9px Arial';ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillText('전 속성 정상 피해',PX,moy+6);
  }
}

      const bx=UI_BTN_X0+ti*(UI_BTN_W+UI_BTN_GAP);
      ctx.fillStyle='rgba(15,15,25,0.85)';
      ctx.strokeStyle=path.col+'88';ctx.lineWidth=1;
      rr(bx,btnY,UI_BTN_W,UI_BTN_H,4);ctx.fill();ctx.stroke();
      ctx.fillStyle=path.col;ctx.font='bold 8px Arial';ctx.textAlign='center';ctx.textBaseline='top';
      ctx.fillText(`T${ti+1}`,bx+UI_BTN_W/2,btnY+3);
      const nm=tierName.length>5?tierName.slice(0,4)+'…':tierName;
      ctx.fillStyle='#aaaaaa';ctx.font='8px Arial';
      ctx.fillText(nm,bx+UI_BTN_W/2,btnY+17);
      ctx.fillStyle='#ffd700';ctx.font=`bold ${cost>=1000?7:8}px Arial`;ctx.textBaseline='bottom';
      ctx.fillText(`${cost}g`,bx+UI_BTN_W/2,btnY+UI_BTN_H-2);

  // Matchup
  drawMatchupSection(type, UI_PATH_Y+3*UI_PATH_H+6);

// ── Type labels (shared) ──────────────────────────────────────────────────
const TYPE_LABEL={slash:'베기⚔',pierce:'관통🏹',explosive:'폭발💥',siege:'둔기🪨',magic:'마법❄️',holy:'성✨'};

// ── Monster Tooltip State ─────────────────────────────────────────────────
let hovMonster=null;
let hovLiveBalloon=null;
let hovUpgradeBtn=null; // {pi,ti} — 업그레이드 버튼 호버
let _touchClearTimer=null;

function monsterLegendPos(i){
  const legY=HUD_H+32+5*(78+4)+10, perRow=4;
  const row=Math.floor(i/perRow), col=i%perRow;
  return {cx:PX+col*57+20, cy:legY+24+row*34};
}
function getMonsterAt(mx,my){
  if(G.selTower)return null;
  for(let i=0;i<MONSTER_ORDER.length;i++){
    const {cx,cy}=monsterLegendPos(i);
    if(cy>CH-8)break;
    if(Math.hypot(mx-cx,my-cy)<=18)return MONSTER_ORDER[i];
  }
  return null;
}
function getLiveBalloonAt(mx,my){
  if(!G||!G.balloons)return null;
  // 게임 필드 영역(HUD 아래, 사이드패널 왼쪽)에서만 감지
  if(mx>=GW||my<HUD_H)return null;
  for(const b of G.balloons){
    if(!b.alive)continue;
    if(Math.hypot(mx-b.x,my-b.y)<=b.rad+6)return b;
  }
  return null;
}

// 텍스트 자동 줄바꿈 헬퍼
function wrapText(text,maxW,font){
  ctx.save();ctx.font=font;
  const words=text.split(' ');const lines=[];let line='';
  for(const w of words){
    const test=line?line+' '+w:w;
    if(ctx.measureText(test).width>maxW&&line){lines.push(line);line=w;}
    else line=test;
  }
  if(line)lines.push(line);
  ctx.restore();return lines;
}

// 공용 몬스터 툴팁 렌더러 (TW=320, 동적 높이, 자동 줄바꿈)
function drawMonsterTooltipAt(d,key,anchorX,anchorY,liveData){
  const tr=d.traits||{};
  const imm=tr.immune||[],res=tr.resist||[],wk=tr.weak||[];
  const PAD=14,TW=320,PR=26,LH=18;
  const FONT_DESC='11px Arial',FONT_TRAIT='11px Arial';

  const traits=[];
  if(imm.length) traits.push({c:'#ff6666',t:`✗ 면역: ${imm.map(k=>TYPE_LABEL[k]||k).join('  ')}`});
  if(res.length) traits.push({c:'#ffaa55',t:`△ 저항(35%): ${res.map(k=>TYPE_LABEL[k]||k).join('  ')}`});
  if(wk.length)  traits.push({c:'#55ddff',t:`★ 취약(175%): ${wk.map(k=>TYPE_LABEL[k]||k).join('  ')}`});
  if(tr.camo)       traits.push({c:'#aaffaa',t:'🥷 은신 — 카모 감지 타워 필요'});
  if(tr.slowImmune) traits.push({c:'#88eeff',t:'❄ 둔화/빙결 면역'});
  if(tr.armor)      traits.push({c:'#ddccaa',t:`🛡 방어력 ${tr.armor} (모든 피해 감소)`});
  if(tr.shield){const sh=liveData?liveData.shield:tr.shield;traits.push({c:'#ffee88',t:`⬡ 방패 ${sh}회 — 피해 무효`});}
  if(tr.regen)  traits.push({c:'#88ff88',t:`💚 HP 재생 ${tr.regen}/초`});
  if(tr.spawn)  traits.push({c:'#ffbb88',t:`🔀 소멸 시 ${MD[tr.spawn.type]?.name||tr.spawn.type} ×${tr.spawn.count} 방출`});
  if(!traits.length) traits.push({c:'#555566',t:'특성 없음 — 모든 공격에 정상 피해'});

  const recomm=TOWER_ORDER.filter(tk=>TOWER_COUNTERS[tk].effective.includes(key));
  const descLines=wrapText(d.desc,TW-PAD*2,FONT_DESC);

  const headerH=PAD+PR*2+10;
  const descH=descLines.length*15+10;
  const traitH=traits.length*LH+10;
  const recommH=recomm.length>0?16+42+PAD:6;
  const TH=headerH+descH+traitH+recommH;

  let tx=anchorX,ty=anchorY-TH/2;
  tx=Math.max(4,Math.min(CW-TW-4,tx));
  ty=Math.max(HUD_H+4,Math.min(CH-TH-4,ty));

  ctx.save();
  ctx.shadowColor='rgba(0,0,0,0.88)';ctx.shadowBlur=22;ctx.shadowOffsetX=4;ctx.shadowOffsetY=6;
  ctx.fillStyle='rgba(7,5,20,0.97)';ctx.strokeStyle=d.border;ctx.lineWidth=1.5;
  rr(tx,ty,TW,TH,10);ctx.fill();ctx.stroke();
  ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;

  // 헤더 틴트
  ctx.save();rr(tx,ty,TW,PR*2+PAD*2+2,10);ctx.fillStyle=d.bgCol+'28';ctx.fill();ctx.restore();

  // 초상화
  const pcx=tx+PAD+PR,pcy=ty+PAD+PR;
  ctx.save();ctx.beginPath();ctx.arc(pcx,pcy,PR,0,Math.PI*2);
  ctx.fillStyle=d.bgCol;ctx.fill();ctx.clip();
  if(ok(d.imgKey))ctx.drawImage(imgs[d.imgKey],pcx-PR,pcy-PR,PR*2,PR*2);
  ctx.restore();
  ctx.beginPath();ctx.arc(pcx,pcy,PR,0,Math.PI*2);ctx.strokeStyle=d.border;ctx.lineWidth=2.5;ctx.stroke();

  // 이름
  const nx=tx+PAD+PR*2+12,ny=ty+PAD;
  ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillStyle='#ffffff';ctx.font='bold 14px Arial';
  ctx.fillText(d.name,nx,ny);

  if(liveData){
    const curHp=Math.ceil(liveData.hp);
    const pct=Math.max(0,curHp/liveData.maxHp);
    const bx=nx,by=ny+20,bw=TW-(nx-tx)-PAD-2,bh=8;
    ctx.fillStyle='#1a1a2e';rr(bx,by,bw,bh,3);ctx.fill();
    ctx.fillStyle=pct>0.5?'#44ee77':pct>0.25?'#ffcc44':'#ff4444';
    rr(bx,by,Math.max(4,bw*pct),bh,3);ctx.fill();
    ctx.fillStyle='#aabbcc';ctx.font='11px Arial';
    ctx.fillText(`HP ${curHp} / ${liveData.maxHp}`,nx,by+12);
    ctx.fillStyle='#c8a96e';ctx.fillText(`보상 ${d.rew}g`,nx,by+26);
  }else{
    ctx.fillStyle='#aabbcc';ctx.font='11px Arial';
    ctx.fillText(`HP ${d.hp}  ·  속도 ${d.spd}`,nx,ny+18);
    ctx.fillStyle='#c8a96e';ctx.font='11px Arial';
    ctx.fillText(`보상 ${d.rew}g`,nx,ny+33);
  }

  let oy=ty+PAD+PR*2+10;

  // 설명 (자동 줄바꿈)
  ctx.fillStyle='#8899aa';ctx.font=FONT_DESC;ctx.textBaseline='top';
  for(const dl of descLines){ctx.fillText(dl,tx+PAD,oy);oy+=15;}
  oy+=8;

  // 구분선
  ctx.strokeStyle='rgba(200,169,110,0.22)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(tx+PAD,oy);ctx.lineTo(tx+TW-PAD,oy);ctx.stroke();
  oy+=8;

  // 특성
  for(const ln of traits){
    ctx.fillStyle=ln.c;ctx.font=FONT_TRAIT;ctx.textAlign='left';ctx.textBaseline='top';
    ctx.fillText(ln.t,tx+PAD,oy);oy+=LH;
  }

  // 추천 타워
  if(recomm.length>0){
    ctx.strokeStyle='rgba(200,169,110,0.2)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(tx+PAD,oy+3);ctx.lineTo(tx+TW-PAD,oy+3);ctx.stroke();
    oy+=13;
    ctx.fillStyle='#88ddaa';ctx.font='bold 11px Arial';ctx.textAlign='left';ctx.textBaseline='top';
    ctx.fillText('🏹 효과적인 타워',tx+PAD,oy);oy+=16;
    recomm.forEach((tkey,i)=>{
      const td_=TD[tkey];
      const rx=tx+PAD+i*56,ry=oy+15;
      ctx.save();ctx.beginPath();ctx.arc(rx+15,ry,15,0,Math.PI*2);
      ctx.fillStyle='#1a1a30';ctx.fill();ctx.clip();
      if(ok(td_.ic))ctx.drawImage(imgs[td_.ic],rx,ry-15,30,30);
      ctx.restore();
      ctx.beginPath();ctx.arc(rx+15,ry,15,0,Math.PI*2);ctx.strokeStyle='#c8a96e';ctx.lineWidth=1.3;ctx.stroke();
      ctx.fillStyle='#88ddaa';ctx.font='8.5px Arial';ctx.textAlign='center';ctx.textBaseline='top';
      ctx.fillText(td_.name,rx+15,ry+16);
    });
  }
  ctx.restore();
}

// ── Upgrade Button Tooltip ────────────────────────────────────────────────
function computeStatsAfter(tower,simPi,simTi){
  const d=tower.d;
  const types=new Set(d.atkType);
  let camo=d.baseCamo||false;
  for(let pi=0;pi<3;pi++){
    const path=tower.tree[pi];
    const max=(pi===simPi)?simTi+1:tower.upgrades[pi];
    for(let ti=0;ti<max;ti++){
      const e=path.t[ti][2];
      if(e.addType)  types.add(e.addType);
      if(e.addTypes) e.addTypes.forEach(t=>types.add(t));
      if(e.addCamo)  camo=true;
    }
  }
  return {atkTypes:[...types],canSeeCamo:camo};
}
function canTargetWith(atkTypes,canSeeCamo,mkey){
  const md=MD[mkey]; if(!md)return false;
  const tr=md.traits||{};
  if(tr.camo&&!canSeeCamo)return false;
  const imm=tr.immune||[];
  if(atkTypes.length>0&&atkTypes.every(t=>imm.includes(t)))return false;
  return true;
}
function drawUpgradeBtnTooltip(){
  if(!hovUpgradeBtn||!G.selTower)return;
  const {pi,ti}=hovUpgradeBtn;
  const t=G.selTower;
  const path=t.tree[pi];
  const tier=path.t[ti];
  const tierName=tier[0],cost=tier[1],eff=tier[2];
  const purchased=t.upgrades[pi]>ti;

  const TYI={slash:'⚔',pierce:'🏹',explosive:'💥',siege:'🪨',magic:'❄️',holy:'✨'};

  // 효과 설명 줄 생성
  const effLines=[];
  if(eff.dmgMul)      effLines.push(`⚔ 공격력 ×${eff.dmgMul}`);
  if(eff.rngMul>=10)  effLines.push(`📏 전체 맵 사거리`);
  else if(eff.rngMul) effLines.push(`📏 사거리 ×${eff.rngMul}`);
  if(eff.fpsMul)      effLines.push(`⚡ 연사속도 ×${eff.fpsMul}`);
  if(eff.aoeAdd)      effLines.push(`💥 범위 +${eff.aoeAdd}`);
  if(eff.aoeMul)      effLines.push(`💥 범위 ×${eff.aoeMul}`);
  if(eff.slowAdd)     effLines.push(`❄ 둔화 +${Math.round(eff.slowAdd*100)}%`);
  if(eff.slowDurAdd)  effLines.push(`⏱ 둔화 지속 +${eff.slowDurAdd}s`);
  if(eff.addType)     effLines.push(`✨ ${TYI[eff.addType]||''} ${TYPE_LABEL[eff.addType]||eff.addType} 속성 추가`);
  if(eff.addTypes)    effLines.push(`✨ ${eff.addTypes.map(t=>TYI[t]).join('')} 속성 추가`);
  if(eff.addCamo)     effLines.push(`👁 카모(은신) 감지 획득`);

  // 이 업그레이드 이후 요격 가능 목록
  const afterStats=computeStatsAfter(t,pi,ti);
  const curStats=t.stats;
  const allKeys=[...MONSTER_ORDER,'megaboss'];
  const targetable=allKeys.filter(k=>canTargetWith(afterStats.atkTypes,afterStats.canSeeCamo,k)&&MD[k]);
  const newHits=allKeys.filter(k=>MD[k]&&canTargetWith(afterStats.atkTypes,afterStats.canSeeCamo,k)
    &&!canTargetWith(curStats.atkTypes,curStats.canSeeCamo,k));

  // 레이아웃 상수
  const PAD=12, LH=16, TW2=272;
  const ICON=22, ICONS_PER_ROW=Math.floor((TW2-PAD*2)/ICON);
  const portraitRows=Math.ceil(targetable.length/ICONS_PER_ROW);
  const portraitH=portraitRows*ICON+4;

  // 동적 높이 계산
  const contentH = PAD
    + 18
    + 15
    + (effLines.length ? 6+effLines.length*LH+4 : 0)
    + 8 + 14
    + portraitH
    + PAD;

  // 위치: 버튼 왼쪽, 밖이면 오른쪽
  const btnY2=UI_PATH_Y+pi*UI_PATH_H+22;
  const bx2=UI_BTN_X0+ti*(UI_BTN_W+UI_BTN_GAP);
  let tx2=bx2-TW2-10;
  if(tx2<4) tx2=bx2+(UI_BTN_W||36)+6;
  tx2=Math.max(4,Math.min(CW-TW2-4,tx2));
  let ty2=btnY2+UI_BTN_H/2-contentH/2;
  ty2=Math.max(HUD_H+4,Math.min(CH-contentH-4,ty2));

  ctx.save();
  ctx.shadowColor='rgba(0,0,0,0.85)';ctx.shadowBlur=18;ctx.shadowOffsetX=3;ctx.shadowOffsetY=4;
  ctx.fillStyle='rgba(7,5,20,0.97)';ctx.strokeStyle=path.col;ctx.lineWidth=1.5;
  rr(tx2,ty2,TW2,contentH,10);ctx.fill();ctx.stroke();
  ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;

  // 헤더 틴트
  ctx.save();rr(tx2,ty2,TW2,32,10);ctx.fillStyle=path.col+'22';ctx.fill();ctx.restore();

  let oy=ty2+PAD;

  // 티어명
  ctx.fillStyle=path.col;ctx.font='bold 13px Arial';ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText(`T${ti+1}  ${tierName}`,tx2+PAD,oy);oy+=18;

  // 비용 / 구매 상태
  if(purchased){
    ctx.fillStyle='#55ee77';ctx.font='bold 11px Arial';
    ctx.fillText('✓ 구매 완료',tx2+PAD,oy);
  }else{
    ctx.fillStyle='#ffd700';ctx.font='11px Arial';
    ctx.fillText(`💰 ${cost}g`,tx2+PAD,oy);
  }
  oy+=15;

  // 효과 줄
  if(effLines.length){
    ctx.strokeStyle='rgba(200,169,110,0.2)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(tx2+PAD,oy);ctx.lineTo(tx2+TW2-PAD,oy);ctx.stroke();
    oy+=6;
    for(const ln of effLines){
      ctx.fillStyle='#aaccee';ctx.font='11px Arial';ctx.textAlign='left';ctx.textBaseline='top';
      ctx.fillText(ln,tx2+PAD,oy);oy+=LH;
    }
    oy+=4;
  }

  // 구분선 + 요격 헤더
  ctx.strokeStyle='rgba(200,169,110,0.2)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(tx2+PAD,oy);ctx.lineTo(tx2+TW2-PAD,oy);ctx.stroke();
  oy+=6;
  const newLabel=newHits.length?` (+${newHits.length}종 신규)`:'';
  ctx.fillStyle='#88ddaa';ctx.font='bold 10px Arial';ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText(`🎯 요격 가능 ${targetable.length}종${newLabel}`,tx2+PAD,oy);oy+=14;

  // 초상화 그리드 (자동 줄바꿈)
  let dx=tx2+PAD, colCount=0;
  for(const mkey of targetable){
    const md_=MD[mkey];if(!md_)continue;
    const isNew=newHits.includes(mkey);
    const cx2=dx+9, cy2=oy+9;
    ctx.save();ctx.beginPath();ctx.arc(cx2,cy2,9,0,Math.PI*2);
    ctx.fillStyle=md_.bgCol;ctx.fill();ctx.clip();
    if(ok(md_.imgKey))ctx.drawImage(imgs[md_.imgKey],dx,oy,18,18);
    ctx.restore();
    ctx.beginPath();ctx.arc(cx2,cy2,isNew?10:9,0,Math.PI*2);
    ctx.strokeStyle=isNew?'#55ee77':'rgba(255,255,255,0.22)';
    ctx.lineWidth=isNew?2:1;ctx.stroke();
    dx+=ICON; colCount++;
    if(colCount>=ICONS_PER_ROW){dx=tx2+PAD;oy+=ICON;colCount=0;}
  }

  ctx.restore();
}

// ── 화면 맞춤 & 좌표 변환 ────────────────────────────────────────────────
let portraitMode=false;

function fitToScreen(){
  const vw=window.innerWidth, vh=window.innerHeight;
  if(vh>vw){
    // 세로 모드: 90° CW 회전 후 스케일
    const s=Math.min(vw/CH, vh/CW);
    canvas.style.transform=`rotate(90deg) scale(${s})`;
    portraitMode=true;
  } else {
    // 가로 모드: 스케일만
    const s=Math.min(vw/CW, vh/CH);
    canvas.style.transform=`scale(${s})`;
    portraitMode=false;
  }
}

function getCanvasCoords(clientX, clientY){
  const rc=canvas.getBoundingClientRect();
  if(!portraitMode){
    return {
      x:(clientX-rc.left)*(CW/rc.width),
      y:(clientY-rc.top)*(CH/rc.height)
    };
  }
  // 세로 모드: 90° CW 회전 역변환
  const s=rc.width/CH;
  const cx=rc.left+rc.width/2, cy=rc.top+rc.height/2;
  return {
    x: CW/2-(clientY-cy)/s,
    y: CH/2+(clientX-cx)/s
  };
}

canvas.addEventListener('mousemove',e=>{

    let found=null;
    for(let pi=0;pi<3;pi++){
      const btnY=UI_PATH_Y+pi*UI_PATH_H+22;

        const relX=mouse.x-UI_BTN_X0;
        const ti=Math.floor(relX/(UI_BTN_W+UI_BTN_GAP));
        if(ti>=0&&ti<5){
          const bx=UI_BTN_X0+ti*(UI_BTN_W+UI_BTN_GAP);

      const dc=Math.max(0,Math.min(COLS-1,E.eHovC)),dr=Math.max(0,Math.min(ROWS-1,E.eHovR));

    canvas.style.cursor=(eFindWP(E.eHovC,E.eHovR)>=0&&E.dragIdx===null)?'grab':E.dragIdx!==null?'grabbing':'crosshair';

    E.eHovC=Math.floor(mouse.x/CELL);
    E.eHovR=Math.floor((mouse.y-HUD_H)/CELL);

function handleClick(mx,my){
  // Editor mode
  if(E.on){ handleEditorClick(mx,my); return; }
  // Editor toggle (HUD)
  if(my<HUD_H){
    const ffx=GW/2+84,ffw=72,ifx=ffx+ffw+6,ifw=40;
    const edx=ifx+ifw+6,edy=8,edw=58,edh=39;
    if(mx>=edx&&mx<=edx+edw&&my>=edy&&my<=edy+edh){editorOpen();return;}
  }
  // Restart
  if(restartBtn){
    const b=restartBtn;
    if(mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h){initGame();return;}
  }
  if(G.state==='gameover'||G.state==='victory')return;

  // Info overlay click-to-close (anywhere)
  if(G.showInfo){
    const TX=30,TY=20,TW=CW-60;
    const clx=TX+TW-38,cly=TY+6;
    // close button or outside panel
    if(mx>=clx&&mx<=clx+30&&my>=cly&&my<=cly+28||mx<TX||mx>TX+TW||my<TY||my>TY+CH-40)
      G.showInfo=false;
    return;
  }

  // HUD
  if(my<HUD_H){
    if(G.state==='rest'){
      const cx=GW/2,bx=cx-70,by=8,bw=140,bh=39;
      if(mx>=bx&&mx<=bx+bw&&my>=by&&my<=by+bh){startWave();return;}
    }
    const ffx=GW/2+84,ffy=8,ffw=72,ffh=39;
    if(mx>=ffx&&mx<=ffx+ffw&&my>=ffy&&my<=ffy+ffh){G.ff=!G.ff;return;}
    const ifx=ffx+ffw+6,ify=8,ifw=40,ifh=39;
    if(mx>=ifx&&mx<=ifx+ifw&&my>=ify&&my<=ify+ifh){G.showInfo=!G.showInfo;return;}
    return;
  }

  // Side panel
  if(mx>=GW){
    if(G.selTower)        handleUpgradeClick(mx,my);
    else if(G.previewType) handlePreviewClick(mx,my);
    else                  handleTowerSelectClick(mx,my);
    return;
  }

  // Game area — 미리보기 닫기
  G.previewType=null;
  const col=Math.floor(mx/CELL),row=Math.floor((my-HUD_H)/CELL);
  if(col<0||col>=COLS||row<0||row>=ROWS)return;
  const existing=G.towers.find(t=>col>=t.col&&col<t.col+2&&row>=t.row&&row<t.row+2);
  if(existing){G.selTower=existing;return;}
  G.selTower=null;
  if(!isBuildable2x2(col,row))return;
  if(G.towers.some(t=>col+2>t.col&&col<t.col+2&&row+2>t.row&&row<t.row+2))return;
  if(G.gold>=TD[G.selType].cost){G.gold-=TD[G.selType].cost;G.towers.push(new Tower(G.selType,col,row));}
}

let _lastTowerClick={type:null,time:0};
function handleTowerSelectClick(mx,my){
  const TBH=70,TLY=HUD_H+32;
  for(let i=0;i<TOWER_ORDER.length;i++){
    const y=TLY+i*(TBH+5);
    if(my>=y&&my<y+TBH){
      const type=TOWER_ORDER[i],now=Date.now();
      if(_lastTowerClick.type===type&&now-_lastTowerClick.time<400){
        // 더블클릭 → 미리보기 패널
        G.previewType=type;
        _lastTowerClick={type:null,time:0};
      } else {
        G.selType=type;G.previewType=null;
        _lastTowerClick={type,time:now};
      }
      return;
    }
  }
}

function handlePreviewClick(mx,my){
  // Close button (같은 위치를 drawPreviewUpgradeUI와 공유)
  const dx=PX+PW-38,dy=UI_HDR_Y;
  if(mx>=dx&&mx<=dx+36&&my>=dy&&my<=dy+32){G.previewType=null;return;}
}

function handleUpgradeClick(mx,my){
  const t=G.selTower;

  // Deselect button
  const dx=PX+PW-38,dy=UI_HDR_Y;
  if(mx>=dx&&mx<=dx+36&&my>=dy&&my<=dy+32){G.selTower=null;return;}

  // Tier buttons
  for(let pi=0;pi<3;pi++){
    const yBase=UI_PATH_Y+pi*UI_PATH_H;
    const btnY=yBase+22;
    if(my>=btnY&&my<btnY+UI_BTN_H){
      const relX=mx-UI_BTN_X0;
      const ti=Math.floor(relX/(UI_BTN_W+UI_BTN_GAP));
      if(ti>=0&&ti<5){
        const bx=UI_BTN_X0+ti*(UI_BTN_W+UI_BTN_GAP);
        if(mx>=bx&&mx<bx+UI_BTN_W){
          // Only buy the NEXT tier in sequence
          if(t.upgrades[pi]===ti)t.doUpgrade(pi);
          return;
        }
      }
    }
  }

}

// ── Game Loop ─────────────────────────────────────────────────────────────
let lastT=0;
function loop(ts){
  const rawDt=Math.min((ts-lastT)/1000,0.05);lastT=ts;

  ctx.clearRect(0,0,CW,CH);

  if(E.on){
    drawEditorFrame();
    requestAnimationFrame(loop);return;
  }

  const dt=rawDt*(G.ff?2:1);
  if(G.state==='wave'){
    updateSpawner(dt);updateBalloons(dt);updateTowers(dt);
    updateProjectiles(dt);updateExplosions(dt);checkWaveDone();
    G.balloons=G.balloons.filter(b=>b.alive);
    G.projectiles=G.projectiles.filter(p=>p.alive);
    G.explosions=G.explosions.filter(e=>e.alive);
  }
  if(G.state==='rest'){
    if(isFinite(G.restTimer))G.restTimer-=rawDt;
    updateExplosions(dt);G.explosions=G.explosions.filter(e=>e.alive);
    if(G.restTimer<=0)startWave();
  }

  drawBG();drawGrid();drawTowers();drawBalloons();drawProjectiles();drawExplosions();
  drawWaveProgress();
  drawHUD();drawPanel();drawTooltip();drawTowerTooltip();drawLiveBalloonTooltip();drawUpgradeBtnTooltip();drawOverlay();drawInfoOverlay();
  requestAnimationFrame(loop);
}

// ── Zoom ──────────────────────────────────────────────────────────────────
let gameZoom = 1.0;
function applyGameZoom(){
  if(portraitMode) return;
  const vw=window.innerWidth, vh=window.innerHeight;
  const baseScale=Math.min(vw/CW, vh/CH);
  const s=(vw<CW||vh<CH) ? baseScale*gameZoom : gameZoom;
  canvas.style.transform=`scale(${Math.max(0.4,Math.min(2.5,s))})`;
  portraitMode=false;
}
window.addEventListener('wheel', e => {
  if(!e.ctrlKey) return;
  e.preventDefault();
  gameZoom = Math.max(0.4, Math.min(2.5, gameZoom * (e.deltaY < 0 ? 1.1 : 1/1.1)));
  applyGameZoom();
}, {passive: false});

// ── Boot ──────────────────────────────────────────────────────────────────
initGame();loadMapFromStorage();loadAssets();
fitToScreen();
window.addEventListener('resize', fitToScreen);
window.addEventListener('orientationchange', ()=>setTimeout(fitToScreen,100));
requestAnimationFrame(loop);
</script>
