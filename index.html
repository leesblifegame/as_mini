// Audio: procedural BGM + SFX so the game has sound without external files.
const AudioSys = {
  ctx:null, master:null, bgmGain:null, sfxGain:null, noiseBuffer:null,
  unlocked:false, beat:0, cooldowns:Object.create(null),
  lastBgmAt:0, musicSeed:0, prevState:'',
  init(){
    if(this.ctx) return;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    this.ctx = new Ctx();
    this.master = this.ctx.createGain();
    this.bgmGain = this.ctx.createGain();
    this.sfxGain = this.ctx.createGain();
    this.master.gain.value = 0.8;
    this.bgmGain.gain.value = 0.18;
    this.sfxGain.gain.value = 0.32;
    this.bgmGain.connect(this.master);
    this.sfxGain.connect(this.master);
    this.master.connect(this.ctx.destination);
    this.noiseBuffer = this.makeNoiseBuffer();
  },
  async unlock(){
    this.init();
    if(!this.ctx) return;
    try{
      if(this.ctx.state !== 'running') await this.ctx.resume();
      this.unlocked = true;
    }catch(e){}
  },
  makeNoiseBuffer(){
    if(!this.ctx) return null;
    const len = Math.max(1, Math.floor(this.ctx.sampleRate * 0.25));
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0;i<len;i++) data[i] = (Math.random()*2-1) * (1 - i/len);
    return buf;
  },
  canPlay(key, ms){
    const now = performance.now();
    if((this.cooldowns[key]||0) > now) return false;
    this.cooldowns[key] = now + ms;
    return true;
  },
  env(g, when, attack, decay, peak, end=0.0001){
    g.gain.cancelScheduledValues(when);
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(peak, when + attack);
    g.gain.exponentialRampToValueAtTime(end, when + attack + decay);
  },
  tone(freq, dur, type, vol, when=0, slideTo=null){
    if(!this.unlocked || !this.ctx) return;
    const t = this.ctx.currentTime + when;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
    this.env(g, t, 0.003, dur, vol);
    o.connect(g); g.connect(this.sfxGain);
    o.start(t); o.stop(t + dur + 0.03);
  },
  noise(vol, dur, hp=600, lp=6000, when=0){
    if(!this.unlocked || !this.ctx || !this.noiseBuffer) return;
    const t = this.ctx.currentTime + when;
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuffer;
    const hpf = this.ctx.createBiquadFilter();
    hpf.type = 'highpass';
    hpf.frequency.value = hp;
    const lpf = this.ctx.createBiquadFilter();
    lpf.type = 'lowpass';
    lpf.frequency.value = lp;
    const g = this.ctx.createGain();
    this.env(g, t, 0.002, dur, vol);
    src.connect(hpf); hpf.connect(lpf); lpf.connect(g); g.connect(this.sfxGain);
    src.start(t); src.stop(t + dur + 0.04);
  },
  bgmNote(freq, dur, vol, when=0, type='triangle'){
    if(!this.unlocked || !this.ctx) return;
    const t = this.ctx.currentTime + when;
    const o = this.ctx.createOscillator();
    const lp = this.ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 1100;
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    this.env(g, t, 0.01, dur, vol);
    o.connect(lp); lp.connect(g); g.connect(this.bgmGain);
    o.start(t); o.stop(t + dur + 0.05);
  },
  play(name, data={}){
    if(!this.unlocked) return;
    switch(name){
      case 'ui':
        this.tone(720, 0.04, 'square', 0.06, 0, 930);
        break;
      case 'place':
        this.tone(410, 0.07, 'square', 0.08, 0, 520);
        this.tone(620, 0.05, 'triangle', 0.05, 0.02, 840);
        break;
      case 'upgrade':
        this.tone(480, 0.05, 'triangle', 0.06, 0, 720);
        this.tone(720, 0.06, 'triangle', 0.05, 0.04, 980);
        break;
      case 'sell':
        this.tone(680, 0.05, 'triangle', 0.05, 0, 520);
        this.tone(480, 0.07, 'sine', 0.04, 0.03, 320);
        break;
      case 'waveStart':
        this.tone(220, 0.18, 'sawtooth', 0.06, 0, 330);
        this.noise(0.03, 0.08, 1200, 5000, 0.01);
        break;
      case 'waveClear':
        this.tone(523, 0.08, 'triangle', 0.05, 0, 659);
        this.tone(659, 0.1, 'triangle', 0.05, 0.07, 784);
        break;
      case 'spawn':
        this.tone(240, 0.04, 'sine', 0.025, 0, 210);
        break;
      case 'shield':
        this.tone(980, 0.035, 'square', 0.04, 0, 760);
        break;
      case 'hit':
        this.tone(data.freq||520, 0.03, 'triangle', 0.025, 0, Math.max(180, (data.freq||520)-120));
        break;
      case 'kill':
        this.tone(300, 0.05, 'square', 0.04, 0, 220);
        this.tone(180, 0.08, 'triangle', 0.03, 0.02, 120);
        break;
      case 'leak':
        this.tone(180, 0.18, 'sawtooth', 0.07, 0, 70);
        break;
      case 'victory':
        this.tone(523,0.12,'triangle',0.06,0,659);
        this.tone(659,0.12,'triangle',0.06,0.1,784);
        this.tone(784,0.18,'triangle',0.06,0.2,1046);
        break;
      case 'gameover':
        this.tone(220,0.16,'sawtooth',0.07,0,160);
        this.tone(160,0.22,'sawtooth',0.05,0.12,90);
        break;
      case 'shoot':
        this.playShoot(data.type);
        break;
      case 'explode':
        this.noise(0.06, 0.16, 100, 1400, 0);
        this.tone(110, 0.12, 'sawtooth', 0.05, 0, 55);
        break;
    }
  },
  playShoot(type){
    if(!this.canPlay(`shoot_${type}`, 55)) return;
    if(type==='arrow'){
      this.tone(980, 0.025, 'square', 0.04, 0, 680);
      this.noise(0.012, 0.025, 2500, 9000, 0);
    }else if(type==='cannon'){
      this.noise(0.05, 0.1, 180, 1800, 0);
      this.tone(140, 0.09, 'sawtooth', 0.06, 0, 70);
    }else if(type==='ice'){
      this.tone(880, 0.05, 'triangle', 0.04, 0, 620);
      this.noise(0.02, 0.04, 3000, 9000, 0);
    }else if(type==='sniper'){
      this.tone(1200, 0.02, 'square', 0.06, 0, 520);
      this.noise(0.02, 0.02, 4000, 12000, 0);
    }else if(type==='bomb'){
      this.tone(180, 0.08, 'sawtooth', 0.05, 0, 130);
      this.noise(0.02, 0.05, 800, 2800, 0);
    }
  },
  update(dt){
    if(!this.unlocked || !this.ctx) return;
    const bpm = G && G.state==='wave' ? (G.ff ? 128 : 108) : 84;
    this.beat += dt * bpm / 60;
    while(this.beat >= 1){
      this.beat -= 1;
      this.lastBgmAt++;
      const step = this.lastBgmAt % 8;
      const root = G && G.state==='wave' ? 164.81 : 130.81;
      const phrase = [1,1.122,1.335,1.498,1,1.122,1.682,1.335];
      const bass = root * (step===4 ? 0.75 : 0.5);
      this.bgmNote(root * phrase[step], step===7 ? 0.42 : 0.26, step===0||step===4 ? 0.04 : 0.025, 0, 'triangle');
      this.bgmNote(bass, 0.22, 0.02, 0.01, 'sine');
      if(G && G.state==='wave' && (step===2 || step===6)) this.noise(0.006, 0.03, 5000, 12000, 0.01);
    }
  }
};

// ── Path ──────────────────────────────────────────────────────────────────
const g2p = (c, r) => ({ x: c*CELL + CELL/2, y: HUD_H + r*CELL + CELL/2 });
let PATH_WP, PATH_PX, SEG_LEN, pathSet;
const isPath = (c, r) => pathSet.has(`${c},${r}`);

let buildMap = [];
function initBuildMap(){
  buildMap = Array.from({length:ROWS}, () => new Array(COLS).fill(true));
}
function isBuildable(col, row){
  if(col<0||col>=COLS||row<0||row>=ROWS) return false;
  if(isPath(col, row)) return false;
  return buildMap[row][col];
}
function isBuildable2x2(col, row){
  for(let dr=0;dr<2;dr++) for(let dc=0;dc<2;dc++) if(!isBuildable(col+dc,row+dr)) return false;
  return true;
}

function rebuildPath(wps){
  PATH_WP = wps;
  PATH_PX = wps.map(([c,r]) => g2p(c,r));
  SEG_LEN = PATH_PX.slice(0,-1).map((_,i) => {
    const a=PATH_PX[i], b=PATH_PX[i+1]; return Math.hypot(b.x-a.x, b.y-a.y);
  });
  pathSet = new Set();
  for(let i=0; i<wps.length-1; i++){
    const [c0,r0]=wps[i], [c1,r1]=wps[i+1];
    if(c0===c1) for(let r=Math.min(r0,r1);r<=Math.max(r0,r1);r++) pathSet.add(`${c0},${r}`);
    else        for(let c=Math.min(c0,c1);c<=Math.max(c0,c1);c++) pathSet.add(`${c},${r0}`);
  }
}
// Mobile-scaled default path (COLS=30, ROWS=34)
rebuildPath([[-1,3],[23,3],[23,9],[12,9],[12,15],[5,15],[5,22],[23,22],[23,28],[COLS+1,28]]);
initBuildMap();

// ── 공통 맵 데이터 적용 ───────────────────────────────────────────────────
function applyMapData(data){
  const ECOLS=data.cols||51, SX=COLS/ECOLS;
  const EROWS=data.rows||33, SY=ROWS/EROWS;
  const wp=data.pathWP.map(([c,r])=>{
    if(c<0)      return[-1,        Math.round(r*SY)];
    if(c>ECOLS)  return[COLS+1,    Math.round(r*SY)];
    return[Math.round(c*SX),Math.round(r*SY)];
  });
  rebuildPath(wp);
  initBuildMap();
  for(const[c,r]of(data.nonBuildable||[])){
    const nc=Math.round(c*SX),nr=Math.round(r*SY);
    if(nc>=0&&nc<COLS&&nr>=0&&nr<ROWS)buildMap[nr][nc]=false;
  }
}

// ── URL 해시에서 맵 로드 (#map=base64) ────────────────────────────────────
function loadMapFromURL(){
  try{
    if(!location.hash.startsWith('#map='))return false;
    const data=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(5)))));
    if(!data||!Array.isArray(data.pathWP)||data.pathWP.length<2)return false;
    applyMapData(data);
    // localStorage에도 저장해 재방문 시 유지
    const maps={}; maps['url_map']={...data,id:'url_map',savedAt:Date.now()};
    localStorage.setItem('btd_maps',JSON.stringify(maps));
    localStorage.setItem('btd_stages',JSON.stringify(['url_map']));
    return true;
  }catch(e){console.warn('URL 맵 로드 실패:',e);return false;}
}

// ── localStorage에서 맵 로드 ──────────────────────────────────────────────
function loadMapFromStorage(){
  try{
    const stages=JSON.parse(localStorage.getItem('btd_stages')||'[]');
    const maps  =JSON.parse(localStorage.getItem('btd_maps')  ||'{}');
    let mapId=stages[0];
    if(!mapId){
      const recent=Object.values(maps).sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));
      if(recent.length)mapId=recent[0].id;
    }
    if(!mapId)return false;
    const data=maps[mapId];
    if(!data||!Array.isArray(data.pathWP)||data.pathWP.length<2)return false;
    applyMapData(data);
    return true;
  }catch(e){console.warn('맵 로드 실패, 기본 경로 사용:',e);return false;}
}

function loadBestMap(){
  if(!loadMapFromURL())loadMapFromStorage();
}

function bPos(pi, prog){
  if(pi>=PATH_PX.length-1) return {...PATH_PX[PATH_PX.length-1]};
  const a=PATH_PX[pi], b=PATH_PX[pi+1];
  return {x:a.x+(b.x-a.x)*prog, y:a.y+(b.y-a.y)*prog};
}

  }
  TOWER_COUNTERS[tkey] = {effective, resist:resist_list, immune:immune_list};
}

// ── Tower ─────────────────────────────────────────────────────────────────
class Tower {
  constructor(type, col, row){
    this.type=type; this.col=col; this.row=row;
    this.x=col*CELL+CELL; this.y=HUD_H+row*CELL+CELL;
    this.upgrades=[0,0,0]; this.cd=0; this.angle=-Math.PI/2;
    this._statsCache=null;
    this.animState='idle'; this.animF=0; this.animTimer=0;
    this.attacking=false; this.attackT=0;
  }
  updateAnim(dt){
    const a=TOWER_ANIM[this.type]; if(!a)return;
    if(this.attacking){
      this.attackT+=dt;
      const dur=a.attack.frames/a.attack.fps;
      if(this.attackT>=dur){this.attacking=false;this.attackT=0;this.animState='idle';this.animF=0;}
      else{this.animF=this.attackT*a.attack.fps;this.animState='attack';}
    }else{
      this.animTimer+=dt;
      this.animF=(this.animTimer*a.idle.fps)%a.idle.frames;
      this.animState='idle';
    }
  }
  triggerAttack(){ this.attacking=true; this.attackT=0; this.animState='attack'; this.animF=0; }
  get d(){ return TD[this.type]; }
  get tree(){ return UT[this.type]; }
  _computeStats(){
    const d=this.d;
    let dmg=d.bDmg, rng=d.bRng, fps=d.bFps, aoe=d.bAoe, slow=d.bSlow, slowDur=d.bSlowDur;
    const atkTypes=new Set(d.atkType); let canSeeCamo=d.baseCamo||false;
    for(let pi=0;pi<3;pi++){
      const path=this.tree[pi];
      for(let ti=0;ti<this.upgrades[pi];ti++){
        const e=path.t[ti][2];
        if(e.dmgMul)    dmg*=e.dmgMul;
        if(e.rngMul)    rng=Math.min(rng*e.rngMul,9999);
        if(e.fpsMul)    fps*=e.fpsMul;
        if(e.aoeAdd)    aoe+=e.aoeAdd;
        if(e.aoeMul)    aoe*=e.aoeMul;
        if(e.slowAdd)   slow=Math.min(slow+e.slowAdd,0.95);
        if(e.slowDurAdd)slowDur+=e.slowDurAdd;
        if(e.addType)   atkTypes.add(e.addType);
        if(e.addTypes)  e.addTypes.forEach(t=>atkTypes.add(t));
        if(e.addCamo)   canSeeCamo=true;
      }
    }
    return {dmg:Math.round(dmg),rng:Math.round(rng),fps,aoe:Math.round(aoe),slow,slowDur,atkTypes:[...atkTypes],canSeeCamo};
  }
  get stats(){ if(!this._statsCache) this._statsCache=this._computeStats(); return this._statsCache; }
  _dirty(){ this._statsCache=null; }
  get dmg(){ return this.stats.dmg; }
  get rng(){ return this.stats.rng; }
  get fps(){ return this.stats.fps; }
  get aoe(){ return this.stats.aoe; }
  get slow(){ return this.stats.slow; }
  get slowDur(){ return this.stats.slowDur; }
  get atkTypes(){ return this.stats.atkTypes; }
  get canSeeCamo(){ return this.stats.canSeeCamo; }
  canUpgrade(pi){
    const next=this.upgrades[pi]+1; if(next>5)return false;
    if(this.upgrades[pi]===0){
      const otherActive=this.upgrades.filter((_,i)=>i!==pi&&this.upgrades[i]>0).length;
      if(otherActive>=2)return false;
    }
    if(next>=3){ for(let i=0;i<3;i++) if(i!==pi&&this.upgrades[i]>=3)return false; }
    return true;
  }
  upgradeCost(pi){ const ti=this.upgrades[pi]; if(ti>=5)return null; return this.tree[pi].t[ti][1]; }
  doUpgrade(pi){
    if(!this.canUpgrade(pi))return false;
    const cost=this.upgradeCost(pi);
    if(cost===null||G.gold<cost)return false;
    G.gold-=cost; this.upgrades[pi]++; this._dirty(); return true;
  }
  get sellVal(){
    let total=this.d.cost;
    for(let pi=0;pi<3;pi++){ const path=this.tree[pi]; for(let ti=0;ti<this.upgrades[pi];ti++) total+=path.t[ti][1]; }
    return Math.floor(total*0.6);
  }
}

// ── Projectile & Explosion ────────────────────────────────────────────────
class Proj {
  constructor(tower, target){
    this.id=nid(); this.tid=target.id;
    this.x=tower.x; this.y=tower.y; this.tx=target.x; this.ty=target.y;
    this.spd=tower.d.pspd; this.col=tower.d.pcol; this.rad=tower.d.prad;
    this.dmg=tower.dmg; this.aoe=tower.aoe; this.slow=tower.slow; this.slowDur=tower.slowDur;
    this.atkTypes=tower.atkTypes; this.towerType=tower.type; this.alive=true;
    const dx=this.tx-this.x, dy=this.ty-this.y, d=Math.hypot(dx,dy)||1;
    this.vx=dx/d*this.spd; this.vy=dy/d*this.spd; this.angle=Math.atan2(dy,dx); this.fxTimer=0;
  }
}
class Expl {
  constructor(x,y,maxR,col){ this.x=x;this.y=y;this.maxR=maxR;this.r=5;this.col=col;this.alpha=0.85;this.alive=true; }
}

// ── Wave Logic ────────────────────────────────────────────────────────────
function startWave(){
  if(G.wave>=G.maxWaves)return;
  G.wave++; G.state='wave';
  const def=WAVES[G.wave-1]; G.spawnQueue=[];
  for(const s of def) for(let i=0;i<s.count;i++) G.spawnQueue.push({type:s.type,t:s.at+i*s.iv});
  G.spawnQueue.sort((a,b)=>a.t-b.t); G.spawnTimer=0; G.waveTotal=G.spawnQueue.length;
  AudioSys.play('waveStart');
}
function checkWaveDone(){
  if(G.state!=='wave')return;
  if(G.spawnQueue.length>0)return;
  if(G.balloons.some(b=>b.alive))return;
  G.gold+=25+G.wave*6; G.score+=(25+G.wave*6)*5;
  if(G.wave>=G.maxWaves){G.state='victory';AudioSys.play('victory');return;}
  AudioSys.play('waveClear');
  G.state='rest'; G.restTimer=1.5;
}

// ── Update Functions ──────────────────────────────────────────────────────
function updateSpawner(dt){
  G.spawnTimer+=dt*60;
  while(G.spawnQueue.length&&G.spawnQueue[0].t<=G.spawnTimer){
    G.balloons.push(new Balloon(G.spawnQueue.shift().type,1,0));
    if(AudioSys.canPlay('spawn', 140)) AudioSys.play('spawn');
  }
}
function updateBalloons(dt){
  for(const b of G.balloons){
    if(!b.alive)continue;
    if(b.traits.regen&&b.hp<b.maxHp) b.hp=Math.min(b.maxHp,b.hp+b.traits.regen*dt);
    let spd=b.spd;
    if(b.slowT>0){b.slowT=Math.max(0,b.slowT-dt);spd*=(1-b.slowF);}
    let rem=spd*dt;
    while(rem>0&&b.pi<PATH_PX.length-1){
      const left=SEG_LEN[b.pi]*(1-b.prog);
      if(rem>=left){rem-=left;b.pi++;b.prog=0;}
      else{b.prog+=rem/SEG_LEN[b.pi];rem=0;}
    }
    if(b.pi>=PATH_PX.length-1){
      b.alive=false;b.reached=true;G.lives--;
      AudioSys.play('leak');
      if(G.lives<=0){G.lives=0;G.state='gameover';AudioSys.play('gameover');}
      continue;
    }
    const p=bPos(b.pi,b.prog);b.x=p.x;b.y=p.y;b.dist=b.pi+b.prog;
    const dx=b.x-b.prevX,dy=b.y-b.prevY;
    if(dx*dx+dy*dy>0.01){const deg=(Math.atan2(dy,dx)*180/Math.PI+360)%360;b.dirRow=[2,3,4,5,6,7,0,1][Math.round(deg/45)%8];}
    b.prevX=b.x;b.prevY=b.y;
    b.frameTimer+=dt*1000;if(b.frameTimer>=125){b.frameTimer-=125;b.frame=(b.frame+1)%5;}
  }
}
function updateTowers(dt){
  for(const t of G.towers){
    t.updateAnim(dt); if(t.cd>0){t.cd-=dt;continue;}
    let best=null, bd=-1;
    for(const b of G.balloons){
      if(!b.alive)continue;
      if(b.traits.camo&&!t.canSeeCamo)continue;
      if(Math.hypot(b.x-t.x,b.y-t.y)<=t.rng&&b.dist>bd){bd=b.dist;best=b;}
    }
    if(best){
      t.angle=Math.atan2(best.y-t.y,best.x-t.x); t.cd=1/t.fps;
      t.triggerAttack(); G.projectiles.push(new Proj(t,best));
      AudioSys.play('shoot', { type:t.type });
    }
  }
}
function updateProjectiles(dt){
  for(const p of G.projectiles){
    if(!p.alive)continue;
    const tgt=G.balloons.find(b=>b.id===p.tid);
    if(tgt&&tgt.alive){
      p.tx=tgt.x;p.ty=tgt.y;
      const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy)||1;
      p.vx=dx/d*p.spd;p.vy=dy/d*p.spd;
    }
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    p.angle=Math.atan2(p.vy,p.vx);p.fxTimer+=dt;
    if(Math.hypot(p.x-p.tx,p.y-p.ty)<14){
      p.alive=false;
      if(p.aoe>0){
        G.explosions.push(new Expl(p.x,p.y,p.aoe,p.col));
        AudioSys.play('explode');
        for(const b of G.balloons){ if(!b.alive)continue; if(Math.hypot(b.x-p.x,b.y-p.y)<=p.aoe)hitBalloon(b,p.dmg,p.slow,p.slowDur,p.atkTypes); }
      }else if(tgt&&tgt.alive){ hitBalloon(tgt,p.dmg,p.slow,p.slowDur,p.atkTypes); }
    }
    if(p.x<-60||p.x>CW+60||p.y<-60||p.y>CH+60)p.alive=false;
  }
}
function hitBalloon(b,dmg,slow,slowDur,atkTypes){
  if(b.shield>0){b.shield--;AudioSys.play('shield');return;}
  const imm=b.traits.immune||[], res=b.traits.resist||[], wk=b.traits.weak||[];
  let dmgMul=0;
  for(const t of atkTypes){
    if(imm.includes(t))continue;
    let m=wk.includes(t)?1.75:res.includes(t)?0.35:1.0;
    dmgMul=Math.max(dmgMul,m);
  }
  if(dmgMul===0)return;
  const actual=Math.max(1,Math.round((dmg-(b.traits.armor||0))*dmgMul));
  b.hp-=actual;
  if(AudioSys.canPlay('hit', 35)) AudioSys.play('hit', { freq: 420 + Math.min(500, actual * 18) });
  if(slow>0&&!b.traits.slowImmune){b.slowT=slowDur;b.slowF=slow;}
  if(b.hp<=0){
    b.alive=false;G.gold+=b.rew;G.score+=b.rew*10;
    AudioSys.play('kill');
    if(b.traits.spawn) for(let i=0;i<b.traits.spawn.count;i++) G.balloons.push(new Balloon(b.traits.spawn.type,b.pi,b.prog));
  }
}
function updateExplosions(dt){
  for(const e of G.explosions){
    if(!e.alive)continue;
    e.r+=e.maxR*3.5*dt;e.alpha-=2.8*dt;
    if(e.alpha<=0||e.r>=e.maxR)e.alive=false;
  }
}

// ── Draw Helpers ──────────────────────────────────────────────────────────
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function wrapText(text, maxW, font){
  ctx.save(); ctx.font=font;
  const words=text.split(' '); const lines=[]; let line='';
  for(const w of words){
    const test=line?line+' '+w:w;
    if(ctx.measureText(test).width>maxW&&line){lines.push(line);line=w;}
    else line=test;
  }
  if(line)lines.push(line);
  ctx.restore(); return lines;
}

  ctx.restore();

// ── Draw Towers ───────────────────────────────────────────────────────────
const EMOJ = {arrow:'🏹',cannon:'🐚',ice:'❄️',sniper:'🔱',bomb:'🦀'};
function drawTowers(){
  for(const t of G.towers){
    const sel=t===G.selTower, hov=(hovC>=t.col&&hovC<t.col+2&&hovR>=t.row&&hovR<t.row+2);
    if(sel){
      ctx.save();ctx.beginPath();ctx.arc(t.x,t.y,t.rng,0,Math.PI*2);
      ctx.strokeStyle='rgba(255,240,80,0.45)';ctx.lineWidth=1.5;ctx.stroke();
      ctx.fillStyle='rgba(255,240,80,0.04)';ctx.fill();ctx.restore();
    } else if(hov){

      ctx.strokeStyle='rgba(200,200,200,0.22)';ctx.lineWidth=1;ctx.stroke();ctx.restore();
    }
    const TS2=TSCALE*2;
    ctx.save();ctx.translate(t.x+2*TS2,t.y+20*TS2);ctx.scale(1,0.32);
    ctx.beginPath();ctx.ellipse(0,0,21*TS2,19*TS2,0,0,Math.PI*2);

    const sz=Math.round(92*TSCALE);

      ctx.drawImage(imgs[shKey],fr*FRAME_SZ,sa.row*FRAME_SZ,FRAME_SZ,FRAME_SZ,t.x-sz/2,t.y-sz/2,sz,sz);
    }else if(ok(t.d.tw)){
      const a=TOWER_ANIM[t.type];
      ctx.save();ctx.translate(t.x,t.y);
      ctx.shadowBlur=sel?16:8;ctx.shadowColor=sel?'#ff6600':'rgba(255,140,50,0.85)';
      if(t.animState==='attack'&&a){
        const dur=a.attack.frames/a.attack.fps;

        ctx.drawImage(imgs[t.d.tw],-sz/2,-sz/2,sz,sz);

        const fl=Math.max(0,(0.4-p)*1.5);
        if(fl>0){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=fl;ctx.drawImage(imgs[t.d.tw],-sz/2,-sz/2,sz,sz);}
      }else{
        const freq=a?a.idle.fps/a.idle.frames:1.5, phase=(t.col*3+t.row*7)*0.4;
        const wave=Math.sin(Date.now()*0.001*freq*Math.PI*2+phase);

      }

    }else{
      ctx.save();ctx.fillStyle=t.d.col;rr(t.x-sz/2,t.y-sz/2,sz,sz,3);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.75)';ctx.font=`${Math.round(10*TS2)}px Arial`;
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(EMOJ[t.type]||'🗼',t.x,t.y);
      ctx.restore();
    }

    const dAngles=[-Math.PI/2+Math.PI/6,-Math.PI/2+Math.PI/2,-Math.PI/2-Math.PI/6];
    for(let pi=0;pi<3;pi++){
      const tier=t.upgrades[pi]; if(tier===0)continue;
      const a=dAngles[pi], dx=Math.cos(a)*dotDist, dy=Math.sin(a)*dotDist;

      ctx.beginPath();ctx.arc(t.x+dx,t.y+dy,dotR+0.5,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fill();
      ctx.beginPath();ctx.arc(t.x+dx,t.y+dy,dotR,0,Math.PI*2);ctx.fillStyle=t.tree[pi].col;ctx.fill();

      ctx.restore();
    }else{ drawProjShape(p); }
  }
}
function drawExplosions(){
  for(const e of G.explosions){
    if(!e.alive)continue;
    ctx.save();ctx.globalAlpha=e.alpha;
    ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.strokeStyle=e.col;ctx.lineWidth=3;ctx.stroke();
    ctx.beginPath();ctx.arc(e.x,e.y,e.r*0.55,0,Math.PI*2);ctx.fillStyle=e.col;ctx.globalAlpha=e.alpha*0.25;ctx.fill();
    ctx.restore();
  }
}

// ── Wave Progress Bar (slim overlay at bottom of game area) ───────────────
function drawWaveProgress(){
  if(G.state==='gameover'||G.state==='victory')return;
  const bx=4, by=PANEL_Y-6, bw=CW-8, bh=4;
  if(G.state==='wave'&&G.waveTotal>0){
    const alive=G.balloons.filter(b=>b.alive).length;
    const remaining=G.spawnQueue.length+alive;
    const killed=Math.max(0,G.waveTotal-remaining);
    const prog=killed/G.waveTotal;
    ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(bx,by,bw,bh);
    const gr=ctx.createLinearGradient(bx,0,bx+bw*prog,0);
    gr.addColorStop(0,'#226622');gr.addColorStop(1,'#44ee44');
    ctx.fillStyle=gr;ctx.fillRect(bx,by,bw*prog,bh);
  }
}

// ── Upgrade effect formatter ──────────────────────────────────────────────
function fmtUpgEff(eff){
  const lines=[];
  if(eff.dmgMul)    lines.push(`공격력 ×${eff.dmgMul}`);
  if(eff.rngMul)    lines.push(`사거리 ×${eff.rngMul}`);
  if(eff.fpsMul)    lines.push(`공속 ×${eff.fpsMul}`);
  if(eff.aoeMul)    lines.push(`범위 ×${eff.aoeMul}`);
  if(eff.aoeAdd)    lines.push(`범위 +${eff.aoeAdd}`);
  if(eff.addType)   lines.push(`+속성: ${eff.addType}`);
  if(eff.addTypes)  lines.push(`+속성: ${eff.addTypes.join(',')}`);
  if(eff.addCamo)   lines.push('카모 감지');
  if(eff.slowAdd)   lines.push(`둔화 +${Math.round(eff.slowAdd*100)}%`);
  if(eff.slowDurAdd)lines.push(`지속 +${eff.slowDurAdd}s`);
  return lines;
}

// ── Upgrade Tab ───────────────────────────────────────────────────────────
function drawUpgradeTab(){
  const isPreview = !G.selTower && G.previewType;
  const type = G.selTower ? G.selTower.type : G.previewType;
  if(!type) return;
  const d = TD[type];
  const tree = UT[type];
  const TYPE_ICON={slash:'⚔',pierce:'🏹',explosive:'💥',siege:'🪨',magic:'❄️',holy:'✨'};

  // Header — compact 40px
  let oy=PCY+4;
  const isz=24;
  if(ok(d.ic))ctx.drawImage(imgs[d.ic],4,oy,isz,isz);
  ctx.fillStyle='#c8a96e';ctx.font='bold 12px Arial';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText(d.name,34,oy+8);
  if(isPreview){ctx.fillStyle='#666677';ctx.font='8px Arial';ctx.fillText('미리보기',34,oy+20);}
  const dmg=G.selTower?G.selTower.stats.dmg:d.bDmg;
  const rng=G.selTower?G.selTower.stats.rng:d.bRng;
  const fps=G.selTower?G.selTower.stats.fps:d.bFps;
  const atks=G.selTower?G.selTower.stats.atkTypes:d.atkType;
  const camo=G.selTower?G.selTower.stats.canSeeCamo:d.baseCamo;
  const camoStr=camo?'  👁카모':'';
  const typeStr=atks.map(t=>TYPE_ICON[t]||t).join('');
  ctx.fillStyle='#cccccc';ctx.font='9px Arial';ctx.textBaseline='middle';
  ctx.fillText(`⚔${dmg}  📏${rng}  ⚡${fps.toFixed(1)}/s  속성:${typeStr}${camoStr}`,4,oy+30);
  oy+=40;

  // 3 upgrade paths — compact
  const BTN_W=84, BTN_GAP=3, BTN_H=30, PATH_HDR_H=15;
  const BTN_X0=Math.floor((CW-(5*BTN_W+4*BTN_GAP))/2);
  upgBtnRects.length=0;

  for(let pi=0;pi<3;pi++){
    const path=tree[pi];
    ctx.fillStyle=path.col+'dd';rr(4,oy,CW-8,PATH_HDR_H,3);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 9px Arial';ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillText(path.name,10,oy+PATH_HDR_H/2);
    if(G.selTower){ctx.textAlign='right';ctx.fillText(`${G.selTower.upgrades[pi]}/5`,CW-10,oy+PATH_HDR_H/2);}
    oy+=PATH_HDR_H+1;

    for(let ti=0;ti<5;ti++){
      const bx=BTN_X0+ti*(BTN_W+BTN_GAP);
      const tier=path.t[ti], tierName=tier[0], cost=tier[1];
      const purchased=G.selTower?G.selTower.upgrades[pi]>ti:false;
      const isNext=G.selTower?G.selTower.upgrades[pi]===ti:false;
      const blocked=isNext&&!G.selTower.canUpgrade(pi);
      const canAfford=G.gold>=cost;
      const isHov=hovUpgBtn&&hovUpgBtn.pi===pi&&hovUpgBtn.ti===ti;

      upgBtnRects.push({pi,ti,bx,by:oy,bw:BTN_W,bh:BTN_H,path,tier});

      if(isPreview){
        ctx.fillStyle='rgba(15,15,25,0.85)';ctx.strokeStyle=path.col+'66';ctx.lineWidth=1;
      }else{
        if(purchased)             ctx.fillStyle=path.col;
        else if(blocked)          ctx.fillStyle='rgba(20,20,20,0.9)';
        else if(isNext&&canAfford)ctx.fillStyle=path.bg||'rgba(30,30,30,0.9)';
        else if(isNext)           ctx.fillStyle='rgba(40,5,5,0.9)';
        else                      ctx.fillStyle='rgba(15,15,15,0.7)';
        if(purchased)              ctx.strokeStyle='rgba(255,255,255,0.7)';
        else if(blocked)           ctx.strokeStyle='rgba(60,60,60,0.5)';
        else if(isNext&&canAfford) ctx.strokeStyle=path.col;
        else if(isNext)            ctx.strokeStyle='#882222';
        else                       ctx.strokeStyle='rgba(60,60,60,0.4)';
        ctx.lineWidth=purchased?2:1;
      }
      if(isHov){ctx.strokeStyle='rgba(255,255,150,0.9)';ctx.lineWidth=2;}
      rr(bx,oy,BTN_W,BTN_H,4);ctx.fill();ctx.stroke();

      ctx.textAlign='center';ctx.textBaseline='top';
      if(purchased){
        ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold 11px Arial';ctx.fillText('✓',bx+BTN_W/2,oy+2);
      }else{
        ctx.fillStyle=isPreview?path.col:(blocked?'#444':(isNext?(canAfford?path.col:'#884444'):'#444'));
        ctx.font='bold 9px Arial';ctx.fillText(`T${ti+1}`,bx+BTN_W/2,oy+2);
      }
      const nm=tierName.length>5?tierName.slice(0,4)+'…':tierName;
      ctx.fillStyle=purchased?'rgba(255,255,255,0.85)':((isNext&&!blocked)||isPreview?'#cccccc':'#555');
      ctx.font='8px Arial';ctx.fillText(nm,bx+BTN_W/2,oy+13);
      ctx.textBaseline='bottom';
      if(!purchased){
        if(!isPreview&&blocked){ctx.fillStyle='#555';ctx.font='10px Arial';ctx.fillText('🔒',bx+BTN_W/2,oy+BTN_H);}
        else{
          ctx.fillStyle=isPreview?(canAfford?'#ffd700':'#886600'):(isNext&&canAfford)?'#ffd700':(isNext?'#ff5555':'#444');
          ctx.font=`bold ${cost>=1000?7:9}px Arial`;ctx.fillText(`${cost}g`,bx+BTN_W/2,oy+BTN_H-1);
        }
      }
    }
    oy+=BTN_H+3;
  }

  // Upgrade tooltip
  if(hovUpgBtn) drawUpgradeTooltip(hovUpgBtn);
}

function drawUpgradeTooltip(btn){
  const tier=btn.tier, tierName=tier[0], cost=tier[1], eff=tier[2]||{};
  const lines=fmtUpgEff(eff);
  const TW=150, LH=13, PAD=8;
  const TH=PAD*2+14+(lines.length||1)*LH;
  let tx=btn.bx+btn.bw/2-TW/2;
  let ty=btn.by-TH-4;
  tx=Math.max(4,Math.min(CW-TW-4,tx));
  ty=Math.max(HUD_H+4,ty);
  ctx.save();
  ctx.fillStyle='rgba(5,5,18,0.95)';ctx.strokeStyle=btn.path.col;ctx.lineWidth=1.5;
  rr(tx,ty,TW,TH,6);ctx.fill();ctx.stroke();
  ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillStyle='#ffffff';ctx.font='bold 10px Arial';
  ctx.fillText(`T${btn.ti+1} ${tierName}`,tx+PAD,ty+PAD);
  ctx.fillStyle='#ffd700';ctx.font='9px Arial';
  ctx.fillText(`💰 ${cost}g`,tx+PAD,ty+PAD+14);
  lines.forEach((ln,i)=>{
    ctx.fillStyle='#aaddff';ctx.font='9px Arial';
    ctx.fillText(ln,tx+PAD,ty+PAD+14+(i+1)*LH);
  });
  if(!lines.length){ctx.fillStyle='#555566';ctx.fillText('효과 없음',tx+PAD,ty+PAD+14+LH);}
  ctx.restore();
}

// ── Monster Tab ───────────────────────────────────────────────────────────
function drawMonsterTab(){
  const allMons=[...MONSTER_ORDER,'megaboss'];
  const perRow=6, iconR=14, cellW=CW/perRow, rowH=42;
  const startY=PCY+6;
  for(let i=0;i<allMons.length;i++){

    const col=i%perRow, row=Math.floor(i/perRow);

    const isz=iconR*2, ix=cx-iconR, iy=cy-iconR;

    rr(ix,iy,isz,isz,4);ctx.fillStyle=d.bgCol+'55';ctx.fill();
    if(hovMonsterMob===type){ctx.strokeStyle='rgba(255,255,100,0.9)';ctx.lineWidth=2;}
    else{ctx.strokeStyle=d.border;ctx.lineWidth=1;}
    ctx.stroke();
    ctx.clip();
    if(d.sprKey&&ok(d.sprKey))ctx.drawImage(imgs[d.sprKey],0,2*64,64,64,ix,iy,isz,isz);

// ── Tooltip helpers ───────────────────────────────────────────────────────
const TYPE_LABEL={slash:'베기⚔',pierce:'관통🏹',explosive:'폭발💥',siege:'둔기🪨',magic:'마법❄️',holy:'성✨'};

function drawMonsterTooltipAt(d,key,anchorX,anchorY,liveData){
  const tr=d.traits||{};
  const imm=tr.immune||[], res=tr.resist||[], wk=tr.weak||[];
  const PAD=12, TW=Math.min(300,CW-12), PR=22, LH=17;
  const FONT_DESC='10px Arial', FONT_TRAIT='10px Arial';
  const traits=[];
  if(imm.length) traits.push({c:'#ff6666',t:`✗ 면역: ${imm.map(k=>TYPE_LABEL[k]||k).join('  ')}`});
  if(res.length) traits.push({c:'#ffaa55',t:`△ 저항(35%): ${res.map(k=>TYPE_LABEL[k]||k).join('  ')}`});
  if(wk.length)  traits.push({c:'#55ddff',t:`★ 취약(175%): ${wk.map(k=>TYPE_LABEL[k]||k).join('  ')}`});
  if(tr.camo)       traits.push({c:'#aaffaa',t:'🥷 은신 — 카모 감지 타워 필요'});
  if(tr.slowImmune) traits.push({c:'#88eeff',t:'❄ 둔화/빙결 면역'});
  if(tr.armor)      traits.push({c:'#ddccaa',t:`🛡 방어력 ${tr.armor}`});
  if(tr.shield){const sh=liveData?liveData.shield:tr.shield;traits.push({c:'#ffee88',t:`⬡ 방패 ${sh}회 — 피해 무효`});}
  if(tr.regen)  traits.push({c:'#88ff88',t:`💚 HP 재생 ${tr.regen}/초`});
  if(tr.spawn)  traits.push({c:'#ffbb88',t:`🔀 소멸 시 ${MD[tr.spawn.type]?.name||tr.spawn.type} ×${tr.spawn.count}`});
  if(!traits.length) traits.push({c:'#555566',t:'특성 없음'});
  const descLines=wrapText(d.desc,TW-PAD*2,FONT_DESC);
  const headerH=PAD+PR*2+8, descH=descLines.length*14+6, traitH=traits.length*LH+6;
  const TH=headerH+descH+traitH;

  let tx=anchorX-TW/2, ty=anchorY-TH-8;
  tx=Math.max(4,Math.min(CW-TW-4,tx));
  ty=Math.max(HUD_H+4,Math.min(PANEL_Y-TH-4,ty));

  ctx.save();
  ctx.shadowColor='rgba(0,0,0,0.88)';ctx.shadowBlur=18;ctx.shadowOffsetX=3;ctx.shadowOffsetY=5;
  ctx.fillStyle='rgba(7,5,20,0.97)';ctx.strokeStyle=d.border;ctx.lineWidth=1.5;
  rr(tx,ty,TW,TH,8);ctx.fill();ctx.stroke();
  ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;
  ctx.save();rr(tx,ty,TW,PR*2+PAD*2+2,8);ctx.fillStyle=d.bgCol+'28';ctx.fill();ctx.restore();
  const px=tx+PAD, py=ty+PAD, psz=PR*2;
  ctx.save();
  rr(px,py,psz,psz,5);ctx.fillStyle=d.bgCol+'66';ctx.fill();ctx.strokeStyle=d.border;ctx.lineWidth=2;ctx.stroke();
  ctx.clip();
  if(d.sprKey&&ok(d.sprKey))ctx.drawImage(imgs[d.sprKey],0,2*64,64,64,px,py,psz,psz);
  ctx.restore();
  const nx=tx+PAD+PR*2+10, ny=ty+PAD;
  ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillStyle='#ffffff';ctx.font='bold 13px Arial';ctx.fillText(d.name,nx,ny);
  if(liveData){
    const pct=Math.max(0,Math.ceil(liveData.hp)/liveData.maxHp);
    const bx=nx,by=ny+18,bw=TW-(nx-tx)-PAD-2,bh=7;
    ctx.fillStyle='#1a1a2e';rr(bx,by,bw,bh,2);ctx.fill();
    ctx.fillStyle=pct>0.5?'#44ee77':pct>0.25?'#ffcc44':'#ff4444';
    rr(bx,by,Math.max(3,bw*pct),bh,2);ctx.fill();
    ctx.fillStyle='#aabbcc';ctx.font='10px Arial';ctx.fillText(`HP ${Math.ceil(liveData.hp)}/${liveData.maxHp}`,nx,by+10);
  }else{
    ctx.fillStyle='#aabbcc';ctx.font='10px Arial';ctx.fillText(`HP ${d.hp}  ·  속도 ${d.spd}`,nx,ny+16);
    ctx.fillStyle='#c8a96e';ctx.fillText(`보상 ${d.rew}g`,nx,ny+28);
  }
  let oy=ty+PAD+PR*2+8;
  ctx.fillStyle='#8899aa';ctx.font=FONT_DESC;ctx.textBaseline='top';
  for(const dl of descLines){ctx.fillText(dl,tx+PAD,oy);oy+=14;}
  oy+=4;
  for(const ln of traits){ctx.fillStyle=ln.c;ctx.font=FONT_TRAIT;ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(ln.t,tx+PAD,oy);oy+=LH;}
  ctx.restore();
}

// ── Live balloon tooltip ──────────────────────────────────────────────────
let hovLiveBalloon=null;
let hovMonsterMob=null;
let hovUpgBtn=null;
const upgBtnRects=[];
let _touchClearTimer=null;

function getLiveBalloonAt(mx,my){
  if(!G||!G.balloons)return null;
  if(my<HUD_H||my>=PANEL_Y)return null;
  for(const b of G.balloons){
    if(!b.alive)continue;
    if(Math.hypot(mx-b.x,my-b.y)<=b.rad+8)return b;
  }
  return null;
}
function drawLiveBalloonTooltip(){
  if(!hovLiveBalloon||!hovLiveBalloon.alive){hovLiveBalloon=null;return;}
  const key=hovLiveBalloon.type, d=MD[key]; if(!d)return;
  let ty=hovLiveBalloon.y-20;
  drawMonsterTooltipAt(d,key,hovLiveBalloon.x,ty,hovLiveBalloon);
}

// ── Monster panel tooltip state ───────────────────────────────────────────
function getMonsterTabAt(mx,my){
  if(G.mobileTab!==2)return null;
  if(my<PCY||my>=CH)return null;
  const allMons=[...MONSTER_ORDER,'megaboss'];
  const perRow=6, iconR=14, cellW=CW/perRow, rowH=42;
  const startY=PCY+6;
  for(let i=0;i<allMons.length;i++){
    const col=i%perRow, row=Math.floor(i/perRow);
    const cx=col*cellW+cellW/2, cy=startY+row*rowH+iconR;
    if(Math.hypot(mx-cx,my-cy)<=iconR+4)return allMons[i];
  }
  return null;
}

// ── Game Over / Victory Overlay ───────────────────────────────────────────
let restartBtn=null;
function drawOverlay(){
  if(G.state!=='gameover'&&G.state!=='victory'){restartBtn=null;return;}
  ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,CW,CH);
  const cx=CW/2, cy=CH/2;
  if(G.state==='gameover'){
    ctx.fillStyle='#ff4444';ctx.font='bold 46px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('⚔ 게임 오버',cx,cy-60);
    ctx.fillStyle='#c8a96e';ctx.font='18px Arial';ctx.fillText(`웨이브 ${G.wave}에서 방어 실패`,cx,cy-16);
  }else{
    ctx.fillStyle='#ffd700';ctx.font='bold 44px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('🏆 40웨이브 완파!',cx,cy-60);
    ctx.fillStyle='#c8a96e';ctx.font='18px Arial';ctx.fillText('모든 웨이브 격파!',cx,cy-16);
  }
  ctx.fillStyle='#bbbbff';ctx.font='15px Arial';
  ctx.fillText(`점수: ${G.score.toLocaleString()}  ·  생명: ${G.lives}`,cx,cy+12);
  const rbx=cx-80, rby=cy+40, rbw=160, rbh=46;
  ctx.fillStyle='#1e3e1e';ctx.strokeStyle='#44aa44';ctx.lineWidth=2;
  rr(rbx,rby,rbw,rbh,8);ctx.fill();ctx.stroke();
  ctx.fillStyle='#88ff88';ctx.font='bold 16px Arial';ctx.textAlign='center';ctx.fillText('다시 시작',cx,rby+rbh/2);
  restartBtn={x:rbx,y:rby,w:rbw,h:rbh};
}

// ── Info Overlay ──────────────────────────────────────────────────────────
function drawInfoOverlay(){
  if(!G.showInfo)return;
  const TX=8, TY=HUD_H+4, TW=CW-16, TH=CH-HUD_H-PANEL_H-12;
  ctx.fillStyle='rgba(8,5,18,0.97)';ctx.strokeStyle='#c8a96e';ctx.lineWidth=1.5;
  rr(TX,TY,TW,TH,10);ctx.fill();ctx.stroke();

  // Close
  const clx=TX+TW-36, cly=TY+6;
  ctx.fillStyle='#2a0a0a';ctx.strokeStyle='#884444';ctx.lineWidth=1;
  rr(clx,cly,30,26,5);ctx.fill();ctx.stroke();
  ctx.fillStyle='#ffaaaa';ctx.font='bold 13px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('✕',clx+15,cly+13);

  ctx.fillStyle='#c8a96e';ctx.font='bold 13px Arial';ctx.textAlign='center';ctx.textBaseline='top';
  ctx.fillText('[ 몬스터 속성 가이드 ]',TX+TW/2,TY+8);

  const PAD=10, CARD_W=Math.floor((TW-PAD*2)/6), CARD_H=80;
  const allMons=[...MONSTER_ORDER,'megaboss'];
  const startY=TY+28;
  allMons.forEach((mkey,idx)=>{
    const d=MD[mkey]; if(!d)return;
    const col=idx%6, row=Math.floor(idx/6);
    const cardX=TX+PAD+col*CARD_W, cardY=startY+row*(CARD_H+4);
    if(cardY+CARD_H>TY+TH-8)return;
    ctx.fillStyle='rgba(8,8,22,0.92)';ctx.strokeStyle='#c8a96e';ctx.lineWidth=1;
    rr(cardX,cardY,CARD_W-2,CARD_H,5);ctx.fill();ctx.stroke();
    const pr=12, pcx=cardX+CARD_W/2-1, pcy=cardY+16;
    const isz=pr*2, ix=pcx-pr, iy=pcy-pr;
    ctx.save();
    rr(ix,iy,isz,isz,4);ctx.fillStyle=d.bgCol+'55';ctx.fill();ctx.strokeStyle=d.border;ctx.lineWidth=1.2;ctx.stroke();
    ctx.clip();
    if(d.sprKey&&ok(d.sprKey))ctx.drawImage(imgs[d.sprKey],0,2*64,64,64,ix,iy,isz,isz);
    ctx.restore();
    ctx.fillStyle='#ffd98b';ctx.font='bold 8px Arial';ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillText(d.name,pcx,cardY+30);
    const tr=d.traits||{}, imm=tr.immune||[], res=tr.resist||[], wk=tr.weak||[];
    let y=cardY+40;
    const shortLabel=k=>{const m={slash:'베',pierce:'관',explosive:'폭',siege:'둔',magic:'마',holy:'성'};return m[k]||k;};
    if(imm.length){ctx.fillStyle='#ff5555';ctx.font='7px Arial';ctx.fillText(`✗${imm.map(shortLabel).join('')}`,pcx,y);y+=10;}
    if(res.length){ctx.fillStyle='#ffaa55';ctx.font='7px Arial';ctx.fillText(`△${res.map(shortLabel).join('')}`,pcx,y);y+=10;}
    if(wk.length){ctx.fillStyle='#55ddff';ctx.font='7px Arial';ctx.fillText(`★${wk.map(shortLabel).join('')}`,pcx,y);y+=10;}
    const extras=[];
    if(tr.camo)extras.push('🥷');if(tr.slowImmune)extras.push('❄');if(tr.armor)extras.push(`🛡${tr.armor}`);if(tr.regen)extras.push(`💚${tr.regen}`);
    if(extras.length){ctx.fillStyle='#aaccee';ctx.font='8px Arial';ctx.fillText(extras.join(' '),pcx,y);}
  });
}

// ── Input ─────────────────────────────────────────────────────────────────
let hovC=-1, hovR=-1;
const mouse={x:0,y:0};

function getCanvasPos(clientX, clientY){
  const rc=canvas.getBoundingClientRect();
  const scaleX=CW/rc.width, scaleY=CH/rc.height;
  return {x:(clientX-rc.left)*scaleX, y:(clientY-rc.top)*scaleY};
}

canvas.addEventListener('mousemove', e=>{
  const {x,y}=getCanvasPos(e.clientX,e.clientY);
  mouse.x=x; mouse.y=y;
  hovC=Math.floor(x/CELL);
  hovR=Math.floor((y-HUD_H)/CELL);
  if(y<PANEL_Y){
    hovLiveBalloon=getLiveBalloonAt(x,y);
    hovMonsterMob=null; hovUpgBtn=null;
  }else{
    hovLiveBalloon=null;
    if(G.mobileTab===2) hovMonsterMob=getMonsterTabAt(x,y);
    else hovMonsterMob=null;
    if(G.mobileTab===1) hovUpgBtn=upgBtnRects.find(r=>x>=r.bx&&x<r.bx+r.bw&&y>=r.by&&y<r.by+r.bh)||null;
    else hovUpgBtn=null;
  }
});

canvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  AudioSys.unlock();
  const t=e.touches[0];
  const {x,y}=getCanvasPos(t.clientX,t.clientY);
  mouse.x=x; mouse.y=y;
  hovC=Math.floor(x/CELL);
  hovR=Math.floor((y-HUD_H)/CELL);
  // Monster tab tap
  const mk=getMonsterTabAt(x,y);
  if(mk){
    hovMonsterMob=(hovMonsterMob===mk)?null:mk;
    clearTimeout(_touchClearTimer);
    _touchClearTimer=setTimeout(()=>{hovMonsterMob=null;},3000);
    return;
  }
  // Live balloon tap
  const lb=getLiveBalloonAt(x,y);
  if(lb){hovLiveBalloon=lb;clearTimeout(_touchClearTimer);_touchClearTimer=setTimeout(()=>{hovLiveBalloon=null;},2500);return;}
  handleClick(x,y);
},{passive:false});

canvas.addEventListener('touchend', e=>{
  e.preventDefault();
},{passive:false});

canvas.addEventListener('click', ()=>handleClick(mouse.x,mouse.y));

canvas.addEventListener('contextmenu', e=>{
  e.preventDefault();
  G.selTower=null; G.mobileTab=0;
});

function handleClick(mx,my){
  AudioSys.unlock();
  if(G.state==='gameover'||G.state==='victory'){
    if(restartBtn){const b=restartBtn;if(mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h){AudioSys.play('ui');initGame();loadBestMap();return;}}
    return;
  }
  // Info overlay close
  if(G.showInfo){
    const TX=8, TY=HUD_H+4, TW=CW-16;
    const clx=TX+TW-36, cly=TY+6;
    if(mx>=clx&&mx<=clx+30&&my>=cly&&my<=cly+26){AudioSys.play('ui');G.showInfo=false;return;}
    AudioSys.play('ui');G.showInfo=false;return;
  }
  // HUD row 2 buttons
  if(my>=28&&my<HUD_H){
    if(G.state==='rest'&&mx>=8&&mx<=208){AudioSys.play('ui');startWave();return;}
    if(mx>=214&&mx<=274){AudioSys.play('ui');G.ff=!G.ff;return;}
    if(mx>=280&&mx<=324){AudioSys.play('ui');G.showInfo=!G.showInfo;return;}
    if(G.selTower&&mx>=330&&mx<=410){
      G.gold+=G.selTower.sellVal;
      AudioSys.play('sell');
      G.towers=G.towers.filter(t=>t!==G.selTower);
      G.selTower=null;G.mobileTab=0;return;
    }
    return;
  }
  // HUD row 1
  if(my<HUD_H)return;

  // Bottom panel
  if(my>=PANEL_Y){
    // Tab bar
    if(my<PANEL_Y+TAB_H){
      const ti=Math.floor(mx/(CW/3));
      if(ti===1&&!G.selTower)return; // disabled
      AudioSys.play('ui');
      G.mobileTab=ti;return;
    }
    // Upgrade buttons
    if(G.mobileTab===1&&G.selTower){
      handleUpgradeClickMob(mx,my);return;
    }
    // Tower shop card tap
    if(G.mobileTab===0){
      const CARD_W=96, CARD_Y=PCY+4;
      if(my>=CARD_Y&&my<CARD_Y+86){
        const idx=Math.floor(mx/CARD_W);
        if(idx>=0&&idx<TOWER_ORDER.length){
          AudioSys.play('ui');
          G.selType=TOWER_ORDER[idx];
          G.previewType=TOWER_ORDER[idx];
          G.mobileTab=1;
          return;
        }
      }
    }
    return;
  }

  // Game area
  const col=Math.floor(mx/CELL), row=Math.floor((my-HUD_H)/CELL);
  if(col<0||col>=COLS||row<0||row>=ROWS)return;
  const existing=G.towers.find(t=>col>=t.col&&col<t.col+2&&row>=t.row&&row<t.row+2);
  if(existing){ AudioSys.play('ui'); G.selTower=existing; G.previewType=null; G.mobileTab=1; return; }
  G.selTower=null; G.previewType=null; G.mobileTab=0;
  if(!isBuildable2x2(col,row))return;
  if(G.towers.some(t=>col+2>t.col&&col<t.col+2&&row+2>t.row&&row<t.row+2))return;
  if(G.gold>=TD[G.selType].cost){
    G.gold-=TD[G.selType].cost;
    G.towers.push(new Tower(G.selType,col,row));
    AudioSys.play('place');
  }
}

function handleUpgradeClickMob(mx,my){
  const t=G.selTower; if(!t)return;
  const BTN_W=84, BTN_GAP=3, BTN_H=38, PATH_HDR_H=20;
  const BTN_X0=Math.floor((CW-(5*BTN_W+4*BTN_GAP))/2);
  let oy=PCY+4+54; // header + stats
  for(let pi=0;pi<3;pi++){
    oy+=PATH_HDR_H+2;
    if(my>=oy&&my<oy+BTN_H){
      const relX=mx-BTN_X0;
      const ti=Math.floor(relX/(BTN_W+BTN_GAP));
      if(ti>=0&&ti<5){
        const bx=BTN_X0+ti*(BTN_W+BTN_GAP);
        if(mx>=bx&&mx<bx+BTN_W){
          if(t.upgrades[pi]===ti && t.doUpgrade(pi)) AudioSys.play('upgrade');
          return;
        }
      }
    }
    oy+=BTN_H+4;
  }
}

// ── Game Loop ─────────────────────────────────────────────────────────────
let lastT=0;
function loop(ts){
  const rawDt=Math.min((ts-lastT)/1000,0.05);lastT=ts;
  ctx.clearRect(0,0,CW,CH);
  const dt=rawDt*(G.ff?2:1);
  AudioSys.update(rawDt);
  if(G.state==='wave'){
    updateSpawner(dt);updateBalloons(dt);updateTowers(dt);
    updateProjectiles(dt);updateExplosions(dt);checkWaveDone();
    G.balloons=G.balloons.filter(b=>b.alive);
    G.projectiles=G.projectiles.filter(p=>p.alive);
    G.explosions=G.explosions.filter(e=>e.alive);
  }
  if(G.state==='rest'){
    if(isFinite(G.restTimer))G.restTimer-=rawDt;
    updateExplosions(dt);G.explosions=G.explosions.filter(e=>e.alive);
    if(G.restTimer<=0)startWave();
  }
  drawBG();drawGrid();drawTowers();drawBalloons();drawProjectiles();drawExplosions();
  drawWaveProgress();drawHUD();drawBottomPanel();drawLiveBalloonTooltip();drawOverlay();drawInfoOverlay();
  requestAnimationFrame(loop);
}

// ── Boot ──────────────────────────────────────────────────────────────────
initGame();loadBestMap();loadAssets();requestAnimationFrame(loop);
</script>
